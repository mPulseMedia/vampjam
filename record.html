<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vampsf — Record</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  }
  .top_bar { width: 100%; max-width: 560px; position: relative; text-align: center; min-height: 44px; margin-top: 4px; }
  .top_bar .back_btn { position: absolute; left: 0; top: 8px; }
  .wordmark {
    font-family: 'Sacramento', cursive;
    font-size: 58px; line-height: 1; color: var(--fg);
    display: inline-block; margin: 0;
  }
  .wordmark_sf {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 29px; font-weight: 650; letter-spacing: 0.5px; margin-left: 3px;
  }
  .back_btn {
    display: flex; align-items: center; gap: 4px;
    background: none; border: none; padding: 8px 12px 8px 0; margin-left: -4px;
    color: var(--muted); font: inherit; font-size: 16px; cursor: pointer;
  }
  .back_btn svg { width: 20px; height: 20px; }
  .name_row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; max-width: 560px; margin-top: 6px;
  }
  #name_in {
    background: none; border: none; outline: none; text-align: center;
    color: var(--muted); font: inherit; font-size: 20px; font-weight: 500;
    width: auto; min-width: 40px; max-width: 80%;
    border-bottom: 1px dashed transparent; padding: 2px 4px;
  }
  #name_in:focus { color: var(--fg); border-bottom-color: var(--panel_3); }
  .pencil_btn {
    background: none; border: none; padding: 6px; cursor: pointer;
    color: var(--muted); opacity: 0.7; display: flex;
  }
  .pencil_btn svg { width: 17px; height: 17px; }

  .stage { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 14px; }

  /* control row mirrors the playback page — side buttons present but inert */
  .ctrl_row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .ctrl_btn {
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: var(--panel_2); color: var(--accent);
    font: inherit; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    display: none;   /* nothing to seek while recording */
  }
  .rec_btn {
    width: 92px; height: 92px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 38px; line-height: 1;
    background: var(--panel_2); color: #d70015; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  }
  .rec_btn.recording { background: #d70015; color: #fff; animation: rec_pulse 1.2s ease-in-out infinite; }
  @keyframes rec_pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(215,0,21,0.45); } 50% { box-shadow: 0 0 0 14px rgba(215,0,21,0); } }
  .rec_state { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 17px; min-height: 24px; font-variant-numeric: tabular-nums; }
  .rec_dot { width: 10px; height: 10px; border-radius: 50%; background: #d70015; opacity: 0; }
  .rec_state.on .rec_dot { opacity: 1; animation: dot_blink 1.2s ease-in-out infinite; }
  .rec_state.on { color: var(--fg); }
  @keyframes dot_blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .tag_btn {
    width: 100%; max-width: 300px; padding: 18px 20px; border: none; border-radius: 999px;
    background: linear-gradient(180deg, var(--accent_hover, #339cff) 0%, var(--accent) 55%, var(--accent_active, #0062c4) 100%);
    color: var(--on_accent, #fff);
    font: inherit; font-size: 20px; font-weight: 700; letter-spacing: 0.01em; cursor: pointer;
    box-shadow: 0 10px 22px -8px var(--accent), 0 3px 8px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.28);
    transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .tag_btn:hover { filter: brightness(1.06); }
  .tag_btn:active {
    transform: scale(0.96) translateY(1px); filter: brightness(0.96);
    box-shadow: 0 5px 12px -6px var(--accent), 0 2px 4px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .tag_btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

  /* the growing time bar — same bones as the playback page, but it charts the
     recording so far: 10-minute segments, hour marks, moment dots. No playhead. */
  .bar_wrap { width: 100%; }   /* visible from load — the bar waits in place */
  .num_strip { position: relative; height: 16px; margin-bottom: 3px; width: 100%; }
  .mom_no { position: absolute; transform: translateX(-50%); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; padding: 2px 5px; z-index: 4; }
  .time_row { display: flex; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .time_row .now { color: var(--accent); font-weight: 600; }
  .rec_bar {
    width: 100%; height: 9px; background: var(--panel_3); border-radius: 4px;
    position: relative; pointer-events: none;
  }
  .rec_bar.filled { background: var(--accent); }   /* recording: the whole bar is recorded audio */
  .seg_tick { position: absolute; top: 0; bottom: 0; width: 5px; background: var(--bg); transform: translateX(-50%); }
  .hour_mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--muted); opacity: 0.7; border-radius: 1px; transform: translateX(-50%); z-index: 1; }
  .hour_lbl { position: absolute; top: calc(100% + 5px); transform: translateX(-50%); font-size: 13px; line-height: 1; color: var(--muted); }


  /* moments list — same shape as the playback page's highlight list */
  .mom_list {
    width: 100%; background: var(--panel); border-radius: 14px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 0 8px; display: none;
    box-shadow: inset 0 6px 7px -5px rgba(0,0,0,0.20);
  }
  .mom_row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px; min-height: 50px;
  }
  .mom_row.flash { background: var(--row_active); transition: background 0.25s; }
  .mom_num { flex: 0 0 auto; color: var(--muted); font-size: 13px; min-width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .mom_name {
    flex: 1 1 60px; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--fg); font: inherit; font-size: 17px; padding: 4px 2px;
    border-bottom: 1px dashed transparent;
  }
  .mom_name:focus { border-bottom-color: var(--panel_3); }
  .mom_name::placeholder { color: var(--muted); opacity: 0.6; }
  .mom_time { display: none; }   /* row_time_hide: timestamps off the moment rows for now */

  .status { min-height: 40px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 480px; word-break: break-word; }

  /* full_width: phone landscape stretches the record screen edge to edge */
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 520px) {
    body { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
    .top_bar, .name_row, .stage { max-width: none; }
  }
  .status a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div class="top_bar">
  <button class="back_btn" id="back_btn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Back</span>
  </button>
  <div class="wordmark">vamp<span class="wordmark_sf">SF</span></div>
</div>

<div class="name_row">
  <input id="name_in" type="text" autocomplete="off" autocapitalize="words" aria-label="Session name">
  <button class="pencil_btn" id="pencil_btn" aria-label="Edit session name">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
  </button>
</div>

<div class="stage">
  <div class="ctrl_row">
    <button class="ctrl_btn" tabindex="-1">&minus;2m</button>
    <button class="ctrl_btn" tabindex="-1">&minus;15s</button>
    <button class="ctrl_btn" tabindex="-1">&minus;5s</button>
    <button class="rec_btn" id="rec_btn" aria-label="Record">&#9679;</button>
    <button class="ctrl_btn" tabindex="-1">+5s</button>
    <button class="ctrl_btn" tabindex="-1">+15s</button>
    <button class="ctrl_btn" tabindex="-1">+2m</button>
  </div>
  <div class="rec_state" id="rec_state"><span class="rec_dot"></span><span id="rec_time">0:00</span></div>
  <div class="bar_wrap" id="bar_wrap">
    <div class="num_strip" id="num_strip"></div>
    <div class="rec_bar" id="rec_bar"></div>
    <div class="time_row"><span class="now" id="cur_time">0:00</span><span>/</span><span id="dur_time">0:00</span></div>
  </div>
  <button class="tag_btn" id="tag_btn" disabled>Tag the moment</button>
  <div class="mom_list" id="mom_list"></div>
  <div class="status" id="status"></div>
</div>

<script>
(function () {
  var WORKER_UPLOAD_URL = 'https://vampjam-upload.crimson-dust-a18d.workers.dev/';
  var WORKER_SYNC_URL   = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var RAW_BASE          = 'https://raw.githubusercontent.com/mPulseMedia/vampjam/main/';
  var SEG = 600;   // the bar breaks into 10-minute segments, like playback

  var backBtn = document.getElementById('back_btn'),
      nameIn  = document.getElementById('name_in'),
      pencil  = document.getElementById('pencil_btn'),
      recBtn  = document.getElementById('rec_btn'),
      recState= document.getElementById('rec_state'),
      timeEl  = document.getElementById('rec_time'),
      tagBtn  = document.getElementById('tag_btn'),
      barWrap = document.getElementById('bar_wrap'),
      recBar  = document.getElementById('rec_bar'),
      numStrip = document.getElementById('num_strip'),
      curTimeEl = document.getElementById('cur_time'),
      durTimeEl = document.getElementById('dur_time'),
      momList = document.getElementById('mom_list'),
      status  = document.getElementById('status');

  // Back always returns to the session list. Mid-recording it behaves like
  // stop: finish, upload, build the session, THEN leave.
  var pendingBack = false;
  backBtn.addEventListener('click', function () {
    if (mediaRec && mediaRec.state === 'recording') {
      pendingBack = true;
      status.textContent = 'Finishing…';
      stop();
      return;
    }
    window.location.href = 'index.html#sessions';
  });
  pencil.addEventListener('click', function () { nameIn.focus(); nameIn.select(); });

  // ---- session name: date + local time by default; date + city with location ----
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var d0 = new Date();
  var ISO = d0.getFullYear() + '-' + pad(d0.getMonth() + 1) + '-' + pad(d0.getDate());
  var h24 = d0.getHours();
  var TS  = ((h24 % 12) || 12) + ':' + pad(d0.getMinutes()) + ':' + pad(d0.getSeconds()) + (h24 < 12 ? 'a' : 'p');
  var DEFT = ISO + ' ' + TS;
  nameIn.value = DEFT;
  function size_name() { nameIn.style.width = Math.max(3, nameIn.value.length + 1) + 'ch'; }
  nameIn.addEventListener('input', size_name); size_name();
  var nameEdited = false;
  nameIn.addEventListener('input', function () { nameEdited = true; });
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + pos.coords.latitude +
            '&longitude=' + pos.coords.longitude + '&localityLanguage=en')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var city = j && (j.locality || j.city);
          if (city && !nameEdited) { nameIn.value = ISO + ' ' + city; size_name(); }
        }).catch(function () {});
    }, function () {}, { timeout: 6000, maximumAge: 600000 });
  }

  // ---- recording ----
  // ---- local store: every recording persists to IndexedDB as it happens, so
  // a reload, crash, or failed upload never loses audio. A recording stays
  // 'local' (visible in the session list) until the cloud has it.
  function rec_db() {
    return new Promise(function (res, rej) {
      var rq = indexedDB.open('vampjam_rec', 1);
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains('recs')) db.createObjectStore('recs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks', { keyPath: ['id', 'seq'] });
      };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    });
  }
  function idb_put(store, val) {
    return rec_db().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val);
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function idb_all(store) {
    return rec_db().then(function (db) {
      return new Promise(function (res, rej) {
        var g = db.transaction(store, 'readonly').objectStore(store).getAll();
        g.onsuccess = function () { res(g.result || []); };
        g.onerror = function () { rej(g.error); };
      });
    });
  }
  function idb_chunks(id) {
    return rec_db().then(function (db) {
      return new Promise(function (res, rej) {
        var g = db.transaction('chunks', 'readonly').objectStore('chunks')
          .getAll(IDBKeyRange.bound([id, 0], [id, Infinity]));
        g.onsuccess = function () {
          res((g.result || []).sort(function (x, y) { return x.seq - y.seq; }).map(function (c) { return c.blob; }));
        };
        g.onerror = function () { rej(g.error); };
      });
    });
  }
  function idb_del_rec(id) {
    return rec_db().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(['recs', 'chunks'], 'readwrite');
        tx.objectStore('recs').delete(id);
        tx.objectStore('chunks').delete(IDBKeyRange.bound([id, 0], [id, Infinity]));
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  var mediaRec = null, chunks = [], startT = 0, timer = null, blob = null, mime = '', ext = 'm4a';
  var LOC_ID = null, chunkSeq = 0;
  function live_tag_data() {
    return liveTags.map(function (lt) {
      var nm = '';
      try { nm = (lt.row.querySelector('.mom_name').value || '').trim(); } catch (e) {}
      return { t: lt.t, label: nm };
    });
  }
  function save_meta(state) {
    if (!LOC_ID) return;
    idb_put('recs', {
      id: LOC_ID, label: nameIn.value || DEFT, date: ISO,
      dur: Math.round(elapsed()), tags: live_tag_data(),
      state: state, ts: Date.now(), mime: mime, ext: ext
    }).catch(function () {});
  }
  var liveTags = [], recDur = 0;   // liveTags: [{ t: seconds, row: element }]
  var debugT = null;               // test hook: overrides elapsed for bar rendering

  function pickMime() {
    var c = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
    for (var i = 0; i < c.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i];
    }
    return '';
  }
  function fmt(s) { s = Math.floor(s); var m = Math.floor(s / 60), ss = s % 60; return m + ':' + pad(ss); }
  function elapsed() {
    if (debugT !== null) return debugT;
    if (mediaRec && mediaRec.state === 'recording') return (Date.now() - startT) / 1000;
    return recDur;
  }
  function tick() { timeEl.textContent = fmt(elapsed()); render_bar(); }

  // ---- the growing bar: segments, hour marks, moment dots (no playhead) ----
  function render_bar() {
    var t = elapsed();
    recBar.classList.toggle('filled', t > 0);
    if (t <= 0) {
      // not recording yet: the empty light-gray bar sits where it will live
      recBar.innerHTML = ''; numStrip.innerHTML = '';
      curTimeEl.textContent = '0:00'; durTimeEl.textContent = '0:00';
      return;
    }
    var html = '';
    for (var k = SEG; k < t; k += SEG) {
      html += '<div class="seg_tick" style="left:' + (k / t * 100) + '%"></div>';
    }
    for (var h = 3600; h < t; h += 3600) {
      var x = h / t * 100;
      html += '<div class="hour_mark" style="left:' + x + '%"></div>' +
              '<div class="hour_lbl" style="left:' + x + '%">' + (h / 3600) + 'h</div>';
    }
    recBar.innerHTML = html;
    var nums = '';
    liveTags.forEach(function (lt, i) {
      var x = (lt.t / t * 100);
      nums += '<div class="mom_no" data-i="' + i + '" style="left:' + x + '%" title="moment ' + (i + 1) + ' @ ' + fmt(lt.t) + '">' + (i + 1) + '</div>';
    });
    numStrip.innerHTML = nums;
    // while recording, the current time IS the duration — shown as a pair anyway
    // so the bar reads like the playback page
    curTimeEl.textContent = fmt(t);
    durTimeEl.textContent = fmt(t);
  }
  // a number doesn't move any playhead (there is none) — it scrolls to its row
  numStrip.addEventListener('click', function (e) {
    var d = e.target.closest ? e.target.closest('.mom_no') : null;
    if (!d) return;
    var lt = liveTags[parseInt(d.getAttribute('data-i'), 10)];
    if (!lt || !lt.row) return;
    lt.row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    lt.row.classList.add('flash');
    setTimeout(function () { lt.row.classList.remove('flash'); }, 900);
  });

  // ---- moments list: grows with every tag; names are editable and ship with the session ----
  function add_moment() {
    // keyboard already up (naming the previous moment)? put it away FIRST —
    // Safari misbehaves when focus hops between fields mid-keyboard — then
    // create the row and hand the keyboard straight to the new name below.
    var act = document.activeElement;
    if (act && act.blur && act.classList && act.classList.contains('mom_name')) {
      act.blur();
    }
    var sec = Math.round(elapsed() * 10) / 10;
    var row = document.createElement('div');
    row.className = 'mom_row';
    var n = liveTags.length + 1;
    row.innerHTML = '<span class="mom_num">' + n + '</span>' +
      '<input class="mom_name" type="text" autocomplete="off" autocapitalize="sentences" inputmode="text">' +
      '<span class="mom_time">' + fmt(sec) + '</span>';
    momList.appendChild(row);
    momList.style.display = 'block';
    liveTags.push({ t: sec, row: row });
    render_bar();
    // caret straight into the empty name — synchronously, inside the tap
    // gesture, so the phone keyboard opens (desktop just gets the blinking beam)
    var inp = row.querySelector('.mom_name');
    if (inp) {
      // preventScroll: iOS otherwise scrolls the page into the void ("black
      // shelf") when focus moves between inputs while the keyboard is up
      try { inp.focus({ preventScroll: true }); } catch (eF) { inp.focus(); }
      try { inp.setSelectionRange(0, 0); } catch (e) {}
      // the page stays put; the LIST scrolls the new row into view above the keyboard
      setTimeout(function () {
        window.scrollTo(0, 0);
        fit_mom_list();
        momList.scrollTop = momList.scrollHeight;
      }, 0);
      setTimeout(function () {
        window.scrollTo(0, 0);
        fit_mom_list();
        momList.scrollTop = momList.scrollHeight;
      }, 350);   // again after the keyboard finishes animating in
    }
  }

  async function start() {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mime = pickMime(); ext = mime.indexOf('webm') >= 0 ? 'webm' : 'm4a';
      mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = []; liveTags = []; recDur = 0; blob = null;
      LOC_ID = 'loc_' + Date.now(); chunkSeq = 0;
      momList.innerHTML = ''; momList.style.display = 'none';
      save_meta('recording');   // the local session row exists from second zero
      recBar.innerHTML = ''; numStrip.innerHTML = '';
      mediaRec.ondataavailable = function (e) {
        if (e.data && e.data.size) {
          chunks.push(e.data);
          // persist as we go — a reload mid-recording keeps everything so far
          idb_put('chunks', { id: LOC_ID, seq: chunkSeq++, blob: e.data }).catch(function () {});
          save_meta('recording');
        }
      };
      mediaRec.onstop = function () {
        blob = new Blob(chunks, { type: mime || 'audio/mp4' });
        stream.getTracks().forEach(function (t) { t.stop(); });
        save_meta('ready');
        upload();
      };
      mediaRec.start(5000);   // 5s slices so the local copy is never far behind
      startT = Date.now(); timer = setInterval(tick, 250); tick();
      recBtn.classList.add('recording'); recBtn.innerHTML = '&#9632;';
      recState.classList.add('on');
      tagBtn.disabled = false;
      status.textContent = '';
    } catch (err) {
      status.textContent = 'microphone blocked: ' + (err && err.message ? err.message : err);
    }
  }
  function stop() {
    recDur = Math.round((Date.now() - startT) / 1000);
    if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
    clearInterval(timer);
    recBtn.classList.remove('recording'); recBtn.innerHTML = '&#9679;';
    recState.classList.remove('on');
    tagBtn.disabled = true;
    render_bar();
  }
  recBtn.addEventListener('click', function () {
    if (mediaRec && mediaRec.state === 'recording') stop(); else start();
  });

  tagBtn.addEventListener('click', function () {
    if (!mediaRec || mediaRec.state !== 'recording') return;
    add_moment();
  });

  // ---- upload + auto session (stop -> straight to a ready session) ----
  function slug(t) {
    return String(t).toLowerCase()
      .replace(/[—–-]/g, '_').replace(/[^a-z0-9_]+/g, '_')
      .replace(/_+/g, '_').replace(/^_|_$/g, '');
  }
  function rec_id() {
    var id = slug(nameIn.value) || 'rec';
    if (!/\d{4}_\d{2}_\d{2}/.test(id)) id += '_' + ISO.replace(/-/g, '_');
    var t6 = TS.replace(/:/g, '_');
    if (id.indexOf(t6) < 0) id += '_' + t6;
    return id;
  }
  function not_deleted(list) {
    var dead = [];
    try { dead = (JSON.parse(localStorage.getItem('vampjam_deleted_pages') || '[]') || []).map(function (t) { return t.page; }); } catch (e) {}
    return list.filter(function (e2) { return e2 && dead.indexOf(e2.page) < 0; });
  }
  function sync_write(path, content, message) {
    return fetch(WORKER_SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path, content: content, message: message })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('sync ' + r.status + ': ' + t.slice(0, 80)); });
      return r.json();
    });
  }
  function rec_id_from(label, dateIso, ts) {
    var id = slug(label) || 'rec';
    if (!/\d{4}_\d{2}_\d{2}/.test(id)) id += '_' + dateIso.replace(/-/g, '_');
    if (!/\d{1,2}_\d{2}_\d{2}[ap]/.test(id)) {
      var d = new Date(ts || Date.now());
      id += '_' + ((d.getHours() % 12) || 12) + '_' + pad(d.getMinutes()) + '_' + pad(d.getSeconds()) + (d.getHours() < 12 ? 'a' : 'p');
    }
    return id;
  }
  async function upload() {
    if (!blob) return;
    return upload_core({
      blob: blob, label: nameIn.value || DEFT, dateIso: ISO, ts: Date.now(),
      dur: recDur, tags: live_tag_data(), ext: ext, locId: LOC_ID
    });
  }
  async function upload_core(o) {
    status.textContent = 'Uploading…';
    var blob2 = o.blob;
    var label = o.label || (o.dateIso + ' recording');
    if (label.indexOf(o.dateIso) < 0) label = o.dateIso + ' ' + label;
    var id = rec_id_from(label, o.dateIso, o.ts);
    var page = 'session.html?p=' + id;
    var ISO2 = o.dateIso, recDur2 = o.dur || 0;
    // remember which cloud page this local copy becomes, so the session list
    // shows ONE row that flips local -> syncing -> normal (never two)
    if (o.locId) {
      try {
        var db0 = await rec_db();
        await new Promise(function (res) {
          var tx = db0.transaction('recs', 'readwrite');
          var st0 = tx.objectStore('recs');
          var g0 = st0.get(o.locId);
          g0.onsuccess = function () {
            var mm = g0.result;
            if (mm) { mm.cloudPage = page; st0.put(mm); }
          };
          tx.oncomplete = res; tx.onerror = res;
        });
      } catch (eCp) {}
    }
    // placeholder first: every device's session list shows a syncing… row
    try {
      var pre = [];
      try {
        var pr = await fetch(RAW_BASE + 'sessions_auto.json?v=' + Date.now(), { cache: 'no-store' });
        if (pr.ok) { var pj = await pr.json(); if (Array.isArray(pj)) pre = pj; }
      } catch (e0) {}
      pre = not_deleted(pre.filter(function (e2) { return e2 && e2.page !== page; }));
      pre.push({ page: page, name: label, date: ISO2, dur: recDur2, count: o.tags.length, pending: true, ts: Date.now() });
      await sync_write('sessions_auto.json', JSON.stringify(pre, null, 2), 'placeholder ' + id);
      try {
        localStorage.setItem('vampjam_pending_session',
          JSON.stringify({ page: page, name: label, date: ISO2, dur: recDur2, count: o.tags.length, ts: Date.now() }));
      } catch (e3) {}
    } catch (ePre) {}
    try {
      var r = await fetch(WORKER_UPLOAD_URL, {
        method: 'POST',
        headers: {
          'Content-Type': blob2.type || 'audio/mp4',
          'X-File-Name': id + '.' + (o.ext || 'm4a'),
          'X-Upload-Secret': ''
        },
        body: blob2
      });
      var j = await r.json();
      if (!j.ok) throw new Error('upload ' + (j.error || r.status));
      status.textContent = 'Creating the session…';
      var now = Date.now();
      var tags = o.tags.map(function (lt, i) {
        return { id: 't_' + now + '_lt' + (i + 1), t: lt.t, label: lt.label || '' };
      });
      await sync_write(id + '.json', JSON.stringify({
        audio: { label: label, url: j.url, kind: 'url' },
        tags: tags
      }, null, 2), 'auto session ' + id);
      var list = [];
      try {
        var lr = await fetch(RAW_BASE + 'sessions_auto.json?v=' + Date.now(), { cache: 'no-store' });
        if (lr.ok) { var lj = await lr.json(); if (Array.isArray(lj)) list = lj; }
      } catch (e) {}
      list = not_deleted(list.filter(function (e2) { return e2 && e2.page !== page; }));
      list.push({ page: page, name: label, date: ISO2, dur: recDur2, count: tags.length });
      await sync_write('sessions_auto.json', JSON.stringify(list, null, 2), 'register ' + id);
      try {
        localStorage.setItem('vampjam_pending_session',
          JSON.stringify({ page: page, name: label, date: ISO2, dur: recDur2, count: tags.length, ts: Date.now(), done: true }));
      } catch (e4) {}

      // the cloud has it — the local safety copy can go
      if (o.locId) { idb_del_rec(o.locId).catch(function () {}); }

      status.innerHTML = 'Session ready &#10003; <a href="' + page + '">open ' +
        (label || id) + '</a>' +
        '<br>saved as ' + id + '.' + (o.ext || 'm4a') +
        (tags.length ? ' · ' + tags.length + ' moment' + (tags.length === 1 ? '' : 's') + ' carried over' : '');
      if (pendingBack) {
        setTimeout(function () { window.location.href = 'index.html#sessions'; }, 900);
      }
    } catch (err) {
      pendingBack = false;
      status.innerHTML = 'Something went wrong (' + (err && err.message ? err.message : err) + ') — ' +
        '<a href="#" id="retry_link">try again</a>' +
        '<br>your recording is safe on this device — it shows in Sessions as local';
      var rl = document.getElementById('retry_link');
      if (rl) rl.addEventListener('click', function (e) { e.preventDefault(); upload_core(o); });
    }
  }

  // ---- recovery: finish anything this device still holds locally ----
  // a 'recording' state means the page died mid-recording — its chunks are the
  // recording; 'ready' means the upload never completed. Both retry here.
  (async function recover_locals() {
    try {
      var metas = await idb_all('recs');
      if (!metas.length) return;
      for (var i = 0; i < metas.length; i++) {
        if (metas[i].state === 'recording') {
          metas[i].state = 'ready';
          await idb_put('recs', metas[i]);
        }
      }
      var up = /[?&]up=([A-Za-z0-9_\-]+)/.exec(window.location.search);
      var ready = metas.filter(function (m) { return m.state === 'ready'; });
      if (up) ready.sort(function (x, y) { return (y.id === up[1]) - (x.id === up[1]); });
      for (var k = 0; k < ready.length; k++) {
        if (mediaRec && mediaRec.state === 'recording') return;   // don't fight a live take
        var m = ready[k];
        var parts = await idb_chunks(m.id);
        if (!parts.length) { await idb_del_rec(m.id); continue; }
        status.textContent = 'Finishing an earlier upload — ' + (m.label || m.date) + '…';
        await upload_core({
          blob: new Blob(parts, { type: m.mime || 'audio/mp4' }),
          label: m.label, dateIso: m.date, ts: m.ts, dur: m.dur,
          tags: m.tags || [], ext: m.ext || 'm4a', locId: m.id
        });
      }
    } catch (e) {}
  })();

  // keep the moments list sized to the visible viewport (keyboard-aware):
  // everything above stays on screen; the list itself scrolls
  function fit_mom_list() {
    var vv = window.visualViewport;
    var vh = vv ? (vv.height + vv.offsetTop) : window.innerHeight;
    var top = momList.getBoundingClientRect().top + (window.scrollY || 0);
    var h = vh - top - 10;
    momList.style.maxHeight = (h > 90 ? h : 90) + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      window.scrollTo(0, 0);   // never let the keyboard leave the page stranded
      fit_mom_list();
      momList.scrollTop = momList.scrollHeight;
    });
  }
  window.addEventListener('resize', fit_mom_list);

  render_bar();   // the bar shows from page load, empty and light gray

  // test hook: lets an automated check render the bar at any elapsed length
  window.__rec_set_elapsed = function (sec) { debugT = sec; render_bar(); };
})();
</script>
