<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vampsf — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
  :root {
    --bg: #4a2a0e;
    --panel: #5c3717;
    --panel_2: #6b4423;
    --panel_3: #7a4f2a;
    --fg: #f5e5c5;
    --muted: #c9a87e;
    --accent: #e8b454;
    --accent_2: #d4a95a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); margin: 0; padding: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 4px 16px 48px; max-width: 640px; margin: 0 auto;
  }

  .brand { text-align: center; margin: 12px 0 4px; }
  .brand .wordmark {
    font-family: 'Sacramento', cursive; font-size: 62px; line-height: 1; color: var(--fg);
  }
  .wordmark_sf {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 34px; font-weight: 650; letter-spacing: 0.5px; margin-left: 3px;
  }
  .brand .tagline { color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }

  .back { display: inline-block; color: var(--accent_2); text-decoration: none; font-size: 13px; margin: 8px 0 4px; }
  .back:hover { text-decoration: underline; }

  h1 { font-size: 20px; margin: 18px 0 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .cta {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: #2a1808; font-weight: 700; font-size: 16px;
    padding: 15px 18px; border-radius: 12px; margin: 8px 0 28px;
    box-shadow: 0 4px 14px rgba(232,180,84,0.22);
  }
  .cta:hover { background: #f0c97a; }
  .cta .cta_sub { display: block; font-weight: 500; font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted); margin: 8px 0 14px;
  }

  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 0; }
  ol.steps > li {
    counter-increment: step; position: relative;
    background: var(--panel); border: 1px solid var(--panel_3);
    border-radius: 12px; padding: 16px 18px 16px 58px; margin-bottom: 12px;
  }
  ol.steps > li::before {
    content: counter(step); position: absolute; left: 16px; top: 16px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #2a1808; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  ol.steps .step_title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  ol.steps .step_body { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  ol.steps .step_body code {
    background: var(--panel_3); color: var(--fg);
    padding: 1px 6px; border-radius: 4px; font-size: 12.5px;
  }
  ol.steps a { color: var(--accent_2); }

  .note {
    background: var(--panel_2); border-radius: 10px; padding: 12px 14px;
    color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-top: 20px;
  }
  .note b { color: var(--fg); }

  .rec_card { background: var(--panel); border: 1px solid var(--panel_3); border-radius: 14px; padding: 18px; margin: 4px 0 26px; }
  .rec_title { font-weight: 600; font-size: 15px; margin-bottom: 14px; }
  .rec_stage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rec_btn { width: 74px; height: 74px; border-radius: 50%; border: none; background: var(--accent); color: var(--on_accent); font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .rec_btn.recording { background: #d70015; color: #fff; animation: rec_pulse 1.2s ease-in-out infinite; }
  @keyframes rec_pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(215,0,21,0.5); } 50% { box-shadow: 0 0 0 12px rgba(215,0,21,0); } }
  .rec_time { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; }
  .rec_hint { color: var(--muted); font-size: 13px; }
  .rec_input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--panel_3); background: var(--bg); color: var(--fg); font: inherit; margin-bottom: 8px; }
  .rec_up { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: var(--on_accent); font-weight: 600; font-size: 15px; cursor: pointer; }
  .rec_up:disabled { opacity: 0.5; }
  .rec_result { margin-top: 10px; font-size: 13px; color: var(--muted); word-break: break-all; line-height: 1.5; }
  .rec_result a { color: var(--accent_2); }

  /* one_size: a single text size for the whole app — only the vampSF wordmark
     (and glyph buttons whose icons scale with font-size) keep their own */
  body :not(.wordmark):not(.wordmark_sf):not(.play_btn):not(.rec_btn):not(.fav_play):not(svg) { font-size: 17px !important; }
  .tag_numbers, .num_strip { height: 20px !important; }
</style>
</head>
<body>

<header class="brand">
  <div class="wordmark">vamp<span class="wordmark_sf">SF</span></div>
  <div class="tagline">admin</div>
</header>

<a class="back" href="index.html">&#8249; back to sessions</a>

<div id="theme_switch_mount"></div>

<h1>Add a new session</h1>
<div class="sub">Recording happens on its own page now.</div>

<a class="cta" href="record.html">Record a session</a>

<a class="cta" href="https://dash.cloudflare.com/?to=/:account/r2/default/buckets/vampjam-audio" target="_blank" rel="noopener">
  Open the vampjam-audio bucket
  <span class="cta_sub">Cloudflare R2 &rarr; where the audio lives now</span>
</a>



</body>
</html>
