<style>
  /* admin_same: this page used to carry its own copy of the palette, the
     reset, the page box and the wordmark — and the copy had drifted. The
     palette was brown, baked in, ignoring the theme; the wordmark was 62px
     where the rest of the site is 68; the page box was 640px where the rest
     is 760. All of it comes from site.css now, exactly as it does on every
     other page. What is left below is only what this page alone has. */

  h1 { text-align: center; font-size: 22px; margin: 6px 0 14px; }

  /* the two ways out of this page. admin_same: the colours were the yellow
     theme's own hexes baked in, so the buttons stayed brown-on-gold whichever
     theme was chosen — they are tokens now, like every other button. */
  .cta {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: var(--on_accent); font-weight: 700;
    padding: 15px 18px; border-radius: 12px; margin: 8px 0 28px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .cta:hover { background: var(--accent_hover); }
  .cta:active { background: var(--accent_active); }
  .cta .cta_sub { display: block; font-weight: 500; opacity: 0.8; margin-top: 2px; }

  /* dead_css: the recorder rules, the steps list, the note box and the back
     link all lived here from when this page held the recorder. The recorder
     is record.html now and nothing on this page uses any of them. */

  /* the header pair, nav_room and the session drawer are in site.css */
</style>
