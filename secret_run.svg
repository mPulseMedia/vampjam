<!-- version history -->
<text x="126" y="170" class="h">Version History</text>
<text x="126" y="184" class="dim">Versions track code and configuration changes to your Worker.</text>

<rect x="126" y="192" width="474" height="26" rx="4" fill="#fff" stroke="#e6eaee"/>
<rect x="126" y="192" width="3" height="26" fill="#1b6be0"/>
<text x="138" y="209" class="mono">96a945f0</text>
<text x="200" y="209" class="txt">Add variable: SITE</text>
<text x="470" y="209" class="dim">Dashboard  by cloudflare</text>
<text x="566" y="209" class="dim">2h ago</text>
<text x="588" y="211" class="txt" font-weight="700" text-anchor="middle">…</text>

<rect x="126" y="220" width="474" height="24" rx="4" fill="#fff" stroke="#f0f2f5"/>
<text x="138" y="236" class="mono" fill="#7b848d">b06dd2e5</text>
<text x="200" y="236" class="lbl">Add variable: TWILIO_FROM</text>
<text x="588" y="238" class="dim" text-anchor="middle">…</text>

<rect x="126" y="246" width="474" height="24" rx="4" fill="#fff" stroke="#f0f2f5"/>
<text x="138" y="262" class="mono" fill="#7b848d">a08945a3</text>
<text x="200" y="262" class="lbl">Add secret: TWILIO_TOKEN</text>
<text x="588" y="264" class="dim" text-anchor="middle">…</text>

<rect x="126" y="272" width="474" height="24" rx="4" fill="#fff" stroke="#f0f2f5"/>
<text x="138" y="288" class="mono" fill="#7b848d">47c7a217</text>
<text x="200" y="288" class="lbl">Add secret: TWILIO_SID</text>
<text x="588" y="290" class="dim" text-anchor="middle">…</text>

<rect x="126" y="298" width="474" height="24" rx="4" fill="#fff" stroke="#f0f2f5"/>
<text x="138" y="314" class="mono" fill="#7b848d">766055b8</text>
<text x="200" y="314" class="lbl">Add secret: AUTH_SECRET</text>
<text x="588" y="316" class="dim" text-anchor="middle">…</text>

<rect x="126" y="324" width="474" height="24" rx="4" fill="#fafbfc" stroke="#f0f2f5"/>
<text x="138" y="340" class="mono" fill="#a8b0b7">4a7a4acf</text>
<text x="200" y="340" class="dim" font-style="italic">Manually deployed</text>

<rect x="126" y="350" width="474" height="24" rx="4" fill="#fafbfc" stroke="#f0f2f5"/>
<text x="138" y="366" class="mono" fill="#a8b0b7">78176288</text>
<text x="200" y="366" class="dim" font-style="italic">Manually deployed</text>

<text x="126" y="392" class="dim">Showing 1-7 of 7</text>

<!-- the menu that actually promotes, drawn open -->
<rect x="470" y="214" width="126" height="52" rx="6" fill="#fff" stroke="#cfd6dd"/>
<rect x="470" y="214" width="126" height="26" rx="6" fill="#f4f7fa"/>
<text x="480" y="231" class="txt" font-weight="700">Deploy this version</text>
<text x="480" y="257" class="lbl">Rollback to here</text>
<rect x="466" y="210" width="134" height="34" rx="8" class="ring"/>

<!-- rings -->
<rect x="204" y="46" width="70" height="24" rx="8" class="ring"/>
<rect x="578" y="196" width="22" height="20" rx="7" class="ring"/>
<rect x="130" y="112" width="80" height="18" rx="6" class="ring"/>

<!-- callouts -->
<circle cx="640" cy="58" r="11" fill="#d7263d"/><text x="640" y="62" class="num" text-anchor="middle">1</text>
<text x="658" y="55" class="cal">Deployments</text>
<text x="658" y="70" class="cal2">the tab. not Settings — there is no</text>
<text x="658" y="83" class="cal2">deploy button over there at all.</text>

<circle cx="640" cy="206" r="11" fill="#d7263d"/><text x="640" y="210" class="num" text-anchor="middle">2</text>
<text x="658" y="203" class="cal">the … on the newest row</text>
<text x="658" y="218" class="cal2">top of Version History. there is no</text>
<text x="658" y="231" class="cal2">big button — it lives in this menu.</text>
<text x="658" y="248" class="cal2">newest only, and only once: a version</text>
<text x="658" y="261" class="cal2">is a whole snapshot, so the top row</text>
<text x="658" y="274" class="cal2">already carries everything below it.</text>

<circle cx="640" cy="121" r="11" fill="#2f8f5b"/><text x="640" y="125" class="num" text-anchor="middle">3</text>
<text x="658" y="118" class="cal" fill="#2f8f5b">then check up here</text>
<text x="658" y="133" class="cal2">Active deployment must show the</text>
<text x="658" y="146" class="cal2">SAME id as the top row. if it shows</text>
<text x="658" y="159" class="cal2">an older one, the settings are saved</text>
<text x="658" y="172" class="cal2">and not running — that is the bug.</text>

<rect x="632" y="300" width="252" height="72" rx="8" fill="#e6f4ec" stroke="#2f8f5b"/>
<text x="644" y="318" class="cal" fill="#2f8f5b">yours is already done</text>
<text x="644" y="334" class="cal2">Active deployment reads 96a945f0,</text>
<text x="644" y="347" class="cal2">which is the top row. AUTH_SECRET is</text>
<text x="644" y="360" class="cal2">running. nothing to click here.</text>

<text x="632" y="400" class="cal2" fill="#6b7480">drawn from cloudflare's own screen</text>
</svg>
