<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vampsf — sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=25">
<script src="theme.js?v=2"></script>
<script src="sessions.js?v=130"></script>
<script src="drawer.js?v=183"></script>
<style>
  h1 { text-align: center; font-size: 22px; margin: 6px 0 4px; }
  .lede { text-align: center; color: var(--muted); margin: 0 auto 18px; max-width: 420px; line-height: 1.5; }
  .box { max-width: 420px; margin: 0 auto; }
  .box input[type=tel] {
    width: 100%; box-sizing: border-box; font-size: 17px; padding: 13px 14px;
    border-radius: 12px; border: 1px solid var(--panel_3); background: var(--panel);
    color: var(--fg); text-align: center;
  }
  .box input[type=tel]:focus { border-color: var(--accent); outline: none; }
  .box input[type=text] {
    width: 100%; box-sizing: border-box; font-size: 17px; padding: 13px 14px;
    border-radius: 12px; border: 1px solid var(--panel_3); background: var(--panel);
    color: var(--fg); text-align: center; margin-top: 8px;
  }
  .box input[type=text]:focus { border-color: var(--accent); outline: none; }
  .rename { max-width: 420px; margin: 10px auto 0; }
  .rename[hidden] { display: none; }
  .go {
    display: block; width: 100%; margin: 10px 0 0; border: none; border-radius: 999px;
    background: var(--accent); color: var(--on_accent, #fff); font-weight: 700;
    padding: 14px 18px; font-size: 17px; cursor: pointer;
  }
  .go:disabled { opacity: 0.5; cursor: default; }
  .say { text-align: center; margin: 14px auto 0; max-width: 420px; line-height: 1.55; min-height: 24px; }
  .say.bad { color: var(--danger, #c75450); }
  .say.good { color: var(--fg); }
  .who { text-align: center; margin: 18px auto 0; max-width: 420px; line-height: 1.6; }
  .who b { color: var(--fg); }
  .out { background: none; border: none; color: var(--muted); text-decoration: underline;
         cursor: pointer; padding: 8px; }
  .list { max-width: 420px; margin: 10px auto 0; }
  .list a { display: flex; justify-content: space-between; gap: 10px; text-decoration: none;
            color: var(--fg); padding: 12px 2px; border-top: 1px solid var(--panel_3); }
  .fine { text-align: center; color: var(--muted); font-size: 12.5px; margin: 26px auto 0;
          max-width: 420px; line-height: 1.5; }
</style>
</head>
<body>

<div class="session_drawer" id="session_drawer"><div class="jam_menu"></div></div>

<header class="brand" style="position:relative;">
<button class="nav_cass" id="page_sessions" aria-label="Sessions" title="Sessions"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><circle cx="8" cy="12" r="2.2"/><circle cx="16" cy="12" r="2.2"/><path d="M10.2 12h3.6"/><path d="M7 18.5l1.6-2.5h6.8l1.6 2.5"/></svg></button>
<button class="nav_share" id="page_share" aria-label="Copy link to this page" title="Copy link to this page"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V4"/><path d="M8.5 7.3L12 3.8l3.5 3.5"/><path d="M6.6 11H6a1.6 1.6 0 0 0-1.6 1.6v5.8A1.6 1.6 0 0 0 6 20h12a1.6 1.6 0 0 0 1.6-1.6v-5.8A1.6 1.6 0 0 0 18 11h-.6"/></svg></button>
  <div class="wordmark">vamp<span class="wordmark_sf">SF</span></div>
</header>

<h1 id="head">Sign in</h1>
<div class="lede" id="lede">Enter your phone number. That is the whole sign-in — no text message, no password, no waiting.</div>

<div class="box" id="ask">
  <input type="tel" id="phone" inputmode="tel" autocomplete="tel"
         placeholder="(415) 555 1212" aria-label="Your phone number">
  <input type="text" id="name" autocomplete="name" autocapitalize="words"
         placeholder="Your name (optional)" aria-label="Your name">
  <button class="go" id="go">Sign in</button>
</div>

<div class="say" id="say" role="status"></div>

<div class="who" id="who" hidden></div>
<div class="rename box" id="rename" hidden>
  <input type="text" id="new_name" autocapitalize="words" placeholder="Your name" aria-label="Your name">
  <button class="go" id="save_name">Save my name</button>
</div>
<div class="list" id="list"></div>

<div class="fine">
  Only numbers on the list can sign in. If yours isn't, ask Paul to add it.
</div>

<script>
(function () {
  var SYNC = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var A = window.vampjamAuth;
  var phone = document.getElementById('phone'), go = document.getElementById('go');
  var say = document.getElementById('say'), ask = document.getElementById('ask');
  var who = document.getElementById('who'), list = document.getElementById('list');
  var head = document.getElementById('head'), lede = document.getElementById('lede');
  var nameIn = document.getElementById('name');
  var rename = document.getElementById('rename');
  var newName = document.getElementById('new_name'), saveName = document.getElementById('save_name');
  var meNow = null;                       // the last full answer about who this is

  function tell(msg, bad) {
    say.textContent = msg;
    say.className = 'say' + (msg ? (bad ? ' bad' : ' good') : '');
  }
  // signin_back — you almost always arrive here because a recording asked you
  // to. Remember which one, and go back to it the moment you are in.
  var back = null;
  try {
    back = new URLSearchParams(location.search).get('back') || sessionStorage.getItem('vampjam_signin_back');
    if (back) sessionStorage.setItem('vampjam_signin_back', back);
  } catch (e) {}

  function show_signed_in(j) {
    meNow = j;
    ask.hidden = true;
    head.textContent = 'Signed in';
    lede.textContent = '';
    who.hidden = false;
    var n = (j.allow === '*') ? 'every recording' :
            (j.allow.length === 1 ? 'one recording' : j.allow.length + ' recordings');
    who.innerHTML = 'You are <b>' + esc(j.label || 'signed in') + '</b>'
      + (j.admin ? ' — admin' : '') + '.'
      + (j.id ? ' <button class="out" id="chg">change my name</button>' : '')
      + '<br>You can open ' + n + '.'
      + '<br><button class="out" id="out">Sign out on this phone</button>';
    document.getElementById('out').addEventListener('click', function () {
      A.out(); location.reload();
    });
    // He signed in without ever being asked his name, so the list called him
    // "you". This is the one place that owns the name - the page about who you
    // are - and it is reachable from the box at the bottom of every recording.
    var ch = document.getElementById('chg');
    if (ch) ch.addEventListener('click', function () {
      rename.hidden = false;
      newName.value = (j.label && j.label !== 'you') ? j.label : '';
      newName.focus();
      if (back) { back = null; try { sessionStorage.removeItem('vampjam_signin_back'); } catch (e) {} }
    });
    if (j.allow !== '*' && j.allow.length) {
      var reg = (window.VAMPJAM_SESSIONS_AUTO || []).concat(window.VAMPJAM_SESSIONS || []);
      list.innerHTML = j.allow.map(function (pg) {
        var hit = reg.filter(function (s) { return s.page === pg; })[0];
        return '<a href="' + esc(pg) + '"><span>' + esc(hit ? hit.name : pg) + '</span><span>&rsaquo;</span></a>';
      }).join('');
    }
    if (back) {
      setTimeout(function () {
        try { sessionStorage.removeItem('vampjam_signin_back'); } catch (e) {}
        location.replace(back);
      }, 900);
      tell('Taking you back…');
    }
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---- already signed in? ----
  // The link-in-a-text is gone: there is nothing to arrive from any more, so a
  // ?t= in the address is only ever a stale bookmark. Ignore it and ask.
  try {
    if (new URLSearchParams(location.search).get('t'))
      history.replaceState(null, '', 'signin.html' + location.hash);
  } catch (e) {}
  A.me().then(function (j) { if (j.signed_in) show_signed_in(j); });

  // ---- the whole sign-in ----
  // One call. The number is the key: if it is on a list somewhere, the worker
  // hands back a session and this phone is signed in from here on.
  function send() {
    var v = (phone.value || '').trim();
    if (!v) { phone.focus(); return; }
    go.disabled = true;
    tell('Checking…');
    fetch(A.url + '?op=enter', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: v })
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        go.disabled = false;
        if (!j.ok) {
          tell(j.unknown
            ? 'That number is not on any recording yet. Ask Paul to add it to the one he wants you to hear.'
            : (j.why || j.error || 'Could not sign in'), true);
          return;
        }
        A.set(j.session);
        // the first person to sign in owns the place. The worker cannot write,
        // so the page writes it down — one number, admin, and that is the whole
        // of the setup. There is no separate "claim" step anywhere else.
        // The name is asked for here, once, instead of being assumed: "you" is
        // what the list called him for a week because nothing ever asked.
        if (j.first) {
          var nm = (nameIn.value || '').trim().slice(0, 40) || 'you';
          tell('Setting you up as the administrator…');
          return fetch(SYNC, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: 'access.json', message: 'first sign-in — administrator',
              content: JSON.stringify({
                admins: [j.id],
                people: [{ id: j.id, id7: j.id7, label: nm, last4: j.last4 }],
                sessions: {}
              }, null, 2) })
          }).then(function (r) { if (!r.ok) throw new Error('could not save (' + r.status + ')'); })
            .then(function () { j.label = nm; show_signed_in(j); go_back(); },
                  function (e) { tell('Signed in, but could not write the list: ' + e.message, true); });
        }
        // Ask the worker who that token is, rather than reading the sign-in's
        // shorter answer: me() carries the id, and the id is what a rename
        // needs. One extra call, on the one page where it matters.
        return A.me().then(function (me) {
          show_signed_in((me && me.signed_in) ? me : j);
          go_back();
        }, function () { show_signed_in(j); go_back(); });
      })
      .catch(function (err) { go.disabled = false; tell('Could not reach the server: ' + err.message, true); });
  }
  // ?back= is where the gate turned him around. Go there once he is in.
  function go_back() {
    var to = '';
    try { to = new URLSearchParams(location.search).get('back') || ''; } catch (e) {}
    if (!/^[A-Za-z0-9_.\-]+\.html(\?[^#]*)?$/.test(to)) return;
    setTimeout(function () { location.replace(to); }, 900);
  }
  // name_save — read the list, change this one person's label, write it back.
  // Only the label moves; the id, the id7 and the last four are what everything
  // else matches on and are never touched here.
  function name_save() {
    var nm = (newName.value || '').trim().slice(0, 40);
    if (!nm) { newName.focus(); return; }
    if (!meNow || !meNow.id) { tell('Sign in again first — this browser does not know who you are.', true); return; }
    saveName.disabled = true;
    tell('Saving your name…');
    fetch(A.url + '?op=list&t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (acc) {
        if (!acc || !acc.ok) throw new Error('the list would not open');
        var out = { admins: acc.admins || [], people: acc.people || [], sessions: acc.sessions || {} };
        var hit = out.people.filter(function (x) { return x && x.id === meNow.id; })[0];
        if (hit) hit.label = nm;
        else out.people.push({ id: meNow.id, label: nm });
        return fetch(SYNC, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: 'access.json', message: 'name — ' + nm,
                                 content: JSON.stringify(out, null, 2) })
        }).then(function (r) { if (!r.ok) throw new Error('could not save (' + r.status + ')'); });
      })
      .then(function () {
        saveName.disabled = false;
        rename.hidden = true;
        meNow.label = nm;
        show_signed_in(meNow);
        // GitHub serves the file from a cache, so the rest of the site can show
        // the old name for a minute. Say that instead of letting him wonder.
        tell('Saved. You are ' + nm + ' — it can take a minute to show everywhere else.');
      })
      .catch(function (e) { saveName.disabled = false; tell('Could not save your name: ' + e.message, true); });
  }
  saveName.addEventListener('click', name_save);
  newName.addEventListener('keydown', function (e) { if (e.key === 'Enter') name_save(); });

  go.addEventListener('click', send);
  nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  phone.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
})();
</script>
</body>
</html>
