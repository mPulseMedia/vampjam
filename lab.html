<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>vampsf — lab</title>
<style>
  /* lab_frame — a sketch of the feeling the session list gave us: a fixed
     white frame with a rounded window cut in it, and a stack of full-screen
     cells that slides behind the window. The frame never moves; the cells do,
     and the frame's edge casts a shadow down onto whichever cell is showing.
     Cells: 1 red (top) · 2 white (middle) · 3 blue (bottom). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #ffffff; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation; color-scheme: light;
  }

  /* the white frame is simply the page; the window is what is cut out of it */
  .frame_window {
    background: #fcfcf8;
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    bottom: max(14px, env(safe-area-inset-bottom));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    border-radius: 22px;
    overflow: hidden;
    background: #fcfcf8;
  }
  /* tilt_deep — the perspective lives on its OWN layer, not on the window.
     WebKit flattens 3D children of an element that both clips and rounds its
     corners, which is why the lean barely showed on the phone while it looked
     right in a desktop screenshot. The stage clips nothing and rounds nothing;
     the window still does both, around it. The camera is close (460px against a
     ~360px window), so a modest tilt of the hand lays the paper right down. */
  .stage {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    perspective: 460px; perspective-origin: 50% 50%;
    transform-style: preserve-3d;
  }
  /* frame_shadow — the white frame casting onto the cell below it: strongest
     from the top edge, present on all four. It rides ABOVE the cells. */
  .frame_shadow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
    box-shadow:
      inset 0 14px 18px -10px rgba(0,0,0,0.45),
      inset 0 -10px 16px -10px rgba(0,0,0,0.30),
      inset 12px 0 16px -12px rgba(0,0,0,0.30),
      inset -12px 0 16px -12px rgba(0,0,0,0.30);
  }

  .track {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    will-change: transform;
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .track.dragging { transition: none; }

  .cell {
    flex: 0 0 100%; height: 100%; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 74px; font-weight: 700; letter-spacing: 0.02em;
    user-select: none; -webkit-user-select: none;
  }
  /* dot_steady — the dot sits dead centre of every card. When the phone's
     motion sensors are running it is pushed the OTHER way from every wobble,
     so it holds still in the room while the screen jiggles around it. */
  /* graph_one — ONE surface for the whole window: graph paper, drawn once,
     behind everything. It pans and scales with the phone; nothing else carries
     lines, so there are no layers to see through. Sized 800% so even at the
     small end of the scale, panned to its limit, no edge comes into view. */
  .grid {
    /* haze_cheap — the fade used to be a mask ON THIS ELEMENT, and that was the
       crash: a mask forces the browser to allocate an offscreen buffer the size
       of the masked element, and this element is a thousand percent of the
       viewport with a 3D transform and a scale of up to 39 on top. The fade now
       lives on .haze, one viewport big, sitting over the paper. The paper itself
       is a plain painted element again — no mask, no buffer — and smaller. */
    /* paper_paint — the paper no longer MOVES or SCALES; only its pattern does.
       Panning is background-position and zooming is background-size, both of
       which are a repaint of one fixed element. The transform is left carrying
       nothing but the three rotations, so it changes only when the phone turns.
       Before this the element was a thousand-plus percent of the viewport being
       re-rasterised on every frame at every scale, which is what took the
       browser down. 400% is what the 45-degree lean needs to cover; nothing
       about the size has to grow with the zoom any more. */
    position: absolute; left: -150%; top: -150%; width: 400%; height: 400%;
    pointer-events: none; z-index: 0; transform-origin: 50% 50%;
    /* roll_hold: the rotation comes FIRST, so the offset that follows is measured
       along the world's own axes rather than the screen's. Swirl the phone in
       front of your face and the paper turns the other way by the same amount,
       which is what makes it look like the paper never moved. */
    /* the swirl first, then the two leans, which tip about the phone's own axes,
       then the pan and the zoom — so the pan runs along the paper's surface
       rather than across the glass. (Panning and zooming through
       background-position / background-size instead was tried and is four times
       SLOWER: a background change repaints the whole element, where a transform
       change only recomposites it.) */
    transform: rotate(var(--rot, 0deg)) rotateX(var(--tilt, 0deg)) rotateY(var(--turn, 0deg))
               translate3d(var(--sx, 0px), var(--sy, 0px), 0) scale(var(--sc, 1));
    background-color: #fcfcf8;
    background-image:
      repeating-linear-gradient(to bottom, rgba(38,86,140,0.32) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(to right,  rgba(38,86,140,0.32) 0 1px, transparent 1px 30px);
  }
  /* the distance dissolving into the background: one screen-sized overlay in
     the paper's own colour, cheap to paint and independent of the paper's size */
  .haze {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 78% 62% at 50% 56%,
                                rgba(252,252,248,0) 0%,
                                rgba(252,252,248,0.55) 62%,
                                rgba(252,252,248,0.96) 100%);
  }
  .pin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
  /* dot_scale — the dot is an object IN the world, so it takes the world's
     scale as well as its position: near the eye it swells with the squares,
     far away it shrinks with them. */
  /* star_pin — the marker is a star with a real cast shadow, and the shadow says
     how far above the paper it is: near the paper it is small, sharp, dark and
     tucked underneath; far away it spreads, softens, fades and slides out.
     The shadow numbers are divided by the scale before they are set, so the
     transform below cannot blow them up along with the star. */
  .pin_dot {
    width: 26px; height: 26px;
    /* star_cap — the star grows with the paper, but not without limit: at the top
       of the range the paper is 39 times life size and an unclamped star fills
       the whole window. Six is as big as it gets. */
    transform: rotate(var(--rot, 0deg)) translate3d(var(--sx, 0px), var(--sy, 0px), 0)
               scale(min(var(--sc, 1), 6));
    filter: drop-shadow(var(--shx, 0px) var(--shy, 8px) var(--shb, 9px) rgba(20,30,45,var(--sho, 0.42)));
  }
  .pin_dot svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pin_dot polygon { fill: #f5b301; stroke: #7c4a03; stroke-width: 1.1; stroke-linejoin: round; }
  /* lab_build: every card wears the same colour, and the colour changes with
     each build — if it looks different from last time, the update landed. */
  .cell { background: transparent; color: #1d1d1f; }

  /* which cell you are on, in the frame itself */
  .dots {
    position: fixed; right: max(20px, calc(env(safe-area-inset-right) + 6px));
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 7px; z-index: 6;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1d1d1f; opacity: 0.18; }
  .dot.on { opacity: 0.75; }


  /* lab_release — a solid square in the corner wearing this release's colour,
     with this release's name inside it. New colour + new name every ship. */

  .hint {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    font-size: 14px; font-weight: 600; color: #1d1d1f;
    background: rgba(255,255,255,0.86); border-radius: 999px; padding: 7px 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    pointer-events: none; transition: opacity 0.4s;
  }
  /* thumb_reach: Set zero gets pressed constantly, so it sits low on the right,
     just above the recorder bar, where a right thumb lands without a stretch. */

  /* zero_split: the rarer of the two sits above the one the thumb wants, and is
     quieter — Set zero is pressed constantly, Reset all only when the scale has
     run away. */

  /* lag_trace — four seconds of history, so what the hand did and what the
     screen did can be compared by eye instead of by adjective.
     grey = how hard the phone is accelerating, purple = where the world is. */
  /* lane_view — six lanes, one per axis, stacked and kept apart. Each is a
     solid fill away from its own centre line, up for positive and down for
     negative, and carries no marking of any kind. The colours are the diagram's:
     red is the left-right axis and the tilt about it, green up-down and the turn
     about it, blue near-far and the swirl about it. */
  .trace {
    position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right) + 8px));
    top: max(212px, calc(env(safe-area-inset-top) + 200px));
    width: 178px; height: 168px; border-radius: 14px;
    background: rgba(255,255,255,0.88);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .pose {
    position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right) + 8px));
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    width: 178px; height: 178px; border-radius: 14px;
    background: rgba(255,255,255,0.86);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none;
  }

  /* gesture_lab — hold the button, do the move, let go. Everything the phone's
     sensors say during the hold is kept, tagged with the name you typed, so
     the two of us can look at real numbers instead of guessing. */
  /* gest_small — everything around the hold button gets out of the way: the bar
     is far narrower, the chrome is half the size it was. The one thing that does
     NOT shrink is the hold target itself, which stays a full-height slab because
     it is held down through a whole gesture with the phone in motion. */


  #g_name:focus { border-color: #1350c4; }

  .g_rec.recording { background: #1d1d1f; animation: g_pulse 1s ease-in-out infinite; }
  @keyframes g_pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
  /* take_clear: the bar says which of the four states it is in, in colour and
     in words — idle, recording, sending, sent-and-ready. */
  .g_status { font-size: 10px; line-height: 1.25; color: rgba(0,0,0,0.55); text-align: center; min-height: 12px;
              display: flex; align-items: center; justify-content: center; gap: 4px; }
  .g_led { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22); flex: 0 0 auto; }
  .g_recent { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-height: 0; }
  .g_chip { font-size: 9px; font-weight: 600; color: rgba(0,0,0,0.55);
            background: rgba(0,0,0,0.06); border-radius: 999px; padding: 2px 6px;
            max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g_row { display: flex; align-items: center; gap: 4px; }
  .g_small {
    flex: 1 1 auto; min-width: 0; border: none; border-radius: 7px; padding: 5px 4px;
    font: inherit; font-size: 10px; font-weight: 600; cursor: pointer;
    background: rgba(0,0,0,0.06); color: #1d1d1f; touch-action: manipulation;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g_count { flex: 0 0 auto; font-size: 10px; color: rgba(0,0,0,0.45); min-width: 30px; text-align: right; }

  /* ---- rig_right: the whole interface, stacked off the right edge ---- */
  .rig {
    position: fixed; z-index: 8;
    right: max(16px, calc(env(safe-area-inset-right) + 8px));
    bottom: max(96px, calc(env(safe-area-inset-bottom) + 84px));
    width: 168px;
    display: flex; flex-direction: column; align-items: stretch; gap: 9px;
    touch-action: manipulation;
  }
  .rig [hidden] { display: none !important; }
  /* grade_two — plain buttons, the same shape as Record. Green only exists while
     the tape is running, because a grade is about a take; Red is out at all
     times, because it is also the reset and that has to be reachable whenever
     the paper is moving. */
  .rig_lights { display: flex; gap: 8px; justify-content: flex-end; }
  .rig_lights .g_mark.g_green { display: none; }
  .rig.is_rec .rig_lights .g_mark.g_green { display: block; }
  .rig_lights .g_mark.g_red { flex: 0 0 78px; }
  .rig.is_rec .rig_lights .g_mark { flex: 1 1 0; }
  .g_mark {
    height: 46px; border: none; border-radius: 13px; padding: 0 10px;
    font: inherit; font-size: 15px; font-weight: 700; line-height: 1;
    color: #ffffff; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 2px 9px rgba(0,0,0,0.20);
    transition: filter 0.15s ease;
  }
  .g_mark.g_green { background: #16a34a; }
  .g_mark.g_red   { background: #d7263d; }
  .g_mark:active { transform: scale(0.96); }
  .g_mark.down  { filter: brightness(0.82); }
  .g_mark.hit   { filter: brightness(1.35); }
  .rig_say { display: flex; align-items: center; justify-content: flex-end; gap: 5px;
             min-height: 12px; overflow: hidden; }
  .g_led { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,0.22); flex: 0 0 auto; }
  .rig_msg {
    min-width: 0; font-size: 10.5px; line-height: 1.2; color: rgba(0,0,0,0.55);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g_rec {
    height: 56px; border: none; border-radius: 15px; padding: 0 10px;
    font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
    background: #1350c4; color: #ffffff; touch-action: manipulation;
    box-shadow: 0 3px 12px rgba(19,80,196,0.34);
  }
  .g_rec:active { transform: scale(0.97); }
  .g_rec.recording { background: #1d1d1f; }
  .rig.is_rec  .g_led { background: #d7263d; animation: g_pulse 1s ease-in-out infinite; }
  .rig.is_send .g_led { background: #e0a800; animation: g_pulse 0.7s ease-in-out infinite; }
  .rig.is_sent .g_led { background: #16a34a; }
  .rig.is_warn .g_led { background: #e0a800; }
  .rig.is_sent .rig_msg { color: #16a34a; font-weight: 700; }
  .rig.is_rec  .rig_msg { color: #d7263d; font-weight: 700; }
  /* the two things that are not controls: where you came from, and which build
     this is. Both out of the way in the top-left corner. */
  .corner_back {
    position: fixed; z-index: 8;
    top: max(16px, calc(env(safe-area-inset-top) + 8px));
    left: max(16px, calc(env(safe-area-inset-left) + 8px));
    display: inline-flex; align-items: center; height: 32px; padding: 0 13px;
    border-radius: 999px; text-decoration: none;
    background: rgba(255,255,255,0.9); color: #1d1d1f;
    box-shadow: 0 2px 8px rgba(0,0,0,0.16);
    font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap;
  }
  .corner_back:active { transform: scale(0.96); }
  .build_tag {
    position: fixed; z-index: 8;
    top: max(56px, calc(env(safe-area-inset-top) + 48px));
    left: max(16px, calc(env(safe-area-inset-left) + 8px));
    height: 28px; max-width: 44vw; border-radius: 9px;
    background: var(--lab_bg, #1d4ed8); color: var(--lab_fg, #ffffff);
    display: inline-flex; align-items: center; padding: 0 11px;
    font-size: 12.5px; font-weight: 700; line-height: 1; letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  /* watch_live — the source-watcher's own light, so it is never a mystery
     whether the page is still checking */
  .watch {
    position: fixed; z-index: 8;
    top: max(90px, calc(env(safe-area-inset-top) + 82px));
    left: max(16px, calc(env(safe-area-inset-left) + 8px));
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; color: rgba(0,0,0,0.42);
    pointer-events: none;
  }
  .watch_dot {
    width: 6px; height: 6px; border-radius: 50%; background: #16a34a;
    animation: g_pulse 1.6s ease-in-out infinite;
  }
  .watch.is_off .watch_dot { background: rgba(0,0,0,0.25); animation: none; }
  .watch.is_hit .watch_dot { background: #1350c4; animation: none; }
</style>
</head>
<body>

<div class="frame_window" id="frame">
  <div class="stage"><div class="grid" id="grid"></div></div>
  <div class="track" id="track">
    <div class="cell cell_1"></div>
    <div class="cell cell_2"></div>
    <div class="cell cell_3"></div>
  </div>
  <div class="haze"></div>
  <span class="pin"><span class="pin_dot"><svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon points="0.00,-11.00 2.70,-3.72 10.46,-3.40 4.37,1.42 6.47,8.90 0.00,4.60 -6.47,8.90 -4.37,1.42 -10.46,-3.40 -2.70,-3.72"/></svg></span></span>
  <div class="frame_shadow"></div>
</div>

<div class="dots" id="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
<div class="hint" id="hint">swipe up / down</div>

<!-- rig_right — everything you touch, stacked off the right edge and lifted a
     little off the corner: one wide Record, and while the tape runs the three
     lights it turns into. Nothing else lives down here any more — no name to
     type, no bar across the bottom. -->
<div class="rig" id="gest_bar">
  <!-- grade_two — two ordinary buttons, not lamps. Green says that was right.
       Red says it was not, and resets, which is the same press he was making
       anyway: in his protocol hitting reset IS the bad grade. Amber is gone. -->
  <div class="rig_lights" id="rig_lights">
    <button id="g_good" class="g_mark g_green">Good</button>
    <button id="g_wire" class="g_mark g_red">Bad</button>
  </div>
  <div class="rig_say"><span class="g_led" id="g_led"></span><span class="rig_msg" id="g_msg">tap Record</span></div>
  <button id="g_rec" class="g_rec">Record</button>
  <div class="g_status" id="g_status" hidden></div>
  <div class="g_recent" id="g_recent" hidden></div>
  <button id="g_copy" class="g_small" hidden>Copy last</button>
  <button id="g_send" class="g_small" hidden>Send</button>
  <span class="g_count" id="g_count" hidden></span>
</div>
<a class="corner_back" id="back_btn" href="admin.html">&#8249; Admin</a>
<span class="build_tag" id="build_tag"></span>
<div class="watch" id="watch" hidden><span class="watch_dot"></span><span id="watch_msg">watching</span></div>
<svg class="pose" id="pose" viewBox="-62 -62 124 124" hidden aria-hidden="true">
  <!-- pose_arrow: the phone as an object standing in a frame that never moves.
       The axes and the dashed zero rectangle are pinned at the origin; the plate
       carries BOTH the tilt and the travel, so where the phone is in the picture
       is where it is in the world. The coloured bars along each axis, and the
       dashed drop lines to them, read off its position one axis at a time. -->
  <g id="pose_ref" stroke="rgba(0,0,0,0.18)" stroke-width="1" fill="none"></g>
  <g id="pose_axes" stroke-width="2" stroke-linecap="round" fill="none"></g>
  <g id="pose_guide" fill="none"></g>
  <line id="pose_move" stroke="rgba(0,0,0,0.28)" stroke-width="1.4" stroke-linecap="round"
        stroke-dasharray="3 3"></line>
  <g id="pose_shadow" fill="rgba(0,0,0,0.055)"></g>
  <polygon id="pose_plate" fill="rgba(109,40,217,0.07)" stroke="rgba(109,40,217,0.55)" stroke-width="1" stroke-linejoin="round"></polygon>
  <line id="pose_top" stroke="rgba(109,40,217,0.8)" stroke-width="1.6" stroke-linecap="round"></line>
  <!-- spin_arc: a rotation is not a distance, so it is drawn where a rotation
       can be seen — an arc swept about the axis it turns, in that axis's colour.
       It rides ABOVE the plate, or the phone hides the very thing it is doing. -->
  <g id="pose_spin" fill="none"></g>
  <g id="pose_knob"></g>
  <!-- read_split: one named line per thing being read, instead of two crowded
       rows of initials sitting on top of each other. -->
  <g id="pose_read" font-family="-apple-system, sans-serif"></g>
  <text id="pose_lbl" font-size="0.01" fill="none"></text>
</svg>
<canvas class="trace" id="trace" width="178" height="168" hidden></canvas>

<script>
  // lab_release — the corner square IS the version stamp: this release's commit
  // name in this release's colour. Both change on every ship.
  var LAB_RELEASE = { name: 'diag_flip', bg: '#86198f', fg: '#ffffff' };
  (function () {
    var r = document.documentElement.style;
    r.setProperty('--lab_bg', LAB_RELEASE.bg);
    r.setProperty('--lab_fg', LAB_RELEASE.fg);
    var tag = document.getElementById('build_tag');
    if (tag) tag.textContent = LAB_RELEASE.name;
  })();

  var N = 3;
  var idx = 0;                 // which cell is showing
  var track = document.getElementById('track');
  var frame = document.getElementById('frame');
  var dots  = document.getElementById('dots');
  var hint  = document.getElementById('hint');

  function cell_h() { return frame.clientHeight || window.innerHeight; }
  function paint(px) {
    track.style.transform = 'translate3d(0,' + px + 'px,0)';
  }
  function go(i, animate) {
    idx = Math.max(0, Math.min(N - 1, i));
    track.classList.toggle('dragging', !animate);
    paint(-idx * cell_h());
    Array.prototype.forEach.call(dots.children, function (d, k) {
      d.classList.toggle('on', k === idx);
    });
    if (idx > 0 && hint) { hint.style.opacity = '0'; }
  }
  go(0, false);
  requestAnimationFrame(function () { track.classList.remove('dragging'); });
  window.addEventListener('resize', function () { go(idx, false); requestAnimationFrame(function () { track.classList.remove('dragging'); }); });

  // ---- drag: the cells follow the finger, then snap to the nearest page ----
  // close_light's lesson: a short push is enough — 40px, or 8% of the cell.
  function snap_px() { return Math.min(40, cell_h() * 0.08); }
  var drag = null;
  function start(y) { drag = { y0: y, base: -idx * cell_h(), active: false }; }
  function move(y) {
    if (!drag) return false;
    var dy = y - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) < 5) return false;
      drag.active = true;
      track.classList.add('dragging');
    }
    var px = drag.base + dy;
    // rubber-band at the two ends

      var a2 = pts[pts.length - 1].split(',').map(Number);
      var b2 = pts[pts.length - 2].split(',').map(Number);
      var dx = a2[0] - b2[0], dy = a2[1] - b2[1];
      var m2 = Math.hypot(dx, dy) || 1; dx /= m2; dy /= m2;
      return '<polyline points="' + pts.join(' ') + '" stroke="' + colour +
             '" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>' +
             '<polygon points="' + (a2[0] + dx * 4).toFixed(1) + ',' + (a2[1] + dy * 4).toFixed(1) + ' ' +
               (a2[0] - dy * 2.6).toFixed(1) + ',' + (a2[1] + dx * 2.6).toFixed(1) + ' ' +
               (a2[0] + dy * 2.6).toFixed(1) + ',' + (a2[1] - dx * 2.6).toFixed(1) +
             '" fill="' + colour + '" stroke="none"/>';
    }
    document.getElementById('pose_spin').innerHTML =
      arc(ay, az, flipped.pitch,             '#dc2626') +   // tilt,  about X
      arc(az, ax, flipped.roll,              '#16a34a') +   // turn,  about Y
      arc(ax, ay, SWIRL_INV * screen_roll(), '#2563eb');    // swirl, about Z

    // plate_move — the phone carries its travel now; the axes hold still. Each
    // axis is clamped on its own so a big move on one never drags the picture off.
    function clamp_ax(v) { var u = v * POSE_SC; return Math.max(-AX_MAX, Math.min(AX_MAX, u)); }
    var mp = model_pos();
    var mv = { x: clamp_ax(mp.x), y: clamp_ax(mp.y), z: clamp_ax(mp.z) };
    var mvp0 = iso(mv);
    // axis_read: a fat coloured bar from the origin to where the phone stands on
    // that axis, a knob at the end of it, and a dashed line joining the knob to
    // the phone — read one axis at a time without doing the projection yourself.
    var guide = '', knob = '';
    [[ax, '#dc2626', mv.x], [ay, '#16a34a', mv.y], [az, '#2563eb', mv.z]].forEach(function (g) {
      var v = g[0], colour = g[1], d = g[2];
      var p = iso({ x: v.x * d, y: v.y * d, z: v.z * d });
      if (Math.abs(d) > 0.6) {
        guide += '<line x1="0" y1="0" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) +
                 '" stroke="' + colour + '" stroke-width="3" stroke-linecap="round" opacity="0.45"/>' +
                 '<line x1="' + p.x.toFixed(1) + '" y1="' + p.y.toFixed(1) + '" x2="' + mvp0.x.toFixed(1) +
                 '" y2="' + mvp0.y.toFixed(1) + '" stroke="' + colour + '" stroke-width="0.9" opacity="0.6" stroke-dasharray="2.5 2.5"/>';
        // the knob rides above the plate: the phone can never hide a reading
        knob += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
                '" r="2.6" fill="' + colour + '" stroke="#ffffff" stroke-width="0.9"/>';
      }
    });
    // origin_top — where the three axes meet is the one point the whole picture
    // is measured from, so it is drawn LAST, above the plate: the phone passes
    // in front of it and behind it, and it never disappears either way.
    knob += '<circle cx="0" cy="0" r="3.4" fill="none" stroke="rgba(0,0,0,0.75)" stroke-width="1.1"/>' +
            '<circle cx="0" cy="0" r="1.1" fill="rgba(0,0,0,0.75)"/>';
    document.getElementById('pose_guide').innerHTML = guide;
    document.getElementById('pose_knob').innerHTML = knob;
    // the phone plate: a rectangle in its own x/y plane, standing where it has
    // travelled to rather than at the origin
    function corner(sx2, sy2) {
      return { x: mv.x + px_.x * sx2 + py_.x * sy2,
               y: mv.y + px_.y * sx2 + py_.y * sy2,
               z: mv.z + px_.z * sx2 + py_.z * sy2 };
    }
    var w2 = 10, h2 = 18;
    var cs = [corner(-w2, h2), corner(w2, h2), corner(w2, -h2), corner(-w2, -h2)];
    document.getElementById('pose_plate').setAttribute('points',
      cs.map(function (c) { return pt(c, 1); }).join(' '));
    document.getElementById('pose_shadow').innerHTML =
      '<polygon points="' + cs.map(function (c) { return pt({ x: c.x, y: 0, z: c.z }, 1); }).join(' ') + '"/>';
    set_line(document.getElementById('pose_top'), iso(corner(-w2, h2)), iso(corner(w2, h2)));
    // a faint tether back to the origin, so the departure reads as a departure
    set_line(document.getElementById('pose_move'), { x: 0, y: 0 }, mvp0);
    // read_split — one line per reading, each named for the thing it reads
    // rather than reduced to an initial. Distances first in the axis colours,
    // then the three angles, then the scale. Label left, value right, so the
    // column of numbers can be scanned without hunting.
    function cm_txt(v) {
      var n = v * 100;
      return (n < -0.05 ? '\u2212' : '+') + Math.abs(n).toFixed(1) + ' cm';
    }
    function deg_txt(v) {
      return (v < -0.5 ? '\u2212' : '+') + Math.abs(v).toFixed(0) + '\u00b0';
    }
    var lines = [
      ['right / left', cm_txt(mp.x), '#dc2626'],
      ['up / down',    cm_txt(mp.y), '#16a34a'],
      ['near / far',   cm_txt(mp.z), '#2563eb'],
      ['tilt top',     deg_txt(flipped.pitch),             'rgba(0,0,0,0.68)'],
      ['turn side',    deg_txt(flipped.roll),              'rgba(0,0,0,0.68)'],
      ['swirl flat',   deg_txt(SWIRL_INV * screen_roll()), 'rgba(0,0,0,0.68)'],
      ['scale',        '\u00d7' + mult.toFixed(2),         'rgba(0,0,0,0.68)']
    ];
    // no_number — the readout is gone from the face of the diagram: the lanes
    // below say the same thing in a form that can be read at a glance, and he
    // does not want a single figure on the page. The values still exist, in the
    // hidden line the state hook and the tests read.
    document.getElementById('pose_lbl').textContent = lines.map(function (L) {
      return L[0] + ' ' + L[1];
    }).join('  \u00b7  ');
  }

  // orientation -> rotation matrix (ZXY intrinsic, the W3C convention)
  function mat_from(alpha, beta, gamma) {
    var d = Math.PI / 180;
    var a = (alpha || 0) * d, b = (beta || 0) * d, g = (gamma || 0) * d;
    var cA = Math.cos(a), sA = Math.sin(a);
    var cB = Math.cos(b), sB = Math.sin(b);
    var cG = Math.cos(g), sG = Math.sin(g);
    return [
      cA * cG - sA * sB * sG, -cB * sA,  cA * sG + cG * sA * sB,
      cG * sA + cA * sB * sG,  cA * cB,  sA * sG - cA * cG * sB,
                   -cB * sG,       sB,               cB * cG
    ];
  }
  function mul_vec(m, v) {
    return { x: m[0]*v.x + m[1]*v.y + m[2]*v.z,
             y: m[3]*v.x + m[4]*v.y + m[5]*v.z,
             z: m[6]*v.x + m[7]*v.y + m[8]*v.z };
  }
  function mul_t_vec(m, v) {   // transpose(m) * v
    return { x: m[0]*v.x + m[3]*v.y + m[6]*v.z,
             y: m[1]*v.x + m[4]*v.y + m[7]*v.z,
             z: m[2]*v.x + m[5]*v.y + m[8]*v.z };
  }

  function on_orientation(e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    Rnow = mat_from(e.alpha, e.beta, e.gamma);
    if (!R0) R0 = Rnow;
  }
  function on_motion(e) {
    var a = e.acceleration;
    if (!a || (a.x == null && a.y == null && a.z == null)) return;   // needs the gravity-free stream
    if (!motionOn || !Rnow || !R0) return;
    var rr = e.rotationRate || {};
    var rot = Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0);
    rotVeto = Math.max(0, Math.min(1, 1 - (rot - ROT_OPEN) / (ROT_SHUT - ROT_OPEN)));
    var iv = e.interval || 0.0166;
    var dt = iv < 1 ? iv : iv / 1000;

    // phone axes -> world -> zero frame: rotation falls out here
    var aw = mul_vec(Rnow, { x: a.x || 0, y: a.y || 0, z: a.z || 0 });
    var az = mul_t_vec(R0, aw);
    // zero_cal: while levelling, believe nothing and measure everything
    if (calLeft > 0) {
      calLeft -= dt;
      calSum.x += az.x; calSum.y += az.y; calSum.z += az.z; calN++;
      calSq += az.x * az.x + az.y * az.y + az.z * az.z;
      var ag = e.accelerationIncludingGravity;
      if (ag && ag.x != null) {
        var gm = Math.hypot(ag.x || 0, ag.y || 0, ag.z || 0) || 1;
        gZero = [ +( (ag.x || 0) / gm ).toFixed(3), +( (ag.y || 0) / gm ).toFixed(3), +( (ag.z || 0) / gm ).toFixed(3) ];
      }
      vel.x = vel.y = vel.z = 0; moving = false; quietFor = 0; lastAccel = 0;
      if (calLeft <= 0 && calN) {
        var mx = calSum.x / calN, my = calSum.y / calN, mz = calSum.z / calN;
        // cal_trust: a reading is only an offset if the phone was actually still.
        // The spread about the mean says whether it was; a hand still moving gives
        // a wide one, and its 'offset' would be nonsense worth more than no offset
        // at all — so that one is thrown away and the last good one kept.
        var sd = Math.sqrt(Math.max(0, calSq / calN - (mx * mx + my * my + mz * mz)));
        if (sd < CAL_SD) {
          bias.x = mx; bias.y = my; bias.z = mz;
          say('sent', 'levelled \u00b7 offset ' + Math.hypot(mx, my, mz).toFixed(3) + ' m/s\u00b2');
          if (typeof mark_add === 'function') mark_add('levelled', {
            bias: [+mx.toFixed(4), +my.toFixed(4), +mz.toFixed(4)],
            gravity: gZero, spread: +sd.toFixed(4), samples: calN });
        } else {
          say('warn', 'moved while levelling \u2014 offset kept from before');
          if (typeof mark_add === 'function') mark_add('level_failed',
            { spread: +sd.toFixed(4), samples: calN });
        }
      }
      smooth_step(dt);
      return;
    }
    az.x -= bias.x; az.y -= bias.y; az.z -= bias.z;
    var mag = Math.hypot(az.x, az.y, az.z);
    lastAccel = mag;
    movedSign = (Math.abs(az.x) >= Math.abs(az.y) ? (az.x >= 0 ? 1 : -1) : (az.y >= 0 ? 1 : -1));
    // quiet time is counted in SAMPLE time, not wall-clock: if the phone throttles
    // its sensor the two drift apart, and only sample time reflects what was measured
    if (lockLeft > 0) lockLeft -= dt;               // the lock always expires
    if (mag < MOVE_A && rot < 20) {
      quietFor += dt;
      if (moving && quietFor > STILL_MS / 1000) end_move();
      if (quietFor > STILL_MS / 1000) lockLeft = 0;  // genuinely still: arm again now
      // dwell_mark — his protocol says that if the return was right he simply
      // STAYS there a second. That is a signal, not an absence of one, so it
      // goes on the judgement track by itself with where the world had settled.
      if (!moving && !dwelled && quietFor > DWELL_S) {
        dwelled = true;
        if (typeof mark_add === 'function') mark_add('dwell', {
          after: lastMove || '',
          pos: [+pos.x.toFixed(4), +pos.y.toFixed(4), +pos.z.toFixed(4)] });
      }
    } else {
      quietFor = 0;
      if (!moving && lockLeft <= 0) {
        moving = true; moveFor = 0; dwelled = false;
        run = { x: 0, y: 0, z: 0 }; dir = { x: 0, y: 0, z: 0 };
      }
    }

    var kv = Math.exp(-dt / VEL_TAU);
    if (moving) {
      var slowing = false;
      ['x', 'y', 'z'].forEach(function (k) {
        var a = az[k];
        a = Math.abs(a) < DEAD ? 0 : (a - (a > 0 ? DEAD : -DEAD));
        a *= rotVeto;
        // shake_test: is this axis going anywhere, or just vibrating?
        var w = Math.min(1, dt / TREM_TAU);
        aBar[k] += (a - aBar[k]) * w;
        aMag[k] += (Math.abs(a) - aMag[k]) * w;
        if (aMag[k] > 0.06 && Math.abs(aBar[k]) < TREM_R * aMag[k]) {
          trem[k] += dt;
          if (trem[k] > TREM_HOLD) { vel[k] = 0; a = 0; }
        } else {
          trem[k] = 0;
        }
        // latch which way this move is going, once it is going anywhere
        if (!dir[k] && Math.abs(vel[k]) > LATCH_V) {
          dir[k] = vel[k] > 0 ? 1 : -1;
          // run_true: anything the settling wobble put on the tally before the
          // direction was known is not part of the move, so a slide right can
          // never be reported as a move left
          if (run[k] * dir[k] < 0) run[k] = 0;
        }
        var braking = !!(dir[k] && a * dir[k] < 0);
        if (braking) {
          // the hand is braking: bleed speed off, never push the other way
          slowing = true;
          vel[k] = (vel[k] + a * dt) * BRAKE_DECAY;
          if (vel[k] * dir[k] < 0) vel[k] = 0;      // stop at zero, do not reverse
        } else {
          // trap_free: weak drive on this axis means it is coasting, and coasting
          // decays fast. Strong drive keeps the near-lossless integration.
          var tau = Math.abs(a) < COAST_A ? COAST_TAU : VEL_TAU;
          vel[k] = (vel[k] + a * dt) * Math.exp(-dt / tau);
        }
        // creep_floor: the stop threshold may only kill a move that is ending.
        // Applied unconditionally it also killed every move that was starting —
        // a gentle push never got its first sample above STOP_V, so slow moves
        // (and the whole closer/away axis) registered nothing at all.
        if ((braking || !a) && Math.abs(vel[k]) < STOP_V) vel[k] = 0;
        // lead grows with the push and holds through the brake
        var want = vel[k] * LEAD;
        if (!braking || Math.abs(want) > Math.abs(lead[k])) lead[k] = want;
        var d = vel[k] * dt;
        pos[k] += d;               // no leak: where it lands is where it stays
        if (!dir[k] || d * dir[k] > 0) run[k] += d;   // only forward travel counts
      });
      // everything has come to rest: end the move now rather than waiting out
      // the quiet timer — this is the 'jump the gun' he asked for
      if (!vel.x && !vel.y && !vel.z && (slowing || quietFor > 0.05)) end_move();
      // trap_free: and no move may simply keep running
      moveFor += dt;
      if (moving && moveFor > MOVE_MAX) {
        // only worth a mark if the runaway actually carried the world somewhere;
        // a capped move that went nowhere is the shake test doing its job
        var carried = Math.max(Math.abs(run.x), Math.abs(run.y), Math.abs(run.z));
        if (carried > 0.01 && typeof mark_add === 'function') mark_add('move_capped', {
          ran: +moveFor.toFixed(2),
          vel: [+vel.x.toFixed(3), +vel.y.toFixed(3), +vel.z.toFixed(3)] });
        end_move();
      }
    }
    smooth_step(dt);
  }
  // smooth_move: chase the model. Driven off the sensor clock, not the paint
  // clock, so a burst of samples with no frame between them still shapes the
  // move the same way — and so the levelling window keeps the picture alive.
  function smooth_step(dt) {
    var sdt = Math.min(0.05, dt);
    ['x', 'y', 'z'].forEach(function (k) {
      var target = pos[k] + lead[k];
      showV[k] += (SM_W * SM_W * (target - show[k]) - 2 * SM_W * showV[k]) * sdt;
      show[k]  += showV[k] * sdt;
    });
  }

  // lane_view — a rolling four seconds, one lane per axis, six lanes stacked.
  // Each sample is [x, y, z, tilt, turn, swirl]: where the world stands on that
  // axis, and how far the phone is turned about it. Each lane fills solid from
  // its own centre, up for positive and down for negative, and carries no line,
  // no label and no number — the shape and the colour are the whole message.
  var TRACE_N = 240;
  var trace = new Array(TRACE_N);
  var traceAt = 0;
  var traceEl = document.getElementById('trace');
  var traceCtx = traceEl ? traceEl.getContext('2d') : null;
  // lane_three — one lane per VECTOR, and only the three: red for right/left,
  // green for up/down, blue for near/far, each running positive above its centre
  // and negative below. The three rotations are not distances and never belonged
  // here; they show in the diagram now, as arcs about the axes they turn (see
  // spin_arc), which is where a rotation can actually be seen.
  var LANES = [
    { i: 0, c: '#dc2626' },   // right / left
    { i: 1, c: '#16a34a' },   // up / down
    { i: 2, c: '#2563eb' }    // near / far
  ];
  function trace_push(v) {
    trace[traceAt] = v;
    traceAt = (traceAt + 1) % TRACE_N;
  }
  // lane_slow — the ring is still fed EVERY frame, so nothing about the capture
  // changes; only the drawing is rationed. Six lanes of 240 points redrawn 60
  // times a second is 86,000 path segments a second on top of a 3D-transformed
  // paper, and that is what was taking the browser down. Drawing 8 times a
  // second from every third point is 1/22nd of the work and looks the same,
  // because these are solid blocks, not fine lines.
  var LANE_MS   = 125;      // ms between redraws
  var LANE_STEP = 3;        // draw every Nth point
  var laneLast  = 0;
  function trace_draw(now) {
    if (!traceCtx) return;
    if (now && now - laneLast < LANE_MS) return;
    laneLast = now || 0;
    var W = traceEl.width, H = traceEl.height;
    traceCtx.clearRect(0, 0, W, H);
    var n = LANES.length;
    var pad = 8, gap = 6;
    var lh = (H - pad * 2 - gap * (n - 1)) / n;
    // lane_scale — each lane finds its own full scale from what it has seen, so
    // a small axis is not flattened by a large one; a floor keeps a quiet lane
    // from turning noise into a mountain.
    var floors = [0.03, 0.03, 0.03];
    var maxv = floors.slice();
    for (var i = 0; i < TRACE_N; i += LANE_STEP) {
      var s2 = trace[(traceAt + i) % TRACE_N];
      if (!s2) continue;
      for (var k = 0; k < n; k++) if (Math.abs(s2[k]) > maxv[k]) maxv[k] = Math.abs(s2[k]);
    }
    LANES.forEach(function (L, k) {
      var top = pad + k * (lh + gap);
      var mid = top + lh / 2;
      var half = lh / 2 - 1;
      traceCtx.fillStyle = 'rgba(0,0,0,0.035)';
      traceCtx.fillRect(0, top, W, lh);
      traceCtx.beginPath();
      traceCtx.moveTo(0, mid);
      var last = 0;
      for (var i = 0; i < TRACE_N; i += LANE_STEP) {
        var s3 = trace[(traceAt + i) % TRACE_N];
        var x = (i / (TRACE_N - 1)) * W;
        var v = s3 ? s3[L.i] : 0;
        var y = mid - (v / maxv[k]) * half;
        traceCtx.lineTo(x, y);
        last = x;
      }
      traceCtx.lineTo(last, mid);
      traceCtx.closePath();
      traceCtx.fillStyle = L.c;
      traceCtx.globalAlpha = 0.8;
      traceCtx.fill();
      traceCtx.globalAlpha = 1;
    });
  }

  // view — the ONE place that turns where the phone is into what the screen
  // shows. Grid, dot, diagram and tests all read this; nothing recomputes it.
  //   cam   where the phone has travelled in the zero frame, metres
  //         (+x right, +y up, +z toward the eye), lead term folded in
  //   dist  how far the eye is from the surface
  //   mult  the magnifier: how much world one phone-width of hand sweeps
  //   ox/oy pixels the world is offset on screen (flip_axes: it travels WITH
  //         the phone)
  // roll_hold — how far the screen has swirled about the line from your eye,
  // measured from the zero pose. The phone's own up direction, expressed in the
  // zero frame, gives the angle straight away: at zero it is world up and the
  // answer is 0. Pitch and yaw are deliberately absent — tipping the phone
  // toward or away, or turning it left and right, still changes nothing.
  // view_switch — the two directions the paper answers to, each with its own
  // sign, because they have been reversed independently and will be again.
  //   PAN_INV    left/right, up/down and the swirl counter-turn
  //   DEPTH_INV  the magnifier
  // depth_back: DEPTH_INV goes back to +1 — bringing the phone toward the eye
  // makes the paper BIGGER again, and taking it away makes it smaller. This is
  // the third time this one sign has moved, which is exactly why it is a named
  // switch and not a buried minus. Pan and swirl are untouched.
  var PAN_INV   = 1;
  var DEPTH_INV = 1;
  function screen_roll() {
    var m = rel_matrix(); if (!m) return 0;
    return Math.atan2(-m[1], m[4]) * 180 / Math.PI;
  }
  // paper_tilt — how far the top of the phone has come toward your eye, from
  // the zero pose. Tipping the top toward you leans the paper's TOP away, so
  // the squares crowd together up there and open out along the bottom.
  // PITCH_INV is the sign switch, as everything else here has one.
  // tilt_back — PITCH_INV flips to +1: tipping the top of the phone toward you
  // now brings the paper's TOP toward you and pushes its bottom away, the
  // opposite of every build since paper_tilt. Only the top/bottom axis moves.
  // TURN_INV stays -1, so the side axis keeps its old rule — the edge you bring
  // toward your eye is the edge that lies away. The two are on opposite rules
  // now, deliberately, until he says which one he wants for both.
  // ground_view — the reset pose is not a sheet held up facing you, it is a
  // sheet lying on the FLOOR seen from about 45 degrees above it. So the lean
  // starts at TILT_BASE and the phone moves it from there: tip the phone
  // forward (top away, screen looking down) and the lean unwinds to nothing —
  // you are looking straight down at the paper; tip the top back toward you and
  // it goes past 45, the bottom crowding and the top running to a vanishing
  // point. PITCH_INV is -1 for that to be the way round it falls.
  var TILT_BASE = 45;
  // turn_flip: TURN_INV +1 — pushing the right edge away now throws the paper's
  // vanishing point the other way. Only the side axis moves; the top/bottom lean
  // and its 45-degree ground base are untouched.
  var PITCH_INV = -1, TURN_INV = 1;
  var TILT_GAIN = 1.7;       // a modest tilt of the hand should lay it well down
  var TILT_MAX  = 74;        // deg: never let the plane go edge-on and vanish
  function lean(v, sign) {
    var p = sign * TILT_GAIN * v;
    return Math.max(-TILT_MAX, Math.min(TILT_MAX, p));
  }
  // lean_normal — both leans come from ONE thing: where the screen's own normal
  // is pointing in the zero frame. Column 2 of the relative matrix IS that
  // normal, so its swing up-and-down gives the top-away lean and its swing
  // left-and-right gives the side-away lean, cleanly separated and correctly
  // signed. (The Euler terms used before were not: +25 and -25 of gamma both
  // came out +42.5, because that extraction folds the sign away.)
  function screen_pitch() {
    var m = rel_matrix(); if (!m) return TILT_BASE;
    var v = TILT_BASE + lean(Math.atan2(m[5], m[8]) * 180 / Math.PI, PITCH_INV);
    return Math.max(-TILT_MAX, Math.min(TILT_MAX, v));
  }
  // turn_lean — the same thing on the other axis: turning the phone like a door
  // lays the paper's right-hand side away, with the vanishing point out to the
  // side instead of over the top.
  function screen_turn() {
    var m = rel_matrix(); if (!m) return 0;
    return lean(Math.atan2(m[2], m[8]) * 180 / Math.PI, TURN_INV);
  }
  function view() {
    var w = frame.clientWidth || 320;
    var cam = { x: show.x, y: show.y, z: show.z };
    var dist = Math.max(D_MIN, Math.min(D_MAX, D0 - DEPTH_INV * cam.z));
    var mult = Math.max(MULT_MIN, Math.min(MULT_MAX, Math.pow(D0 / dist, Z_POWER)));
    var pxPerM = (w / PHONE_W) * mult;
    var lim = w * 3;
    return {
      w: w, cam: cam, dist: dist, mult: mult, pxPerM: pxPerM,
      roll: PAN_INV * screen_roll(), tilt: screen_pitch(), turn: screen_turn(),
      ox: Math.max(-lim, Math.min(lim,  PAN_INV * cam.x * pxPerM)),
      oy: Math.max(-lim, Math.min(lim, -PAN_INV * cam.y * pxPerM))
    };
  }

  function paint_world(now) {
    if (!motionOn) return;
    var v = view();
    var w = v.w, dist = v.dist, mult = v.mult;
    var sx = v.ox, sy = v.oy;
    // three lanes: where the world stands on each axis, in metres
    trace_push([v.cam.x, v.cam.y, v.cam.z]);
    trace_draw(now);
    var root = document.documentElement.style;
    root.setProperty('--sx', sx.toFixed(1) + 'px');
    root.setProperty('--sy', sy.toFixed(1) + 'px');
    root.setProperty('--sc', mult.toFixed(3));
    root.setProperty('--rot', v.roll.toFixed(2) + 'deg');
    root.setProperty('--tilt', v.tilt.toFixed(2) + 'deg');
    root.setProperty('--turn', v.turn.toFixed(2) + 'deg');
    // star_lift — how high the star floats above the paper, read off the scale:
    // ×1 and above is coming in to land, below ×1 it is climbing away.
    var near = Math.max(-1, Math.min(1, Math.log(mult) / Math.log(8)));
    var m = Math.max(0.05, mult);
    root.setProperty('--shx', ((1.5 - near * 1.5) / m).toFixed(2) + 'px');
    root.setProperty('--shy', ((10 - near * 8) / m).toFixed(2) + 'px');
    root.setProperty('--shb', ((12 - near * 9) / m).toFixed(2) + 'px');
    root.setProperty('--sho', (0.42 + near * 0.22).toFixed(2));
    draw_pose(mult, now);
    requestAnimationFrame(paint_world);
  }

  // zero_split — Set zero re-centres the dot and re-takes the attitude, but
  // LEAVES the depth alone: how far in or out you have zoomed survives a
  // re-centre, which is the only way to work at a scale and still recover the
  // middle of the picture. Reset all is the separate button that clears depth
  // too and puts the whole model back to ×1.
  function zero_here(keepDepth) {
    R0 = Rnow;
    var z = keepDepth ? pos.z : 0;
    vel = { x: 0, y: 0, z: 0 };
    pos = { x: 0, y: 0, z: z };
    run = { x: 0, y: 0, z: 0 };
    lead = { x: 0, y: 0, z: 0 };
    show = { x: 0, y: 0, z: z }; showV = { x: 0, y: 0, z: 0 };
    // open the levelling window: hold still, this is the pose we measure from
    calLeft = CAL_MS / 1000; calSum = { x: 0, y: 0, z: 0 }; calN = 0; calSq = 0;
    if (motionOn) say('send', 'levelling \u2014 hold still\u2026');
    moving = false; lastMove = ''; quietFor = 0; lockLeft = 0; dir = { x: 0, y: 0, z: 0 };
    moveFor = 0; dwelled = true;   // a reset is not a dwell
    aBar = { x: 0, y: 0, z: 0 }; aMag = { x: 0, y: 0, z: 0 }; trem = { x: 0, y: 0, z: 0 };
    if (!keepDepth) document.documentElement.style.setProperty('--sc', '1');
    document.documentElement.style.setProperty('--rot', '0deg');
    document.documentElement.style.setProperty('--tilt', TILT_BASE + 'deg');
    document.documentElement.style.setProperty('--turn', '0deg');
  }
  function start_world() {
    motionOn = true;
    R0 = null; Rnow = null;
    zero_here();
    window.addEventListener('deviceorientation', on_orientation);
    window.addEventListener('devicemotion', on_motion);
    motionBtn.classList.add('on');
    if (poseEl) poseEl.hidden = false;
    if (traceEl) traceEl.hidden = false;
    if (hint) hint.style.opacity = '0';
    requestAnimationFrame(paint_world);
  }

  function motion_on() {
    var needO = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
    var needM = (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function');
    if (!needO && !needM) {
      if (!window.DeviceOrientationEvent && !window.DeviceMotionEvent) { say('warn', 'no motion sensors here'); return; }
      start_world(); return;
    }
    var asks = [];
    if (needO) asks.push(DeviceOrientationEvent.requestPermission());
    if (needM) asks.push(DeviceMotionEvent.requestPermission());
    Promise.all(asks).then(function (res) {
      if (res.every(function (r) { return r === 'granted'; })) start_world();
      else say('warn', 'motion blocked \u2014 allow it in Settings');
    }).catch(function () { say('warn', 'motion blocked \u2014 allow it in Settings'); });
  }
  // the full reset: centre AND put the depth back to \u00d71

  // mark_zero — a zero or a reset during a take is itself data: it says 'from
  // here on, read the numbers from a new origin'. Stamped with where the model
  // had drifted to and what the scale was at that instant, so the segment before
  // it can still be read on its own terms.
  function mark_zero(kind) {
    if (typeof mark_add !== 'function') return;
    var v = view();
    mark_add(kind, { pos: { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), z: +pos.z.toFixed(4) },
                     mult: +v.mult.toFixed(3), tilt: +v.tilt.toFixed(1), turn: +v.turn.toFixed(1),
                     roll: +v.roll.toFixed(1) });
  }


  // ---- gesture_lab: hold to record every sensor the phone will give ----
  // A take is { name, ts, ms, samples: [...] }. Each sample carries whatever
  // arrived at that instant: orientation (alpha/beta/gamma), acceleration with
  // and without gravity, and rotation rate. Angles are also stored relative to
  // the pose at the START of the hold, since that is the frame he cares about.
  var GEST_KEY = 'vampjam_gestures';
  var SYNC_URL = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var REPO_RAW = 'https://raw.githubusercontent.com/mPulseMedia/vampjam/main/';
  var API_URL  = 'https://api.github.com/repos/mPulseMedia/vampjam/contents/lab_gestures.json?ref=main';

  var gRec  = document.getElementById('g_rec');
  var gGood = document.getElementById('g_good');
  var gWire = document.getElementById('g_wire');
  var gBar  = document.getElementById('gest_bar');
  var gMsg  = document.getElementById('g_msg');
  var gRecent = document.getElementById('g_recent');
  // take_clear: one place decides what the bar looks like and says
  var gStat = {
    set textContent(v) { say('idle', v); },
    get textContent() { return gMsg.textContent; }
  };
  function say(state, text) {
    gBar.classList.remove('is_rec', 'is_send', 'is_sent', 'is_warn');
    if (state !== 'idle') gBar.classList.add('is_' + state);
    gMsg.textContent = text;
  }
  function paint_recent() {
    var list = gest_get().slice(-4);
    gRecent.innerHTML = list.map(function (t2) {
      return '<span class="g_chip">' + String(t2.name || 'unnamed').replace(/[<>&]/g, '') +
             ' · ' + (t2.ms / 1000).toFixed(1) + 's</span>';
    }).join('');
  }
  var gCopy = document.getElementById('g_copy');
  var gSend = document.getElementById('g_send');
  var gCount= document.getElementById('g_count');

  var recording = false, take = null, gRef = null;
  var live = { ori: null, acc: null, accG: null, rot: null };

  function gest_get() {
    try { var a = JSON.parse(localStorage.getItem(GEST_KEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function gest_put(list) {
    try { localStorage.setItem(GEST_KEY, JSON.stringify(list.slice(-40))); } catch (e) {}
    if (gCount) gCount.textContent = list.length + ' take' + (list.length === 1 ? '' : 's');
    if (typeof paint_recent === 'function') paint_recent();
  }
  gest_put(gest_get());

  function grab_orientation(e) {
    // browsers fire one empty event when you subscribe — it must not become
    // the reference pose, or every angle afterwards is measured from zero
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    live.ori = [r3(e.alpha), r3(e.beta), r3(e.gamma)];
    if (recording && !gRef) gRef = { a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0 };
  }
  function grab_motion(e) {
    var a = e.acceleration || {}, ag = e.accelerationIncludingGravity || {}, rr = e.rotationRate || {};
    if (a.x == null && ag.x == null && rr.alpha == null) return;   // empty priming event
    live.acc  = [r3(a.x), r3(a.y), r3(a.z)];
    live.accG = [r3(ag.x), r3(ag.y), r3(ag.z)];
    live.rot  = [r3(rr.alpha), r3(rr.beta), r3(rr.gamma)];
    if (recording) push_sample(e.interval || null);
  }
  // (an integrator from an earlier model used to live here and still ran on
  //  every sample — it referenced a constant that no longer exists, threw
  //  inside the sensor handler, and silently emptied four of his takes.)
  function r3(v) { return (v == null) ? null : Math.round(v * 1000) / 1000; }
  function push_sample(interval) {
    if (!take) return;
    var t = Date.now() - take.ts;
    var o = live.ori || [null, null, null];
    var rel = gRef && live.ori
      ? [r3(ang(o[0] - gRef.a)), r3(o[1] - gRef.b), r3(o[2] - gRef.g)]
      : [null, null, null];
    take.samples.push({ t: t, ori: o, rel: rel, acc: live.acc, accG: live.accG, rot: live.rot, iv: interval,
                        // lag_trace: what the page DID with that sample, so a take
                        // can be measured end to end instead of guessed at
                        st: [r3(pos.x), r3(pos.y), r3(pos.z),
                             r3(vel.x), r3(vel.y), r3(vel.z),
                             moving ? 1 : 0] });
  }
  function ang(d) { while (d > 180) d -= 360; while (d < -180) d += 360; return d; }

  var sensorsWired = false;
  function sensors_live(after) {
    // once wired, stay wired: asking again would make every later hold start
    // one tick late (and a very short tap could then start after it ended)
    if (sensorsWired) { after(true); return; }
    var needO = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
    var needM = (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function');
    function wire() {
      sensorsWired = true;
      window.addEventListener('deviceorientation', grab_orientation);
      window.addEventListener('devicemotion', grab_motion);
      after(true);
    }
    if (!needO && !needM) { wire(); return; }
    var asks = [];
    if (needO) asks.push(DeviceOrientationEvent.requestPermission());
    if (needM) asks.push(DeviceMotionEvent.requestPermission());
    Promise.all(asks).then(function (res) {
      if (res.every(function (r) { return r === 'granted'; })) wire();
      else after(false);
    }).catch(function () { after(false); });
  }

  var wantRec = false;
  function rec_start() {
    if (recording) return;
    wantRec = true;
    say('rec', 'starting…');
    sensors_live(function (ok) {
      if (!ok) { wantRec = false; say('warn', 'motion permission was refused'); return; }
      if (!wantRec) return;         // stopped before permission came back
      recording = true; gRef = null;
      // mark_time: events is the judgement track that runs alongside the samples —
      // every zero, every reset, every 'a little off' and every 'haywire', stamped
      // with the millisecond it happened and where the model was at that instant.
      // no_name — the field is gone; a take is identified by its number and its
      // marks, which is what actually distinguishes one from another.
      take = { name: 'take ' + (gest_get().length + 1), ts: Date.now(), ms: 0,
               samples: [], events: [] };
      gRec.classList.add('recording');
      gRec.textContent = 'Stop  0.0s';
      // rig_say: short lines — one line and one lamp is the whole report
      say('rec', 'recording "' + take.name + '"');
      clearInterval(recTimer);
      recTimer = setInterval(function () {
        if (!recording || !take) return;
        gRec.textContent = 'Stop  ' + ((Date.now() - take.ts) / 1000).toFixed(1) + 's';
      }, 100);
    });
  }
  function rec_stop() {
    wantRec = false;
    if (!recording) return;
    recording = false;
    clearInterval(recTimer);
    gRec.classList.remove('recording');
    gRec.textContent = 'Record';
    // drop is_rec first, so the name field is back in the layout before the
    // focus below tries to raise the keyboard on it
    gBar.classList.remove('is_rec');
    [gGood, gWire].forEach(function (b) { if (b) b.classList.remove('hit', 'down'); });
    if (!take) return;
    take.ms = Date.now() - take.ts;
    var done = take;
    var list = gest_get();
    list.push(done);
    gest_put(list);
    take = null;
    if (!done.samples.length) {
      say('warn', 'no sensor data — check motion permission');
      return;
    }
    say('send', 'saving · ' + done.samples.length + ' samples · ' +
                (done.ms / 1000).toFixed(1) + 's');
    send_takes(true, done);
  }

  // tap_rec — tap to start, tap again to stop. Holding meant the recording hand
  // and the moving hand were the same hand; now they are not, and the two
  // judgement buttons are reachable mid-take.
  gRec.addEventListener('click', function (e) {
    e.preventDefault();
    if (recording || wantRec) rec_stop(); else rec_start();
  });
  // mark_add — one entry on the judgement track. Nothing is recorded when the
  // tape is not running, deliberately: these are notes ABOUT a take.
  function mark_add(kind, extra) {
    if (!recording || !take) return false;
    var e = { t: Date.now() - take.ts, kind: kind };
    if (extra) for (var k in extra) e[k] = extra[k];
    take.events.push(e);
    say('rec', kind + ' at ' + (e.t / 1000).toFixed(1) + 's · ' + take.events.length + ' marks');
    return true;
  }
  window.__lab_mark = mark_add;
  // hold_read — a press is timed. A tap says 'this', a long press says 'this,
  // badly', and the length is carried on the mark so the difference survives
  // into the data instead of living only in his head. Red resets the moment it
  // goes down (that is the whole point of reaching for it) and files its mark on
  // release, once the length is known.
  [[gGood, 'good', false], [gWire, 'bad', true]].forEach(function (p) {
    var el = p[0], kind = p[1], resets = p[2];
    if (!el) return;
    var downAt = 0;
    function down(e) {
      e.preventDefault();
      downAt = Date.now();
      el.classList.add('down');
      if (!resets) return;
      if (!motionOn) { motion_on(); return; }
      mark_zero('reset');
      zero_here(false);
    }
    function up(e) {
      if (!downAt) return;
      if (e) e.preventDefault();
      var held = Date.now() - downAt;
      downAt = 0;
      el.classList.remove('down');
      if (mark_add(kind, { hold: held, long: held >= 600 })) {
        el.classList.add('hit');
        setTimeout(function () { el.classList.remove('hit'); }, 260);
      }
    }
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', function () { downAt = 0; el.classList.remove('down'); });
    el.addEventListener('mousedown', down);
    window.addEventListener('mouseup', up);
  });

  gCopy.addEventListener('click', function () {
    var list = gest_get();
    if (!list.length) { gStat.textContent = 'nothing recorded yet'; return; }
    var txt = JSON.stringify(list[list.length - 1]);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { gStat.textContent = 'last take copied'; },
                                              function () { gStat.textContent = 'copy failed'; });
    } else { gStat.textContent = 'copy not available here'; }
  });

  // send_takes — park them in the repo (lab_gestures.json) so they can be read
  // from the other side without any copy and paste
  var sending = false;
  var recTimer = 0;
  function send_takes(quiet, done) {
    var list = gest_get();
    if (!list.length || sending) return;
    sending = true;
    say('send', done ? ('sending "' + done.name + '"') : 'sending…');
    fetch(API_URL + '&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (have) {
        if (!Array.isArray(have)) have = [];
        var seen = {};
        have.forEach(function (t) { if (t && t.ts) seen[t.ts] = true; });
        var add = list.filter(function (t) { return !seen[t.ts]; });
        if (!add.length) { sending = false; say('sent', 'already sent'); return; }
        var out = have.concat(add).slice(-60);
        return fetch(SYNC_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: 'lab_gestures.json', content: JSON.stringify(out, null, 1),
                                 message: 'gesture ' + (add[add.length - 1].name || 'take') })
        }).then(function (r) {
          sending = false;
          if (r.ok) say('sent', '✓ sent ' + add.length);
          else say('warn', 'send failed — kept on this phone');
        });
      })
      .catch(function () { sending = false; say('warn', 'send failed — kept on this phone'); });
  }
  gSend.addEventListener('click', function () { send_takes(false); });
  paint_recent();

  // test hook
  // ---- watch_live: reload the page whenever this file changes on the server ----
  // A development convenience, and it says so on screen so it is never a
  // mystery. It asks every WATCH_MS whether the file it was served from has a
  // new ETag (or, failing that, a new Last-Modified, or failing that a new
  // length); when it does, it reloads. It gives up after WATCH_QUIT of no
  // change, because a page left open overnight should not sit there polling.
  var WATCH_MS   = 5000;
  var WATCH_QUIT = 16 * 60 * 1000;
  (function () {
    var el = document.getElementById('watch');
    var msg = document.getElementById('watch_msg');
    if (!el || location.protocol === 'file:') return;
    var stamp = null, started = Date.now(), timer = 0;
    function show(text, cls) {
      el.hidden = false;
      el.classList.remove('is_off', 'is_hit');
      if (cls) el.classList.add(cls);
      msg.textContent = text;
    }
    function stop(why) { clearTimeout(timer); show(why, 'is_off'); }
    function tag(r, body) {
      return r.headers.get('etag') || r.headers.get('last-modified') || String(body.length);
    }
    function tick() {
      fetch(location.pathname + '?w=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.text().then(function (b) { return tag(r, b); }); })
        .then(function (t) {
          if (stamp === null) { stamp = t; show('watching'); }
          else if (t !== stamp) { show('changed \u2014 reloading', 'is_hit');
                                  setTimeout(function () { location.reload(); }, 120); return; }
          if (Date.now() - started > WATCH_QUIT) { stop('watch off \u2014 no change for 15 min'); return; }
          timer = setTimeout(tick, WATCH_MS);
        })
        .catch(function () { timer = setTimeout(tick, WATCH_MS * 3); });
    }
    show('watching');
    tick();
  })();

  window.__lab = {
    go: go,
    at: function () { return idx; },
    steady: function () { start_world(); },
    zero: function (keepDepth) { zero_here(keepDepth !== false); },
    reset: function () { zero_here(false); },
    rec: function (on) { on ? rec_start() : rec_stop(); },
    // pose the phone (degrees) — rotation alone must not move the world
    pose: function (alpha, beta, gamma) { on_orientation({ alpha: alpha, beta: beta, gamma: gamma }); },
    // n samples of acceleration in the PHONE's own axes, as the phone sends them
    shove: function (ax, ay, az, rot, n) {
      for (var i = 0; i < (n || 30); i++) {
        on_motion({ acceleration: { x: ax, y: ay, z: az },
                    rotationRate: { alpha: rot || 0, beta: 0, gamma: 0 },
                    interval: 0.0166 });
      }
      return { pos: { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), z: +pos.z.toFixed(4) }, veto: +rotVeto.toFixed(2) };
    },
    // what the maths is thinking right now, without waiting for a paint frame
    state: function () {
      var v = view();
      return { px: v.ox, py: v.oy, mult: v.mult, dist: v.dist, roll: v.roll, tilt: v.tilt, turn: v.turn,
               moving: moving, held: lastMove, lock: +Math.max(0, lockLeft).toFixed(2),
               show: { x: +show.x.toFixed(4), y: +show.y.toFixed(4), z: +show.z.toFixed(4) },
               cal: +Math.max(0, calLeft).toFixed(3),
               bias: { x: +bias.x.toFixed(4), y: +bias.y.toFixed(4), z: +bias.z.toFixed(4) },
               gravity: gZero,
               showV: { x: +showV.x.toFixed(4), y: +showV.y.toFixed(4), z: +showV.z.toFixed(4) },
               pos: { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), z: +pos.z.toFixed(4) } };
    },
    world: function () {
      var st = getComputedStyle(document.documentElement);
      return { sx: st.getPropertyValue('--sx').trim(), sy: st.getPropertyValue('--sy').trim(),
               sc: st.getPropertyValue('--sc').trim(),
               rot: st.getPropertyValue('--rot').trim(),
               tilt: st.getPropertyValue('--tilt').trim(),
               turn: st.getPropertyValue('--turn').trim(),
               read: (document.getElementById('pose_lbl').textContent || '') };
    },
    takes: function () { return gest_get(); }
  };
</script>
</body>
</html>
