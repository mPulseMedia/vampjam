<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>vampsf — lab</title>
<style>
  /* lab_frame — a sketch of the feeling the session list gave us: a fixed
     white frame with a rounded window cut in it, and a stack of full-screen
     cells that slides behind the window. The frame never moves; the cells do,
     and the frame's edge casts a shadow down onto whichever cell is showing.
     Cells: 1 red (top) · 2 white (middle) · 3 blue (bottom). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #ffffff; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation; color-scheme: light;
  }

  /* the white frame is simply the page; the window is what is cut out of it */
  .frame_window {
    background: #fcfcf8;
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    bottom: max(14px, env(safe-area-inset-bottom));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    border-radius: 22px;
    overflow: hidden;
    background: #ffffff;
  }
  /* frame_shadow — the white frame casting onto the cell below it: strongest
     from the top edge, present on all four. It rides ABOVE the cells. */
  .frame_shadow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
    box-shadow:
      inset 0 14px 18px -10px rgba(0,0,0,0.45),
      inset 0 -10px 16px -10px rgba(0,0,0,0.30),
      inset 12px 0 16px -12px rgba(0,0,0,0.30),
      inset -12px 0 16px -12px rgba(0,0,0,0.30);
  }

  .track {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    will-change: transform;
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .track.dragging { transition: none; }

  .cell {
    flex: 0 0 100%; height: 100%; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 74px; font-weight: 700; letter-spacing: 0.02em;
    user-select: none; -webkit-user-select: none;
  }
  /* dot_steady — the dot sits dead centre of every card. When the phone's
     motion sensors are running it is pushed the OTHER way from every wobble,
     so it holds still in the room while the screen jiggles around it. */
  /* graph_one — ONE surface for the whole window: graph paper, drawn once,
     behind everything. It pans and scales with the phone; nothing else carries
     lines, so there are no layers to see through. Sized 800% so even at the
     small end of the scale, panned to its limit, no edge comes into view. */
  .grid {
    position: absolute; left: -350%; top: -350%; width: 800%; height: 800%;
    pointer-events: none; z-index: 0; transform-origin: 50% 50%;
    transform: translate3d(var(--sx, 0px), var(--sy, 0px), 0) scale(var(--sc, 1));
    background-color: #fcfcf8;
    background-image:
      repeating-linear-gradient(to bottom, rgba(38,86,140,0.30) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(to right,  rgba(38,86,140,0.30) 0 1px, transparent 1px 30px);
  }
  .pin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
  /* dot_scale — the dot is an object IN the world, so it takes the world's
     scale as well as its position: near the eye it swells with the squares,
     far away it shrinks with them. */
  .pin_dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: currentColor; box-shadow: 0 2px 6px rgba(0,0,0,0.30);
    transform: translate3d(var(--sx, 0px), var(--sy, 0px), 0) scale(var(--sc, 1));
  }
  /* lab_build: every card wears the same colour, and the colour changes with
     each build — if it looks different from last time, the update landed. */
  .cell { background: transparent; color: #1d1d1f; }

  /* which cell you are on, in the frame itself */
  .dots {
    position: fixed; right: max(20px, calc(env(safe-area-inset-right) + 6px));
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 7px; z-index: 6;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1d1d1f; opacity: 0.18; }
  .dot.on { opacity: 0.75; }

  .back_btn {
    position: fixed; z-index: 6;
    top: max(78px, calc(env(safe-area-inset-top) + 66px));
    left: max(22px, calc(env(safe-area-inset-left) + 10px));
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.86); color: #1d1d1f;
    border: none; border-radius: 999px; padding: 9px 15px 9px 12px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    touch-action: manipulation;
  }
  .back_btn:active { transform: scale(0.96); }
  /* lab_release — a solid square in the corner wearing this release's colour,
     with this release's name inside it. New colour + new name every ship. */
  .build_tag {
    position: fixed; z-index: 6;
    top: max(20px, calc(env(safe-area-inset-top) + 10px));
    left: max(22px, calc(env(safe-area-inset-left) + 10px));
    /* name_wide: wide and low, so the release name reads on one line */
    height: 44px; max-width: calc(100vw - 192px); border-radius: 12px;
    overflow: hidden; text-overflow: ellipsis;
    background: var(--lab_bg, #1d4ed8); color: var(--lab_fg, #ffffff);
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 18px; font-size: 15px; font-weight: 700; line-height: 1;
    letter-spacing: 0.01em; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    pointer-events: none;
  }
  .hint {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    font-size: 14px; font-weight: 600; color: #1d1d1f;
    background: rgba(255,255,255,0.86); border-radius: 999px; padding: 7px 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    pointer-events: none; transition: opacity 0.4s;
  }
  /* thumb_reach: Set zero gets pressed constantly, so it sits low on the right,
     just above the recorder bar, where a right thumb lands without a stretch. */
  .motion_btn {
    position: fixed; z-index: 8;
    bottom: max(236px, calc(env(safe-area-inset-bottom) + 226px));
    right: max(22px, calc(env(safe-area-inset-right) + 10px));
    background: rgba(29,29,31,0.86); color: #ffffff;
    border: none; border-radius: 999px; padding: 15px 22px;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    touch-action: manipulation;
  }
  .motion_btn:active { transform: scale(0.96); }
  .motion_btn.on { background: #3f6212; color: #ffffff; }
  /* lag_trace — four seconds of history, so what the hand did and what the
     screen did can be compared by eye instead of by adjective.
     grey = how hard the phone is accelerating, purple = where the world is. */
  .trace {
    position: fixed; z-index: 6; right: max(22px, calc(env(safe-area-inset-right) + 10px));
    top: max(182px, calc(env(safe-area-inset-top) + 170px));
    width: 130px; height: 48px; border-radius: 10px;
    background: rgba(255,255,255,0.86);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    pointer-events: none;
  }
  .pose {
    position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right) + 8px));
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    width: 148px; height: 148px; border-radius: 14px;
    background: rgba(255,255,255,0.86);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none;
  }

  /* gesture_lab — hold the button, do the move, let go. Everything the phone's
     sensors say during the hold is kept, tagged with the name you typed, so
     the two of us can look at real numbers instead of guessing. */
  .gest_bar {
    position: fixed; z-index: 7; left: 50%; transform: translateX(-50%);
    bottom: max(20px, calc(env(safe-area-inset-bottom) + 10px));
    width: min(340px, calc(100vw - 60px));
    background: rgba(255,255,255,0.92); border-radius: 18px; padding: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.28);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; gap: 8px;
    touch-action: manipulation;
  }
  #g_name {
    width: 100%; border: 1px solid rgba(0,0,0,0.14); border-radius: 10px;
    padding: 9px 11px; font: inherit; font-size: 15px; color: #1d1d1f;
    background: #ffffff; outline: none;
  }
  #g_name:focus { border-color: #1350c4; }
  .g_rec {
    width: 100%; border: none; border-radius: 12px; padding: 14px;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    background: #d7263d; color: #ffffff; touch-action: none;
    box-shadow: 0 3px 10px rgba(215,38,61,0.35);
  }
  .g_rec.recording { background: #1d1d1f; animation: g_pulse 1s ease-in-out infinite; }
  @keyframes g_pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
  /* take_clear: the bar says which of the four states it is in, in colour and
     in words — idle, recording, sending, sent-and-ready. */
  .g_status { font-size: 12px; color: rgba(0,0,0,0.55); text-align: center; min-height: 16px;
              display: flex; align-items: center; justify-content: center; gap: 6px; }
  .g_led { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,0.22); flex: 0 0 auto; }
  .gest_bar.is_rec  .g_led { background: #d7263d; animation: g_pulse 1s ease-in-out infinite; }
  .gest_bar.is_send .g_led { background: #e0a800; animation: g_pulse 0.7s ease-in-out infinite; }
  .gest_bar.is_sent .g_led { background: #16a34a; }
  .gest_bar.is_warn .g_led { background: #e0a800; }
  .gest_bar.is_rec  { box-shadow: 0 6px 20px rgba(215,38,61,0.45); }
  .gest_bar.is_sent { box-shadow: 0 6px 20px rgba(22,163,74,0.40); }
  .gest_bar.is_sent #g_msg { color: #16a34a; font-weight: 700; }
  .gest_bar.is_rec  #g_msg { color: #d7263d; font-weight: 700; }
  .g_recent { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 0; }
  .g_chip { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.55);
            background: rgba(0,0,0,0.06); border-radius: 999px; padding: 3px 8px; }
  .g_row { display: flex; align-items: center; gap: 8px; }
  .g_small {
    flex: 1 1 auto; border: none; border-radius: 9px; padding: 8px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: rgba(0,0,0,0.06); color: #1d1d1f; touch-action: manipulation;
  }
  .g_count { flex: 0 0 auto; font-size: 12px; color: rgba(0,0,0,0.45); min-width: 46px; text-align: right; }
</style>
</head>
<body>

<div class="frame_window" id="frame">
  <div class="grid" id="grid"></div>
  <div class="track" id="track">
    <div class="cell cell_1"></div>
    <div class="cell cell_2"></div>
    <div class="cell cell_3"></div>
  </div>
  <span class="pin"><span class="pin_dot"></span></span>
  <div class="frame_shadow"></div>
</div>

<div class="dots" id="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
<button class="back_btn" id="back_btn">&#8249; Admin</button>
<div class="build_tag" id="build_tag"></div>
<div class="hint" id="hint">swipe up / down</div>

<div class="gest_bar" id="gest_bar">
  <input id="g_name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
         placeholder="name the pair — raise / lower">
  <button id="g_rec" class="g_rec">Hold to record</button>
  <div class="g_status" id="g_status"><span class="g_led" id="g_led"></span><span id="g_msg">hold the button, do the gesture, let go</span></div>
  <div class="g_recent" id="g_recent"></div>
  <div class="g_row">
    <button id="g_copy" class="g_small">Copy last take</button>
    <button id="g_send" class="g_small">Send takes</button>
    <span class="g_count" id="g_count"></span>
  </div>
</div>
<button class="motion_btn" id="motion_btn">Set zero</button>
<svg class="pose" id="pose" viewBox="-70 -70 140 140" hidden aria-hidden="true">
  <!-- pose_arrow: the phone as an object on the grid. Faint axes are the zero
       frame you set; the plate is the phone at its current attitude; the three
       arrows are its own axes; the thick arrow is where it has travelled. -->
  <g id="pose_ref" stroke="rgba(0,0,0,0.18)" stroke-width="1" fill="none"></g>
  <g id="pose_shadow" fill="rgba(0,0,0,0.10)"></g>
  <polygon id="pose_plate" fill="rgba(14,116,144,0.20)" stroke="#0e7490" stroke-width="1.6" stroke-linejoin="round"></polygon>
  <line id="pose_top" stroke="#0e7490" stroke-width="2.6" stroke-linecap="round"></line>
  <g id="pose_axes" stroke-width="2" stroke-linecap="round" fill="none"></g>
  <line id="pose_move" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"></line>
  <circle id="pose_head" r="3" fill="#b91c1c"></circle>
  <text id="pose_lbl" x="0" y="62" text-anchor="middle" font-size="11" font-weight="700"
        font-family="-apple-system, sans-serif" fill="rgba(0,0,0,0.62)"></text>
</svg>
<canvas class="trace" id="trace" width="260" height="96" hidden></canvas>

<script>
  // lab_release — the corner square IS the version stamp: this release's commit
  // name in this release's colour. Both change on every ship.
  var LAB_RELEASE = { name: 'glide_stop', bg: '#7c2d12', fg: '#ffffff' };
  (function () {
    var r = document.documentElement.style;
    r.setProperty('--lab_bg', LAB_RELEASE.bg);
    r.setProperty('--lab_fg', LAB_RELEASE.fg);
    var tag = document.getElementById('build_tag');
    if (tag) tag.textContent = LAB_RELEASE.name;
  })();

  var N = 3;
  var idx = 0;                 // which cell is showing
  var track = document.getElementById('track');
  var frame = document.getElementById('frame');
  var dots  = document.getElementById('dots');
  var hint  = document.getElementById('hint');

  function cell_h() { return frame.clientHeight || window.innerHeight; }
  function paint(px) {
    track.style.transform = 'translate3d(0,' + px + 'px,0)';
  }
  function go(i, animate) {
    idx = Math.max(0, Math.min(N - 1, i));
    track.classList.toggle('dragging', !animate);
    paint(-idx * cell_h());
    Array.prototype.forEach.call(dots.children, function (d, k) {
      d.classList.toggle('on', k === idx);
    });
    if (idx > 0 && hint) { hint.style.opacity = '0'; }
  }
  go(0, false);
  requestAnimationFrame(function () { track.classList.remove('dragging'); });
  window.addEventListener('resize', function () { go(idx, false); requestAnimationFrame(function () { track.classList.remove('dragging'); }); });

  // ---- drag: the cells follow the finger, then snap to the nearest page ----
  // close_light's lesson: a short push is enough — 40px, or 8% of the cell.
  function snap_px() { return Math.min(40, cell_h() * 0.08); }
  var drag = null;
  function start(y) { drag = { y0: y, base: -idx * cell_h(), active: false }; }
  function move(y) {
    if (!drag) return false;
    var dy = y - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) < 5) return false;
      drag.active = true;
      track.classList.add('dragging');
    }
    var px = drag.base + dy;
    // rubber-band at the two ends
    var min = -(N - 1) * cell_h(), max = 0;
    if (px > max) px = max + (px - max) * 0.35;
    if (px < min) px = min + (px - min) * 0.35;
    paint(px);
    return true;
  }
  function end() {
    if (!drag) return;
    var wasActive = drag.active;
    var moved = (parseFloat(track.style.transform.replace(/.*,\s*(-?[\d.]+)px,.*/, '$1')) || 0) - drag.base;
    drag = null;
    track.classList.remove('dragging');
    if (!wasActive) { go(idx, true); return; }
    if (moved <= -snap_px()) go(idx + 1, true);        // pushed up -> next page
    else if (moved >= snap_px()) go(idx - 1, true);    // pulled down -> previous
    else go(idx, true);
  }

  window.addEventListener('touchstart', function (e) {
    if (e.target.closest && e.target.closest('.back_btn, .motion_btn, .gest_bar')) return;
    if (e.touches.length === 1) start(e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (move(e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', end, { passive: true });

  // mouse + keyboard, so the same thing works on a laptop
  var mouseDown = false;
  window.addEventListener('mousedown', function (e) {
    if (e.target.closest && e.target.closest('.back_btn, .motion_btn, .gest_bar')) return;
    mouseDown = true; start(e.clientY);
  });
  window.addEventListener('mousemove', function (e) { if (mouseDown) move(e.clientY); });
  window.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; end(); } });
  var wheelLock = 0;
  window.addEventListener('wheel', function (e) {
    var now = Date.now();
    if (now - wheelLock < 420) return;
    if (Math.abs(e.deltaY) < 8) return;
    wheelLock = now;
    go(idx + (e.deltaY > 0 ? 1 : -1), true);
  }, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(idx + 1, true); }
    if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); go(idx - 1, true); }
  });

  document.getElementById('back_btn').addEventListener('click', function () {
    window.location.href = 'admin.html';
  });

  // ---- world_view: the screen is a window onto a world that does not move ----
  //
  // His model, followed literally:
  //   · a zero pose is captured when he says so (phone flat, or comfortably
  //     angled at his face). Everything is measured in THAT frame.
  //   · turning the phone right/left, or tipping its top toward/away, must not
  //     move the world at all. Rotation is not a translation.
  //   · sliding the phone one screen width to the right slides the world one
  //     screen width to the left — 1:1 at the reference distance.
  //   · moving the phone toward the eye raises the multiple (one screen width
  //     of hand movement can sweep three screen widths of world) and draws the
  //     world larger; moving it away drops the multiple below one and draws the
  //     world smaller. multiple = D0 / D, the plain magnifier law.
  //
  // How rotation gets ignored properly: the accelerometer reports in the
  // PHONE's axes, so a tilted phone would smear a sideways slide across two
  // axes. Each sample is rotated out of the phone frame into the world by the
  // current orientation, then into the zero frame — after which only the three
  // translations remain, and any amount of turning leaves them untouched.
  //
  // The honest caveat, unchanged: position comes from integrating acceleration
  // twice, which drifts. Two things keep it usable — a zero-velocity update
  // (when the phone reads still for 0.35s, velocity is forced to zero, the
  // standard dead-reckoning trick) and a slow leak (~2.5s) that eases the world
  // home rather than letting it wander off. Inside one gesture it holds.
  var PHONE_W    = 0.071;    // metres across a phone: the 1:1 yardstick
  var D0         = 0.35;     // metres: the reference viewing distance
  var D_MIN      = 0.10, D_MAX = 1.20;
  // depth_wide: plain D0/D only spans about 3x within arm's reach, and he wants
  // the far end dense and the near end down to a couple of lines on the whole
  // screen. Raising the ratio to a power stretches that range without needing
  // the phone to travel any further: (D0/D)^2.2 gives ~0.25x at arm's length
  // and ~13x when it is brought right in.
  var Z_POWER    = 2.2;
  var MULT_MIN   = 0.25, MULT_MAX = 13;
  var DEAD       = 0.12;     // m/s^2 ignored: the noise floor at rest (from his takes)
  // hold_still: a move ends where it ends. There is no position leak any more —
  // the world used to ease back to centre after every gesture, which read as
  // 'resets instead of holding'. Now the run is integrated while the phone is
  // actually moving, and the moment it reads still the velocity is killed and
  // the position simply STAYS. Drift cannot accumulate between moves because
  // nothing is being integrated between moves.
  // glide_stop — a slide has two halves: the hand pushes, then the hand brakes.
  // Integrating the brake honestly makes the world travel BACK, which is what he
  // saw in the second half of every slide. So a move latches its direction, and
  // from then on opposing acceleration is only allowed to slow it down, never to
  // carry it the other way. The moment braking is detected the glide-out starts —
  // about a second earlier than waiting for stillness — and it eases to rest
  // instead of stopping dead.
  var BRAKE_DECAY = 0.90;    // per sample once the hand starts braking (~0.16s)
  var LATCH_V     = 0.02;    // m/s: fast enough to call the direction of a move
  var STOP_V      = 0.015;   // m/s: slower than this counts as stopped
  var STILL_MS   = 120;      // quiet for this long -> the move is over
  var VEL_TAU    = 6.0;      // s: barely any leak — a leak makes the braking half
                             // of a move outweigh the pushing half, which dragged
                             // the world back the moment you stopped
  var MOVE_A     = 0.20;     // m/s^2: above this the phone counts as moving
  // lag_trace: position is the integral of the integral of acceleration, so it
  // always trails the hand. Showing pos + vel*LEAD cancels most of that — while
  // the phone travels at a steady rate the screen sits where the phone WILL be
  // a tenth of a second from now, and the moment it stops, vel is 0 and the lead
  // vanishes, so nothing overshoots at rest.
  var LEAD       = 0.10;     // s of prediction
  // lead_hold: the lead term used to unwind the instant the hand braked, which
  // dragged the picture back exactly where he said it reversed. Now the lead is
  // carried as state: it tracks vel while the move is building, FREEZES the
  // moment that axis starts braking, and is folded into pos when the move ends.
  // The picture therefore only ever eases forward to a stop.
  var ROT_OPEN   = 45;       // deg/s: below this the sample counts fully
  var ROT_SHUT   = 160;      // deg/s: above this it is thrown away (a spin, not a slide)

  var motionOn = false;
  var R0 = null;             // zero-pose rotation matrix (world <- phone), transposed use
  var Rnow = null;
  var vel = { x: 0, y: 0, z: 0 };
  var pos = { x: 0, y: 0, z: 0 };   // metres in the zero frame: x right, y up, z toward the eye
  var quietFor = 0;          // seconds of quiet, in sample time
  var rotVeto = 1;
  var lastAccel = 0, movedSign = 1;
  var moving = false;               // is the phone in a move right now?
  var dir  = { x: 0, y: 0, z: 0 };  // the latched direction of the move in progress
  var lead = { x: 0, y: 0, z: 0 };  // metres of lag compensation currently shown
  // settle_lock: stopping a slide is itself a shove the other way. Once a move
  // has been braked to rest, the tail of that same stopping push must not be
  // read as a fresh move backwards — that was the reversal in the second half
  // of every slide. So after a move ends the model stays disarmed until the
  // phone has actually been quiet for STILL_MS.
  var rearm = false;
  function end_move() {
    // bake the frozen lead into the resting position so the world stays put
    // where it was last drawn instead of springing back
    ['x', 'y', 'z'].forEach(function (k) {
      pos[k] += lead[k];
      if (!dir[k] || lead[k] * dir[k] > 0) run[k] += lead[k];
      lead[k] = 0;
    });
    vel.x = vel.y = vel.z = 0;
    moving = false;
    rearm = true;
    dir = { x: 0, y: 0, z: 0 };
    lastMove = name_move(run);
    run = { x: 0, y: 0, z: 0 };
  }
  var run = { x: 0, y: 0, z: 0 };   // distance carried by the move in progress
  var lastMove = '';                // what the last finished move was
  // name_move — categorise a finished move by whichever axis carried it
  function name_move(r) {
    var ax = Math.abs(r.x), ay = Math.abs(r.y), az2 = Math.abs(r.z);
    var big = Math.max(ax, ay, az2);
    if (big < 0.01) return '';       // under a centimetre: not a move
    var cm = Math.round(big * 100);
    if (big === ax) return (r.x > 0 ? 'right ' : 'left ') + cm + ' cm';
    if (big === ay) return (r.y > 0 ? 'up ' : 'down ') + cm + ' cm';
    return (r.z > 0 ? 'closer ' : 'away ') + cm + ' cm';
  }
  var motionBtn = document.getElementById('motion_btn');
  var poseEl    = document.getElementById('pose');
  // pose_arrow — the phone drawn as an object sitting on the zero frame.
  // Isometric projection: a 3D point becomes (x - z)*0.87 across and
  // -(y + (x + z)*0.5) down, which is enough to read pitch, yaw and roll at a
  // glance without any of the numbers he is tired of.
  function iso(v) {
    // axis_face — the camera looks straight down the zero pose's normal, so at
    // zero the phone is a plain rectangle parallel with the glass. Depth (the
    // zero frame's z, toward the viewer) is drawn as a small up-and-right
    // offset, which is enough to read a tip without skewing the flat state.
    return { x: v.x + v.z * 0.34, y: -v.y - v.z * 0.22 };
  }
  function pt(v, s) { var p = iso({ x: v.x * s, y: v.y * s, z: v.z * s }); return p.x.toFixed(1) + ',' + p.y.toFixed(1); }
  function rel_matrix() {
    if (!R0 || !Rnow) return null;
    // transpose(R0) * Rnow — the phone's attitude measured from the zero pose
    var m = new Array(9);
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
      var s = 0;
      for (var k = 0; k < 3; k++) s += R0[k * 3 + r] * Rnow[k * 3 + c];
      m[r * 3 + c] = s;
    }
    return m;
  }
  function set_line(el, a, b) {
    el.setAttribute('x1', a.x.toFixed(1)); el.setAttribute('y1', a.y.toFixed(1));
    el.setAttribute('x2', b.x.toFixed(1)); el.setAttribute('y2', b.y.toFixed(1));
  }
  var poseInit = false;
  // yaw_flip — spinning the phone flat on a table drew the wrong way round for
  // him, so the drawing's yaw is negated. Attitude is decomposed, yaw flipped,
  // and the matrix rebuilt — the plate, the axes and the label all follow.
  function flip_yaw(m) {
    var deg = 180 / Math.PI;
    var pitch = Math.asin(Math.max(-1, Math.min(1, m[7]))) * deg;
    var yaw   = Math.atan2(-m[1], m[4]) * deg;
    var roll  = Math.atan2(-m[6], m[8]) * deg;
    return { m: mat_from(-yaw, pitch, roll), pitch: pitch, yaw: -yaw, roll: roll };
  }
  function draw_pose(mult) {
    if (!poseEl || poseEl.hidden) return;
    var m0 = rel_matrix(); if (!m0) return;
    var flipped = flip_yaw(m0);
    var m = flipped.m;
    var ref = document.getElementById('pose_ref');
    if (!poseInit) {   // the zero frame, drawn once
      poseInit = true;
      // the zero pose itself, faint: the rectangle the phone was in when you
      // pressed Set zero, so the difference between it and the plate IS the tilt
      // the zero pose, faint: the rectangle the phone filled when you pressed
      // Set zero. The bold axes below never move, so the plate's departure from
      // this outline is the whole story.
      ref.innerHTML = '<rect x="-15" y="-28" width="30" height="56" rx="3" ' +
                      'stroke-dasharray="3 3" fill="none"/>';
    }
    // fixed_axes — the axes are the WORLD's and never move: X right, Y up,
    // Z toward you. The phone plate turns inside them. (It was the other way
    // round, which made the frame of reference itself appear to swing.)
    var ax = { x: 1, y: 0, z: 0 };
    var ay = { x: 0, y: 1, z: 0 };
    var az = { x: 0, y: 0, z: 1 };
    // the phone's own directions, used for the plate only
    var px_ = { x: m[0], y: m[3], z: m[6] };
    var py_ = { x: m[1], y: m[4], z: m[7] };
    // axis_face: fat arrows with heads and letters, so an axis can be pointed at
    var axes = document.getElementById('pose_axes');
    function arrow(v, colour, letter) {
      var e = iso({ x: v.x * 44, y: v.y * 44, z: v.z * 44 });
      var n = Math.hypot(e.x, e.y) || 1;
      var ux = e.x / n, uy = e.y / n;
      var hx = e.x - ux * 7, hy = e.y - uy * 7;
      var lx = e.x + ux * 9, ly = e.y + uy * 9;
      return '<line x1="0" y1="0" x2="' + hx.toFixed(1) + '" y2="' + hy.toFixed(1) + '" stroke="' + colour + '" stroke-width="3.4"/>' +
             '<polygon points="' + e.x.toFixed(1) + ',' + e.y.toFixed(1) + ' ' +
               (hx - uy * 4).toFixed(1) + ',' + (hy + ux * 4).toFixed(1) + ' ' +
               (hx + uy * 4).toFixed(1) + ',' + (hy - ux * 4).toFixed(1) + '" fill="' + colour + '" stroke="none"/>' +
             '<text x="' + lx.toFixed(1) + '" y="' + (ly + 3.5).toFixed(1) + '" fill="' + colour +
               '" font-size="11" font-weight="800" text-anchor="middle" stroke="none"' +
               ' font-family="-apple-system, sans-serif">' + letter + '</text>';
    }
    axes.innerHTML = arrow(ax, '#dc2626', 'X') + arrow(ay, '#16a34a', 'Y') + arrow(az, '#2563eb', 'Z');
    // the phone plate: a rectangle in its own x/y plane
    function corner(sx2, sy2) {
      return { x: px_.x * sx2 + py_.x * sy2, y: px_.y * sx2 + py_.y * sy2, z: px_.z * sx2 + py_.z * sy2 };
    }
    var w2 = 15, h2 = 28;
    var cs = [corner(-w2, h2), corner(w2, h2), corner(w2, -h2), corner(-w2, -h2)];
    document.getElementById('pose_plate').setAttribute('points',
      cs.map(function (c) { return pt(c, 1); }).join(' '));
    document.getElementById('pose_shadow').innerHTML =
      '<polygon points="' + cs.map(function (c) { return pt({ x: c.x, y: 0, z: c.z }, 1); }).join(' ') + '"/>';
    set_line(document.getElementById('pose_top'), iso(corner(-w2, h2)), iso(corner(w2, h2)));
    // where it has travelled, in the zero frame: 1 cm of hand = 3 units here
    var mv = { x: pos.x * 300, y: pos.y * 300, z: pos.z * 300 };
    var mvp = iso(mv);
    var lim = 52, mag = Math.hypot(mvp.x, mvp.y);
    if (mag > lim) { mvp.x *= lim / mag; mvp.y *= lim / mag; }
    set_line(document.getElementById('pose_move'), { x: 0, y: 0 }, mvp);
    var head = document.getElementById('pose_head');
    head.setAttribute('cx', mvp.x.toFixed(1)); head.setAttribute('cy', mvp.y.toFixed(1));
    head.setAttribute('opacity', mag > 2 ? '1' : '0');
    // pitch / yaw / roll, straight out of the same matrix
    document.getElementById('pose_lbl').textContent =
      'P' + flipped.pitch.toFixed(0) + '  Y' + flipped.yaw.toFixed(0) +
      '  R' + flipped.roll.toFixed(0) + '   \u00d7' + mult.toFixed(1);
  }

  // orientation -> rotation matrix (ZXY intrinsic, the W3C convention)
  function mat_from(alpha, beta, gamma) {
    var d = Math.PI / 180;
    var a = (alpha || 0) * d, b = (beta || 0) * d, g = (gamma || 0) * d;
    var cA = Math.cos(a), sA = Math.sin(a);
    var cB = Math.cos(b), sB = Math.sin(b);
    var cG = Math.cos(g), sG = Math.sin(g);
    return [
      cA * cG - sA * sB * sG, -cB * sA,  cA * sG + cG * sA * sB,
      cG * sA + cA * sB * sG,  cA * cB,  sA * sG - cA * cG * sB,
                   -cB * sG,       sB,               cB * cG
    ];
  }
  function mul_vec(m, v) {
    return { x: m[0]*v.x + m[1]*v.y + m[2]*v.z,
             y: m[3]*v.x + m[4]*v.y + m[5]*v.z,
             z: m[6]*v.x + m[7]*v.y + m[8]*v.z };
  }
  function mul_t_vec(m, v) {   // transpose(m) * v
    return { x: m[0]*v.x + m[3]*v.y + m[6]*v.z,
             y: m[1]*v.x + m[4]*v.y + m[7]*v.z,
             z: m[2]*v.x + m[5]*v.y + m[8]*v.z };
  }

  function on_orientation(e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    Rnow = mat_from(e.alpha, e.beta, e.gamma);
    if (!R0) R0 = Rnow;
  }
  function on_motion(e) {
    var a = e.acceleration;
    if (!a || (a.x == null && a.y == null && a.z == null)) return;   // needs the gravity-free stream
    if (!motionOn || !Rnow || !R0) return;
    var rr = e.rotationRate || {};
    var rot = Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0);
    rotVeto = Math.max(0, Math.min(1, 1 - (rot - ROT_OPEN) / (ROT_SHUT - ROT_OPEN)));
    var iv = e.interval || 0.0166;
    var dt = iv < 1 ? iv : iv / 1000;

    // phone axes -> world -> zero frame: rotation falls out here
    var aw = mul_vec(Rnow, { x: a.x || 0, y: a.y || 0, z: a.z || 0 });
    var az = mul_t_vec(R0, aw);
    var mag = Math.hypot(az.x, az.y, az.z);
    lastAccel = mag;
    movedSign = (Math.abs(az.x) >= Math.abs(az.y) ? (az.x >= 0 ? 1 : -1) : (az.y >= 0 ? 1 : -1));
    // quiet time is counted in SAMPLE time, not wall-clock: if the phone throttles
    // its sensor the two drift apart, and only sample time reflects what was measured
    if (mag < MOVE_A && rot < 20) {
      quietFor += dt;
      if (moving && quietFor > STILL_MS / 1000) end_move();
      if (quietFor > STILL_MS / 1000) rearm = false;   // genuinely still: arm again
    } else {
      quietFor = 0;
      if (!moving && !rearm) { moving = true; run = { x: 0, y: 0, z: 0 }; dir = { x: 0, y: 0, z: 0 }; }
    }

    var kv = Math.exp(-dt / VEL_TAU);
    if (moving) {
      var slowing = false;
      ['x', 'y', 'z'].forEach(function (k) {
        var a = az[k];
        a = Math.abs(a) < DEAD ? 0 : (a - (a > 0 ? DEAD : -DEAD));
        a *= rotVeto;
        // latch which way this move is going, once it is going anywhere
        if (!dir[k] && Math.abs(vel[k]) > LATCH_V) {
          dir[k] = vel[k] > 0 ? 1 : -1;
          // run_true: anything the settling wobble put on the tally before the
          // direction was known is not part of the move, so a slide right can
          // never be reported as a move left
          if (run[k] * dir[k] < 0) run[k] = 0;
        }
        var braking = !!(dir[k] && a * dir[k] < 0);
        if (braking) {
          // the hand is braking: bleed speed off, never push the other way
          slowing = true;
          vel[k] = (vel[k] + a * dt) * BRAKE_DECAY;
          if (vel[k] * dir[k] < 0) vel[k] = 0;      // stop at zero, do not reverse
        } else {
          vel[k] = (vel[k] + a * dt) * kv;
        }
        // creep_floor: the stop threshold may only kill a move that is ending.
        // Applied unconditionally it also killed every move that was starting —
        // a gentle push never got its first sample above STOP_V, so slow moves
        // (and the whole closer/away axis) registered nothing at all.
        if ((braking || !a) && Math.abs(vel[k]) < STOP_V) vel[k] = 0;
        // lead grows with the push and holds through the brake
        var want = vel[k] * LEAD;
        if (!braking || Math.abs(want) > Math.abs(lead[k])) lead[k] = want;
        var d = vel[k] * dt;
        pos[k] += d;               // no leak: where it lands is where it stays
        if (!dir[k] || d * dir[k] > 0) run[k] += d;   // only forward travel counts
      });
      // everything has come to rest: end the move now rather than waiting out
      // the quiet timer — this is the 'jump the gun' he asked for
      if (!vel.x && !vel.y && !vel.z && (slowing || quietFor > 0.05)) end_move();
    }
  }

  // trace_ring — a rolling four seconds of (hand effort, world offset)
  var TRACE_N = 240;
  var trace = new Array(TRACE_N);
  var traceAt = 0;
  var traceEl = document.getElementById('trace');
  var traceCtx = traceEl ? traceEl.getContext('2d') : null;
  function trace_push(effort, offset) {
    trace[traceAt] = [effort, offset];
    traceAt = (traceAt + 1) % TRACE_N;
  }
  function trace_draw() {
    if (!traceCtx) return;
    var W = traceEl.width, H = traceEl.height;
    traceCtx.clearRect(0, 0, W, H);
    var maxE = 0.5, maxO = 40;
    for (var i = 0; i < TRACE_N; i++) {
      var s = trace[(traceAt + i) % TRACE_N];
      if (!s) continue;
      if (Math.abs(s[0]) > maxE) maxE = Math.abs(s[0]);
      if (Math.abs(s[1]) > maxO) maxO = Math.abs(s[1]);
    }
    function line(idx, colour, scale, width) {
      traceCtx.beginPath();
      traceCtx.lineWidth = width; traceCtx.strokeStyle = colour;
      var started = false;
      for (var i = 0; i < TRACE_N; i++) {
        var s = trace[(traceAt + i) % TRACE_N];
        if (!s) continue;
        var x = (i / (TRACE_N - 1)) * W;
        var y = H / 2 - (s[idx] / scale) * (H / 2 - 3);
        if (!started) { traceCtx.moveTo(x, y); started = true; } else traceCtx.lineTo(x, y);
      }
      traceCtx.stroke();
    }
    traceCtx.strokeStyle = 'rgba(0,0,0,0.12)'; traceCtx.lineWidth = 1;
    traceCtx.beginPath(); traceCtx.moveTo(0, H / 2); traceCtx.lineTo(W, H / 2); traceCtx.stroke();
    line(0, 'rgba(0,0,0,0.35)', maxE, 2);          // the hand
    line(1, '#6b21a8', maxO, 3);                   // the world
  }

  // view — the ONE place that turns where the phone is into what the screen
  // shows. Grid, dot, diagram and tests all read this; nothing recomputes it.
  //   cam   where the phone has travelled in the zero frame, metres
  //         (+x right, +y up, +z toward the eye), lead term folded in
  //   dist  how far the eye is from the surface
  //   mult  the magnifier: how much world one phone-width of hand sweeps
  //   ox/oy pixels the world is offset on screen (flip_axes: it travels WITH
  //         the phone)
  function view() {
    var w = frame.clientWidth || 320;
    var cam = { x: pos.x + lead.x, y: pos.y + lead.y, z: pos.z + lead.z };
    var dist = Math.max(D_MIN, Math.min(D_MAX, D0 - cam.z));
    var mult = Math.max(MULT_MIN, Math.min(MULT_MAX, Math.pow(D0 / dist, Z_POWER)));
    var pxPerM = (w / PHONE_W) * mult;
    var lim = w * 3;
    return {
      w: w, cam: cam, dist: dist, mult: mult, pxPerM: pxPerM,
      ox: Math.max(-lim, Math.min(lim,  cam.x * pxPerM)),
      oy: Math.max(-lim, Math.min(lim, -cam.y * pxPerM))
    };
  }

  function paint_world() {
    if (!motionOn) return;
    var v = view();
    var w = v.w, dist = v.dist, mult = v.mult;
    var sx = v.ox, sy = v.oy;
    trace_push(lastAccel * (movedSign || 1), sx / (w / 4));
    trace_draw();
    var root = document.documentElement.style;
    root.setProperty('--sx', sx.toFixed(1) + 'px');
    root.setProperty('--sy', sy.toFixed(1) + 'px');
    root.setProperty('--sc', mult.toFixed(3));
    draw_pose(mult);
    requestAnimationFrame(paint_world);
  }

  function zero_here() {
    R0 = Rnow;
    vel = { x: 0, y: 0, z: 0 };
    pos = { x: 0, y: 0, z: 0 };
    run = { x: 0, y: 0, z: 0 };
    lead = { x: 0, y: 0, z: 0 };
    moving = false; lastMove = ''; quietFor = 0; rearm = false; dir = { x: 0, y: 0, z: 0 };
    document.documentElement.style.setProperty('--sc', '1');
  }
  function start_world() {
    motionOn = true;
    R0 = null; Rnow = null;
    zero_here();
    window.addEventListener('deviceorientation', on_orientation);
    window.addEventListener('devicemotion', on_motion);
    motionBtn.classList.add('on');
    motionBtn.textContent = 'Set zero';
    if (poseEl) poseEl.hidden = false;
    if (traceEl) traceEl.hidden = false;
    if (hint) hint.style.opacity = '0';
    requestAnimationFrame(paint_world);
  }

  motionBtn.addEventListener('click', function () {
    if (motionOn) { zero_here(); return; }
    var needO = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
    var needM = (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function');
    if (!needO && !needM) {
      if (!window.DeviceOrientationEvent && !window.DeviceMotionEvent) { motionBtn.textContent = 'No sensors here'; return; }
      start_world(); return;
    }
    var asks = [];
    if (needO) asks.push(DeviceOrientationEvent.requestPermission());
    if (needM) asks.push(DeviceMotionEvent.requestPermission());
    Promise.all(asks).then(function (res) {
      if (res.every(function (r) { return r === 'granted'; })) start_world();
      else motionBtn.textContent = 'Motion blocked';
    }).catch(function () { motionBtn.textContent = 'Motion blocked'; });
  });


  // ---- gesture_lab: hold to record every sensor the phone will give ----
  // A take is { name, ts, ms, samples: [...] }. Each sample carries whatever
  // arrived at that instant: orientation (alpha/beta/gamma), acceleration with
  // and without gravity, and rotation rate. Angles are also stored relative to
  // the pose at the START of the hold, since that is the frame he cares about.
  var GEST_KEY = 'vampjam_gestures';
  var SYNC_URL = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var REPO_RAW = 'https://raw.githubusercontent.com/mPulseMedia/vampjam/main/';
  var API_URL  = 'https://api.github.com/repos/mPulseMedia/vampjam/contents/lab_gestures.json?ref=main';

  var gName = document.getElementById('g_name');
  var gRec  = document.getElementById('g_rec');
  var gBar  = document.getElementById('gest_bar');
  var gMsg  = document.getElementById('g_msg');
  var gRecent = document.getElementById('g_recent');
  // take_clear: one place decides what the bar looks like and says
  var gStat = {
    set textContent(v) { say('idle', v); },
    get textContent() { return gMsg.textContent; }
  };
  function say(state, text) {
    gBar.classList.remove('is_rec', 'is_send', 'is_sent', 'is_warn');
    if (state !== 'idle') gBar.classList.add('is_' + state);
    gMsg.textContent = text;
  }
  function paint_recent() {
    var list = gest_get().slice(-4);
    gRecent.innerHTML = list.map(function (t2) {
      return '<span class="g_chip">' + String(t2.name || 'unnamed').replace(/[<>&]/g, '') +
             ' · ' + (t2.ms / 1000).toFixed(1) + 's</span>';
    }).join('');
  }
  var gCopy = document.getElementById('g_copy');
  var gSend = document.getElementById('g_send');
  var gCount= document.getElementById('g_count');

  var recording = false, take = null, gRef = null;
  var live = { ori: null, acc: null, accG: null, rot: null };

  function gest_get() {
    try { var a = JSON.parse(localStorage.getItem(GEST_KEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function gest_put(list) {
    try { localStorage.setItem(GEST_KEY, JSON.stringify(list.slice(-40))); } catch (e) {}
    if (gCount) gCount.textContent = list.length + ' take' + (list.length === 1 ? '' : 's');
    if (typeof paint_recent === 'function') paint_recent();
  }
  gest_put(gest_get());

  function grab_orientation(e) {
    // browsers fire one empty event when you subscribe — it must not become
    // the reference pose, or every angle afterwards is measured from zero
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    live.ori = [r3(e.alpha), r3(e.beta), r3(e.gamma)];
    if (recording && !gRef) gRef = { a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0 };
  }
  function grab_motion(e) {
    var a = e.acceleration || {}, ag = e.accelerationIncludingGravity || {}, rr = e.rotationRate || {};
    if (a.x == null && ag.x == null && rr.alpha == null) return;   // empty priming event
    live.acc  = [r3(a.x), r3(a.y), r3(a.z)];
    live.accG = [r3(ag.x), r3(ag.y), r3(ag.z)];
    live.rot  = [r3(rr.alpha), r3(rr.beta), r3(rr.gamma)];
    if (recording) push_sample(e.interval || null);
  }
  // (an integrator from an earlier model used to live here and still ran on
  //  every sample — it referenced a constant that no longer exists, threw
  //  inside the sensor handler, and silently emptied four of his takes.)
  function r3(v) { return (v == null) ? null : Math.round(v * 1000) / 1000; }
  function push_sample(interval) {
    if (!take) return;
    var t = Date.now() - take.ts;
    var o = live.ori || [null, null, null];
    var rel = gRef && live.ori
      ? [r3(ang(o[0] - gRef.a)), r3(o[1] - gRef.b), r3(o[2] - gRef.g)]
      : [null, null, null];
    take.samples.push({ t: t, ori: o, rel: rel, acc: live.acc, accG: live.accG, rot: live.rot, iv: interval,
                        // lag_trace: what the page DID with that sample, so a take
                        // can be measured end to end instead of guessed at
                        st: [r3(pos.x), r3(pos.y), r3(pos.z),
                             r3(vel.x), r3(vel.y), r3(vel.z),
                             moving ? 1 : 0] });
  }
  function ang(d) { while (d > 180) d -= 360; while (d < -180) d += 360; return d; }

  var sensorsWired = false;
  function sensors_live(after) {
    // once wired, stay wired: asking again would make every later hold start
    // one tick late (and a very short tap could then start after it ended)
    if (sensorsWired) { after(true); return; }
    var needO = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
    var needM = (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function');
    function wire() {
      sensorsWired = true;
      window.addEventListener('deviceorientation', grab_orientation);
      window.addEventListener('devicemotion', grab_motion);
      after(true);
    }
    if (!needO && !needM) { wire(); return; }
    var asks = [];
    if (needO) asks.push(DeviceOrientationEvent.requestPermission());
    if (needM) asks.push(DeviceMotionEvent.requestPermission());
    Promise.all(asks).then(function (res) {
      if (res.every(function (r) { return r === 'granted'; })) wire();
      else after(false);
    }).catch(function () { after(false); });
  }

  var wantRec = false;
  function rec_start() {
    if (recording) return;
    wantRec = true;
    say('rec', 'starting…');
    sensors_live(function (ok) {
      if (!ok) { wantRec = false; say('warn', 'motion permission was refused'); return; }
      if (!wantRec) return;         // released before permission came back
      recording = true; gRef = null;
      take = { name: (gName.value || 'unnamed').trim(), ts: Date.now(), ms: 0, samples: [] };
      gRec.classList.add('recording');
      gRec.textContent = 'recording  0.0s';
      say('rec', 'recording "' + take.name + '" — do the move, then let go');
      clearInterval(recTimer);
      recTimer = setInterval(function () {
        if (!recording || !take) return;
        gRec.textContent = 'recording  ' + ((Date.now() - take.ts) / 1000).toFixed(1) + 's';
      }, 100);
    });
  }
  function rec_stop() {
    wantRec = false;
    if (!recording) return;
    recording = false;
    clearInterval(recTimer);
    gRec.classList.remove('recording');
    gRec.textContent = 'Hold to record';
    if (!take) return;
    take.ms = Date.now() - take.ts;
    var done = take;
    var list = gest_get();
    list.push(done);
    gest_put(list);
    take = null;
    if (!done.samples.length) {
      say('warn', 'nothing came from the sensors — check motion permission');
      return;
    }
    say('send', 'saving "' + done.name + '" · ' + done.samples.length + ' samples · ' +
                (done.ms / 1000).toFixed(1) + 's …');
    // take_clear: clear the field and raise the keyboard NOW, while we are
    // still inside the touch that released the button — iOS only opens the
    // keyboard from inside a gesture. The send finishes in the background.
    gName.value = '';
    try { gName.focus({ preventScroll: true }); } catch (e) { gName.focus(); }
    send_takes(true, done);
  }

  // hold semantics on touch AND mouse; pointer events would double-fire on iOS
  gRec.addEventListener('touchstart', function (e) { e.preventDefault(); rec_start(); }, { passive: false });
  gRec.addEventListener('touchend',   function (e) { e.preventDefault(); rec_stop(); },  { passive: false });
  gRec.addEventListener('touchcancel', rec_stop);
  gRec.addEventListener('mousedown', function (e) { e.preventDefault(); rec_start(); });
  window.addEventListener('mouseup', function () { if (recording) rec_stop(); });

  gCopy.addEventListener('click', function () {
    var list = gest_get();
    if (!list.length) { gStat.textContent = 'nothing recorded yet'; return; }
    var txt = JSON.stringify(list[list.length - 1]);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { gStat.textContent = 'last take copied'; },
                                              function () { gStat.textContent = 'copy failed'; });
    } else { gStat.textContent = 'copy not available here'; }
  });

  // send_takes — park them in the repo (lab_gestures.json) so they can be read
  // from the other side without any copy and paste
  var sending = false;
  var recTimer = 0;
  function send_takes(quiet, done) {
    var list = gest_get();
    if (!list.length || sending) return;
    sending = true;
    say('send', done ? ('sending "' + done.name + '" …') : 'sending…');
    fetch(API_URL + '&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (have) {
        if (!Array.isArray(have)) have = [];
        var seen = {};
        have.forEach(function (t) { if (t && t.ts) seen[t.ts] = true; });
        var add = list.filter(function (t) { return !seen[t.ts]; });
        if (!add.length) { sending = false; say('sent', 'already sent — name the next one'); return; }
        var out = have.concat(add).slice(-60);
        return fetch(SYNC_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: 'lab_gestures.json', content: JSON.stringify(out, null, 1),
                                 message: 'gesture ' + (add[add.length - 1].name || 'take') })
        }).then(function (r) {
          sending = false;
          if (r.ok) say('sent', '✓ sent ' + add.length + ' take' + (add.length === 1 ? '' : 's') +
                                ' — type the next name');
          else say('warn', 'send failed — kept on this phone, goes with the next one');
        });
      })
      .catch(function () { sending = false; say('warn', 'send failed — kept on this phone, goes with the next one'); });
  }
  gSend.addEventListener('click', function () { send_takes(false); });
  paint_recent();

  // test hook
  window.__lab = {
    go: go,
    at: function () { return idx; },
    steady: function () { start_world(); },
    zero: function () { zero_here(); },
    rec: function (on) { on ? rec_start() : rec_stop(); },
    // pose the phone (degrees) — rotation alone must not move the world
    pose: function (alpha, beta, gamma) { on_orientation({ alpha: alpha, beta: beta, gamma: gamma }); },
    // n samples of acceleration in the PHONE's own axes, as the phone sends them
    shove: function (ax, ay, az, rot, n) {
      for (var i = 0; i < (n || 30); i++) {
        on_motion({ acceleration: { x: ax, y: ay, z: az },
                    rotationRate: { alpha: rot || 0, beta: 0, gamma: 0 },
                    interval: 0.0166 });
      }
      return { pos: { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), z: +pos.z.toFixed(4) }, veto: +rotVeto.toFixed(2) };
    },
    // what the maths is thinking right now, without waiting for a paint frame
    state: function () {
      var v = view();
      return { px: v.ox, py: v.oy, mult: v.mult, dist: v.dist,
               moving: moving, held: lastMove,
               pos: { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), z: +pos.z.toFixed(4) } };
    },
    world: function () {
      var st = getComputedStyle(document.documentElement);
      return { sx: st.getPropertyValue('--sx').trim(), sy: st.getPropertyValue('--sy').trim(),
               sc: st.getPropertyValue('--sc').trim(),
               read: (document.getElementById('pose_lbl').textContent || '') };
    },
    takes: function () { return gest_get(); }
  };
</script>
</body>
</html>
