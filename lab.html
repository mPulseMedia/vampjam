<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>vampsf — lab</title>
<style>
  /* lab_frame — a sketch of the feeling the session list gave us: a fixed
     white frame with a rounded window cut in it, and a stack of full-screen
     cells that slides behind the window. The frame never moves; the cells do,
     and the frame's edge casts a shadow down onto whichever cell is showing.
     Cells: 1 red (top) · 2 white (middle) · 3 blue (bottom). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #ffffff; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation; color-scheme: light;
  }

  /* the white frame is simply the page; the window is what is cut out of it */
  .frame_window {
    background: #fcfcf8;
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    bottom: max(14px, env(safe-area-inset-bottom));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    border-radius: 22px;
    overflow: hidden;
    background: #fcfcf8;
  }
  /* tilt_deep — the perspective lives on its OWN layer, not on the window.
     WebKit flattens 3D children of an element that both clips and rounds its
     corners, which is why the lean barely showed on the phone while it looked
     right in a desktop screenshot. The stage clips nothing and rounds nothing;
     the window still does both, around it. The camera is close (460px against a
     ~360px window), so a modest tilt of the hand lays the paper right down. */
  .stage {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    perspective: 460px; perspective-origin: 50% 50%;
    transform-style: preserve-3d;
  }
  /* frame_shadow — the white frame casting onto the cell below it: strongest
     from the top edge, present on all four. It rides ABOVE the cells. */
  .frame_shadow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
    box-shadow:
      inset 0 14px 18px -10px rgba(0,0,0,0.45),
      inset 0 -10px 16px -10px rgba(0,0,0,0.30),
      inset 12px 0 16px -12px rgba(0,0,0,0.30),
      inset -12px 0 16px -12px rgba(0,0,0,0.30);
  }

  .track {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    will-change: transform;
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .track.dragging { transition: none; }

  .cell {
    flex: 0 0 100%; height: 100%; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 74px; font-weight: 700; letter-spacing: 0.02em;
    user-select: none; -webkit-user-select: none;
  }
  /* dot_steady — the dot sits dead centre of every card. When the phone's
     motion sensors are running it is pushed the OTHER way from every wobble,
     so it holds still in the room while the screen jiggles around it. */
  /* graph_one — ONE surface for the whole window: graph paper, drawn once,
     behind everything. It pans and scales with the phone; nothing else carries
     lines, so there are no layers to see through. Sized 800% so even at the
     small end of the scale, panned to its limit, no edge comes into view. */
  .grid {
    /* haze_cheap — the fade used to be a mask ON THIS ELEMENT, and that was the
       crash: a mask forces the browser to allocate an offscreen buffer the size
       of the masked element, and this element is a thousand percent of the
       viewport with a 3D transform and a scale of up to 39 on top. The fade now
       lives on .haze, one viewport big, sitting over the paper. The paper itself
       is a plain painted element again — no mask, no buffer — and smaller. */
    /* paper_paint — the paper no longer MOVES or SCALES; only its pattern does.
       Panning is background-position and zooming is background-size, both of
       which are a repaint of one fixed element. The transform is left carrying
       nothing but the three rotations, so it changes only when the phone turns.
       Before this the element was a thousand-plus percent of the viewport being
       re-rasterised on every frame at every scale, which is what took the
       browser down. 400% is what the 45-degree lean needs to cover; nothing
       about the size has to grow with the zoom any more. */
    position: absolute; left: -150%; top: -150%; width: 400%; height: 400%;
    pointer-events: none; z-index: 0; transform-origin: 50% 50%;
    /* roll_hold: the rotation comes FIRST, so the offset that follows is measured
       along the world's own axes rather than the screen's. Swirl the phone in
       front of your face and the paper turns the other way by the same amount,
       which is what makes it look like the paper never moved. */
    /* the swirl first, then the two leans, which tip about the phone's own axes,
       then the pan and the zoom — so the pan runs along the paper's surface
       rather than across the glass. (Panning and zooming through
       background-position / background-size instead was tried and is four times
       SLOWER: a background change repaints the whole element, where a transform
       change only recomposites it.) */
    transform: rotate(var(--rot, 0deg)) rotateX(var(--tilt, 0deg)) rotateY(var(--turn, 0deg))
               translate3d(var(--sx, 0px), var(--sy, 0px), 0) scale(var(--sc, 1));
    background-color: #fcfcf8;
    background-image:
      repeating-linear-gradient(to bottom, rgba(38,86,140,0.32) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(to right,  rgba(38,86,140,0.32) 0 1px, transparent 1px 30px);
  }
  /* shot_on — something real lying ON the paper, at the world origin, so moving
     the phone moves you around and INTO a picture instead of around a dot. It is
     a child of the paper, so it inherits the pan, the zoom, the swirl and both
     leans for free — no second transform to keep in step. Sized in the paper's
     own units: 340 there is about one screen wide at x1, so the whole thing is
     in view when you are zeroed and you walk into it as you come closer.
     If the file is missing the image simply does not paint and the paper is
     exactly as it was. Swap lab_surface.png for any picture. */
  .shot {
    position: absolute; left: 50%; top: 50%;
    /* nearly the whole window at x1, so a reset presents the picture rather
       than a stamp in the middle of a field */
    /* crisp_deep — an <img> inside a transformed ancestor is rasterised at its
       LAYOUT size and then scaled by the transform, so an SVG blurs exactly when
       you lean in to look at it, which is the one thing it was chosen to avoid.
       So the element is laid out --shk times bigger and scaled back down by the
       same factor: the raster is taken at the larger size and the ancestor's zoom
       then magnifies a picture that already has the detail. --shk steps in powers
       of two so the re-layout is rare, and is capped, because the memory goes up
       with its square. */
    width: calc(352px * var(--shk, 1)); height: calc(626px * var(--shk, 1));
    transform: translate(-50%, -50%) scale(calc(1 / var(--shk, 1)));
    border-radius: 3px; background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.22);
    pointer-events: none; -webkit-user-select: none; user-select: none;
  }
  .shot[data-missing] { display: none; }
  .shot { display: none; }        /* card_deck: the painting steps aside for the cards */
  /* card_deck — the space he wants to traverse: a spread of cards side by side
     with a gap, one nudge to the neighbour, and a nudge inward drops you through
     the card you are on into a whole new spread inside it. The deck is driven in
     PIXELS off the card pitch rather than through the metre-and-zoom pipeline,
     because a card lattice has no business being measured in metres — a nudge is
     one card, and one card is one card at every depth.
     It keeps the swirl and both leans, so the deck still tips with the phone. */
  .deck {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 0; height: 0; pointer-events: none;
    transform-style: preserve-3d;
    transform: rotate(var(--rot, 0deg)) rotateX(var(--tilt, 0deg)) rotateY(var(--turn, 0deg))
               translate3d(var(--cx, 0px), var(--cy, 0px), 0) scale(var(--dz, 1));
    opacity: var(--dop, 1);
  }
  /* cal_month — a day, not a playing card: white, squared off, its date in the
     corner and its hours stacked under it. The colour that used to identify a
     card is gone, because a calendar identifies a day by its NUMBER and its
     contents, and 35 hues would be noise on top of that. */
  .card {
    position: absolute; border-radius: 5px;
    background: #ffffff; border: 1px solid #d8dde4;
    box-shadow: 0 1px 2px rgba(15,23,42,0.10);
    display: block; overflow: hidden;
    padding: var(--pad, 6px); box-sizing: border-box;
    color: #334155; text-align: left;
    font: 500 var(--evf, 8px)/1.28 -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .cal_out { background: #f3f5f8; color: #9aa3b0; }
  .cal_out .cal_num { color: #b3bbc6; }
  .cal_num {
    display: block; font-size: var(--num, 14px); font-weight: 700; line-height: 1;
    color: #1f2937; letter-spacing: -0.02em;
  }
  .cal_num i { font-style: normal; font-size: 0.5em; font-weight: 600; margin-left: 0.25em;
               color: #64748b; letter-spacing: 0.04em; text-transform: uppercase; }
  /* the day's own list starts BELOW whatever span bars cross this day, so a bar
     never lies over an hour — --lane is how far down that is, and it is worked
     out per day from how many spans touch it */
  .cal_list { display: block; margin-top: var(--lane, 4px); }
  .cal_ev {
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 0.18em; color: #475569;
  }
  /* cal_span — one element lying across the days it covers, so it reads as one
     thing that spans rather than as several things that coincide */
  .cal_bar {
    position: absolute; z-index: 2; border-radius: 999px;
    display: flex; align-items: center; overflow: hidden;
    padding: 0 0.5em; box-sizing: border-box;
    color: #ffffff; font-weight: 700; letter-spacing: -0.01em;
    font-family: -apple-system, system-ui, sans-serif;
    box-shadow: 0 1px 2px rgba(15,23,42,0.18);
  }
  .cal_bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }

  /* day_here — the corner brackets are gone, at his word. The day you are on says
     so itself instead: full strength while its neighbours are washed back, a blue
     ring standing off its edge, a tinted ground, and its date in the same blue.
     It lifts above the span bars too, so a bar can never cross the ring. */
  .card:not(.here) { opacity: 0.52; filter: saturate(0.6); }
  .card.here {
    opacity: 1; filter: none; z-index: 3;
    background: #eef4ff; border-color: #1d4ed8;
    box-shadow: 0 0 0 max(2px, calc(var(--num, 14px) * 0.16)) rgba(29,78,216,0.45),
                0 6px 20px rgba(15,23,42,0.28);
  }
  .card.here .cal_num { color: #1d4ed8; }
  .card.here .cal_ev { color: #1e293b; }
  /* lens_none — the magnifying glass is gone, every part of it: the round
     window, its ring, the highlight on the glass, the second copy of the world
     behind it and the gain that magnified one against the other. It made the page
     read as a thing seen through an instrument instead of a place you are moving
     around in, which is the wrong feeling for what this is. One world, full
     bleed, as it was before. */
  /* the distance dissolving into the background: one screen-sized overlay in
     the paper's own colour, cheap to paint and independent of the paper's size */
  .haze {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 78% 62% at 50% 56%,
                                rgba(252,252,248,0) 0%,
                                rgba(252,252,248,0.18) 66%,
                                rgba(252,252,248,0.62) 100%);
  }
  /* star_off — the star is gone. It existed to be the one thing in the world
     when the world was blank graph paper; with a picture lying on the paper
     there is something to look at, and a marker sitting on top of it is just in
     the way. Its shadow machinery went with it. */
  /* lab_build: every card wears the same colour, and the colour changes with
     each build — if it looks different from last time, the update landed. */
  .cell { background: transparent; color: #1d1d1f; }

  /* which cell you are on, in the frame itself */
  .dots {
    position: fixed; right: max(20px, calc(env(safe-area-inset-right) + 6px));
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 7px; z-index: 6;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1d1d1f; opacity: 0.18; }
  .dot.on { opacity: 0.75; }


  /* lab_release — a solid square in the corner wearing this release's colour,
     with this release's name inside it. New colour + new name every ship. */

  .hint {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    font-size: 14px; font-weight: 600; color: #1d1d1f;
    background: rgba(255,255,255,0.86); border-radius: 999px; padding: 7px 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    pointer-events: none; transition: opacity 0.4s;
  }
  /* thumb_reach: Set zero gets pressed constantly, so it sits low on the right,
     just above the recorder bar, where a right thumb lands without a stretch. */

  /* zero_split: the rarer of the two sits above the one the thumb wants, and is
     quieter — Set zero is pressed constantly, Reset all only when the scale has
     run away. */

  /* lag_trace — four seconds of history, so what the hand did and what the
     screen did can be compared by eye instead of by adjective.
     grey = how hard the phone is accelerating, purple = where the world is. */
  /* lane_view — six lanes, one per axis, stacked and kept apart. Each is a
     solid fill away from its own centre line, up for positive and down for
     negative, and carries no marking of any kind. The colours are the diagram's:
     red is the left-right axis and the tilt about it, green up-down and the turn
     about it, blue near-far and the swirl about it. */
  .trace {
    position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right) + 8px));
    top: max(122px, calc(env(safe-area-inset-top) + 110px));   /* panel_half: follows the diagram up */
    /* panel_half — the diagram and the chart at half their old size. They are
       instruments to glance at, not things to read, and at 178px they were taking
       a third of the screen away from the thing they are describing. */
    width: 89px; height: 84px; border-radius: 10px;
    background: rgba(255,255,255,0.88);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .pose {
    position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right) + 8px));
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    width: 89px; height: 89px; border-radius: 10px;      /* panel_half */
    background: rgba(255,255,255,0.86);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none;
  }

  /* gesture_lab — hold the button, do the move, let go. Everything the phone's
     sensors say during the hold is kept, tagged with the name you typed, so
     the two of us can look at real numbers instead of guessing. */
  /* gest_small — everything around the hold button gets out of the way: the bar
     is far narrower, the chrome is half the size it was. The one thing that does
     NOT shrink is the hold target itself, which stays a full-height slab because
     it is held down through a whole gesture with the phone in motion. */


  #g_name:focus { border-color: #1350c4; }

  .g_rec.recording { background: #1d1d1f; animation: g_pulse 1s ease-in-out infinite; }
  @keyframes g_pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
  /* take_clear: the bar says which of the four states it is in, in colour and
     in words — idle, recording, sending, sent-and-ready. */
  .g_status { font-size: 10px; line-height: 1.25; color: rgba(0,0,0,0.55); text-align: center; min-height: 12px;
              display: flex; align-items: center; justify-content: center; gap: 4px; }
  .g_led { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22); flex: 0 0 auto; }
  .g_recent { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-height: 0; }
  .g_chip.g_wait { border-color: #b45309; color: #b45309; font-weight: 600; }
  .g_chip { font-size: 9px; font-weight: 600; color: rgba(0,0,0,0.55);
            background: rgba(0,0,0,0.06); border-radius: 999px; padding: 2px 6px;
            max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g_row { display: flex; align-items: center; gap: 4px; }
  .g_small {
    flex: 1 1 auto; min-width: 0; border: none; border-radius: 7px; padding: 5px 4px;
    font: inherit; font-size: 10px; font-weight: 600; cursor: pointer;
    background: rgba(0,0,0,0.06); color: #1d1d1f; touch-action: manipulation;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g_count { flex: 0 0 auto; font-size: 10px; color: rgba(0,0,0,0.45); min-width: 30px; text-align: right; }

  /* ---- rig_right: the whole interface, stacked off the right edge ---- */
  /* bar_low — every control on one band along the bottom, at his word. It was a
     168px column floating in the lower right, which put the switches over the
     right-hand days and left the whole bottom of the glass empty. The band is
     full width, has its own ground so the calendar reading through it never makes
     a label ambiguous, and the month simply has the screen above it. */
  .rig {
    position: fixed; z-index: 8;
    left: 0; right: 0;
    bottom: 0;
    display: flex; flex-direction: column; align-items: stretch; gap: 6px;
    padding: 8px max(12px, env(safe-area-inset-left))
             max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-right));
    background: rgba(252,252,248,0.93);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(15,23,42,0.10);
    touch-action: manipulation;
  }
  /* the working row: grade, record and the disclosure, side by side */
  .rig_main { display: flex; align-items: center; gap: 8px; }
  .rig_main .rig_lights { flex: 0 0 auto; }
  .rig_main .g_rec { flex: 1 1 auto; }
  /* flip_hide — the switches are a setting, not a control, so they are closed by
     default and open from one small button. Twelve of them were taking a third of
     the band for something touched once a week. */
  .flip_pop {
    flex: 0 0 auto; min-height: 46px; min-width: 46px;
    border: 1px solid var(--panel_3, rgba(0,0,0,0.14)); border-radius: 13px;
    background: rgba(255,255,255,0.9); color: var(--muted, #86868b);
    font: 600 17px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
  }
  .flip_pop.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .flips[hidden] { display: none; }
  /* open_draw — an SVG does not honour the plain `hidden` attribute the way an
     HTML element does, so the diagram was painting an empty white box in the
     corner from load. It was invisible before only because the whole page was
     blank until motion was switched on. */
  .pose[hidden] { display: none !important; }
  .rig [hidden] { display: none !important; }
  /* vec_flip — five in a row across the rig's width, small because they are set
     once and then left alone, but each still a real target. Off is quiet; ON is
     filled, because "this axis is reversed" is a thing you must be able to see at
     a glance while walking around with the phone. */
  .flips { display: flex; flex-direction: column; gap: 4px; }
  .flip_row { display: flex; gap: 5px; align-items: center; }
  /* the row says which question it answers, in three characters, so the panel
     does not need a legend anywhere else */
  .flip_tag {
    flex: 0 0 34px; font: 600 10px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.04em; color: var(--muted, #86868b); text-align: right;
    padding-right: 2px; -webkit-user-select: none; user-select: none;
  }
  .flips button {
    /* row_tight — the show row carries six switches where the others carry three,
       and at the shared size its two-letter labels wrapped onto a second line and
       read as gibberish. They never wrap now, and a crowded row simply sets its
       own type smaller rather than every row shrinking to match the busiest. */
    white-space: nowrap;
    flex: 1 1 0; min-width: 0; min-height: 32px; padding: 0;
    border: 1px solid var(--panel_3, rgba(0,0,0,0.14));
    background: rgba(255,255,255,0.9); color: var(--muted, #86868b);
    border-radius: 8px; font: 600 13px/1 -apple-system, system-ui, sans-serif;
    cursor: pointer; touch-action: manipulation;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .flip_gap { flex: 1 1 0; min-width: 0; }
  .flips button.on {
    background: #1d4ed8; border-color: #1d4ed8; color: #fff;
  }
  .flips button:active { transform: scale(0.95); }
  /* grade_two — plain buttons, the same shape as Record. Green only exists while
     the tape is running, because a grade is about a take; Red is out at all
     times, because it is also the reset and that has to be reachable whenever
     the paper is moving. */
  .rig_lights { display: flex; gap: 8px; justify-content: flex-end; }
  .rig_lights .g_mark.g_green { display: none; }
  .rig.is_rec .rig_lights .g_mark.g_green { display: block; }
  .rig_lights .g_mark.g_red { flex: 0 0 78px; }
  .rig.is_rec .rig_lights .g_mark { flex: 1 1 0; }
  .g_mark {
    height: 46px; border: none; border-radius: 13px; padding: 0 10px;
    font: inherit; font-size: 15px; font-weight: 700; line-height: 1;
    color: #ffffff; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 2px 9px rgba(0,0,0,0.20);
    transition: filter 0.15s ease;
  }
  .g_mark.g_green { background: #16a34a; }
  .g_mark.g_red   { background: #d7263d; }
  .g_mark:active { transform: scale(0.96); }
  .g_mark.down  { filter: brightness(0.82); }
  .g_mark.hit   { filter: brightness(1.35); }
  .rig_say { display: flex; align-items: center; justify-content: flex-end; gap: 5px;
             min-height: 12px; overflow: hidden; }
  .g_led { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,0.22); flex: 0 0 auto; }
  .rig_msg {
    min-width: 0; font-size: 10.5px; line-height: 1.2; color: rgba(0,0,0,0.55);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g_rec {
    height: 56px; border: none; border-radius: 15px; padding: 0 10px;
    font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
    background: #1350c4; color: #ffffff; touch-action: manipulation;
    box-shadow: 0 3px 12px rgba(19,80,196,0.34);
  }
  .g_rec:active { transform: scale(0.97); }
  .g_rec.recording { background: #1d1d1f; }
  .rig.is_rec  .g_led { background: #d7263d; animation: g_pulse 1s ease-in-out infinite; }
  .rig.is_send .g_led { background: #e0a800; animation: g_pulse 0.7s ease-in-out infinite; }
  .rig.is_sent .g_led { background: #16a34a; }
  .rig.is_warn .g_led { background: #e0a800; }
  .rig.is_sent .rig_msg { color: #16a34a; font-weight: 700; }
  .rig.is_rec  .rig_msg { color: #d7263d; font-weight: 700; }
  /* the two things that are not controls: where you came from, and which build
     this is. Both out of the way in the top-left corner. */
  .corner_back {
    position: fixed; z-index: 8;
    top: max(16px, calc(env(safe-area-inset-top) + 8px));
    left: max(16px, calc(env(safe-area-inset-left) + 8px));
    display: inline-flex; align-items: center; height: 32px; padding: 0 13px;
    border-radius: 999px; text-decoration: none;
    background: rgba(255,255,255,0.9); color: #1d1d1f;
    box-shadow: 0 2px 8px rgba(0,0,0,0.16);
    font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap;
  }
  .corner_back:active { transform: scale(0.96); }
  .build_tag {
    position: fixed; z-index: 8;
    top: max(56px, calc(env(safe-area-inset-top) + 48px));
    left: max(16px, calc(env(safe-area-inset-left) + 8px));
    height: 28px; max-width: 44vw; border-radius: 9px;
    background: var(--lab_bg, #1d4ed8); color: var(--lab_fg, #ffffff);
    display: inline-flex; align-items: center; padding: 0 11px;
    font-size: 12.5px; font-weight: 700; line-height: 1; letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  /* watch_live — the source-watcher's own light, so it is never a mystery
     whether the page is still checking */
  .watch {
    position: fixed; z-index: 8;
    top: max(90px, calc(env(safe-area-inset-top) + 82px));
    left: max(16px, calc(env(safe-area-inset-left) + 8px));
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; color: rgba(0,0,0,0.42);
    pointer-events: none;
  }
  .watch_dot {
    width: 6px; height: 6px; border-radius: 50%; background: #16a34a;
    animation: g_pulse 1.6s ease-in-out infinite;
  }
  .watch.is_off .watch_dot { background: rgba(0,0,0,0.25); animation: none; }
  .watch.is_hit .watch_dot { background: #1350c4; animation: none; }
</style>
</head>
<body>

<div class="frame_window" id="frame">
  <!-- one world, filling the window. The stage carries the perspective; the
       paper carries the swirl, both leans, the pan and the zoom. -->
  <div class="stage">
    <div class="grid" id="grid"><img class="shot" id="shot" alt="" src="lab_surface.svg"></div>
    <div class="deck" id="deck"></div>
  </div>
  <div class="haze"></div>
  <div class="track" id="track">
    <div class="cell cell_1"></div>
    <div class="cell cell_2"></div>
    <div class="cell cell_3"></div>
  </div>
  <div class="frame_shadow"></div>
</div>

<div class="dots" id="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
<div class="hint" id="hint">swipe up / down</div>

<!-- rig_right — everything you touch, stacked off the right edge and lifted a
     little off the corner: one wide Record, and while the tape runs the three
     lights it turns into. Nothing else lives down here any more — no name to
     type, no bar across the bottom. -->
<div class="rig" id="gest_bar">
  <!-- grade_two — two ordinary buttons, not lamps. Green says that was right.
       Red says it was not, and resets, which is the same press he was making
       anyway: in his protocol hitting reset IS the bad grade. Amber is gone. -->
  <div class="rig_say"><span class="g_led" id="g_led"></span><span class="rig_msg" id="g_msg">tap Record</span></div>
  <div class="rig_main">
    <div class="rig_lights" id="rig_lights">
      <button id="g_good" class="g_mark g_green">Good</button>
      <button id="g_wire" class="g_mark g_red">Bad</button>
    </div>
    <button id="g_rec" class="g_rec">Record</button>
    <!-- flip_hide: the switches live behind this -->
    <button id="flip_pop" class="flip_pop" aria-expanded="false"
            aria-controls="flips" title="Show the reverse switches">⇅</button>
  </div>
  <div class="g_status" id="g_status" hidden></div>
  <div class="g_recent" id="g_recent" hidden></div>
  <button id="g_copy" class="g_small" hidden>Copy last</button>
  <button id="g_send" class="g_small" hidden>Send</button>
  <span class="g_count" id="g_count" hidden></span>
  <!-- vec_flip — five tiny reverse switches, one per vector, under the controls
       they change the meaning of. A lit one is reversed; they survive a reload. -->
  <div class="flips" id="flips" hidden></div>
</div>
<a class="corner_back" id="back_btn" href="admin.html">&#8249; Admin</a>
<span class="build_tag" id="build_tag"></span>
<div class="watch" id="watch" hidden><span class="watch_dot"></span><span id="watch_msg">watching</span></div>
<svg class="pose" id="pose" viewBox="-62 -62 124 124" hidden aria-hidden="true">
  <!-- pose_arrow: the phone as an object standing in a frame that never moves.
       The axes and the dashed zero rectangle are pinned at the origin; the plate
       carries BOTH the tilt and the travel, so where the phone is in the picture
       is where it is in the world. The coloured bars along each axis, and the
       dashed drop lines to them, read off its position one axis at a time. -->
  <g id="pose_ref" stroke="rgba(0,0,0,0.18)" stroke-width="1" fill="none"></g>
  <g id="pose_axes" stroke-width="2" stroke-linecap="round" fill="none"></g>
  <g id="pose_guide" fill="none"></g>
  <line id="pose_move" stroke="rgba(0,0,0,0.28)" stroke-width="1.4" stroke-linecap="round"
        stroke-dasharray="3 3"></line>
  <g id="pose_shadow" fill="rgba(0,0,0,0.055)"></g>
  <polygon id="pose_plate" fill="rgba(109,40,217,0.07)" stroke="rgba(109,40,217,0.55)" stroke-width="1" stroke-linejoin="round"></polygon>
  <line id="pose_top" stroke="rgba(109,40,217,0.8)" stroke-width="1.6" stroke-linecap="round"></line>
  <!-- spin_arc: a rotation is not a distance, so it is drawn where a rotation
       can be seen — an arc swept about the axis it turns, in that axis's colour.
       It rides ABOVE the plate, or the phone hides the very thing it is doing. -->
  <g id="pose_spin" fill="none"></g>
  <g id="pose_knob"></g>
  <!-- read_split: one named line per thing being read, instead of two crowded
       rows of initials sitting on top of each other. -->
  <g id="pose_read" font-family="-apple-system, sans-serif"></g>
  <text id="pose_lbl" font-size="0.01" fill="none"></text>
</svg>
<canvas class="trace" id="trace" width="178" height="168" hidden></canvas><!-- panel_half: the
     canvas keeps its 178x168 backing store and is DRAWN at half that by the CSS
     above. Halving the buffer instead would halve the resolution of the one thing
     on the page whose whole job is showing a small wobble. -->

<script>
  // lab_release — the corner square IS the version stamp: this release's commit
  // name in this release's colour. Both change on every ship.
  var LAB_RELEASE = { name: 'day_phone', bg: '#c2410c', fg: '#ffffff' };
  (function () {
    var r = document.documentElement.style;
    r.setProperty('--lab_bg', LAB_RELEASE.bg);
    r.setProperty('--lab_fg', LAB_RELEASE.fg);
    var tag = document.getElementById('build_tag');
    if (tag) tag.textContent = LAB_RELEASE.name;
  })();

  var N = 3;
  var idx = 0;                 // which cell is showing
  var track = document.getElementById('track');
  var frame = document.getElementById('frame');
  var dots  = document.getElementById('dots');
  var hint  = document.getElementById('hint');

  function cell_h() { return frame.clientHeight || window.innerHeight; }
  function paint(px) {
    track.style.transform = 'translate3d(0,' + px + 'px,0)';
  }
  function go(i, animate) {
    idx = Math.max(0, Math.min(N - 1, i));
    track.classList.toggle('dragging', !animate);
    paint(-idx * cell_h());
    Array.prototype.forEach.call(dots.children, function (d, k) {
      d.classList.toggle('on', k === idx);
    });
    if (idx > 0 && hint) { hint.style.opacity = '0'; }
  }
  go(0, false);
  requestAnimationFrame(function () { track.classList.remove('dragging'); });
  window.addEventListener('resize', function () { go(idx, false); requestAnimationFrame(function () { track.classList.remove('dragging'); }); });

  // ---- drag: the cells follow the finger, then snap to the nearest page ----
  // close_light's lesson: a short push is enough — 40px, or 8% of the cell.
  function snap_px() { return Math.min(40, cell_h() * 0.08); }
  var drag = null;
  function start(y) { drag = { y0: y, base: -idx * cell_h(), active: false }; }
  function move(y) {
    if (!drag) return false;
    var dy = y - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) < 5) return false;
      drag.active = true;
      track.classList.add('dragging');
    }
    var px = drag.base + dy;
    // rubber-band at the two ends
    var min = -(N - 1) * cell_h(), max = 0;
    if (px > max) px = max + (px - max) * 0.35;
    if (px < min) px = min + (px - min) * 0.35;
    paint(px);
    return true;
  }
  function end() {
    if (!drag) return;
    var wasActive = drag.active;
    var moved = (parseFloat(track.style.transform.replace(/.*,\s*(-?[\d.]+)px,.*/, '$1')) || 0) - drag.base;
    drag = null;
    track.classList.remove('dragging');
    if (!wasActive) { go(idx, true); return; }
    if (moved <= -snap_px()) go(idx + 1, true);        // pushed up -> next page
    else if (moved >= snap_px()) go(idx - 1, true);    // pulled down -> previous
    else go(idx, true);
  }

  // ---- swipe_pan: a finger drags the SURFACE, in its own plane ----
  // The old up/down flick between three coloured cards has no job left — there is
  // one world now, not a stack of pages — so the same gestures move the paper
  // instead. A drag is converted back through the swirl (the paper's axes are
  // turned on screen, so a screen delta is not a paper delta) and then through
  // the scale, because a pixel is worth less world when you are zoomed in. It is
  // written into BOTH the model and the drawn position, so the surface tracks the
  // finger exactly rather than lagging a spring behind it.
  var dragOn = false, dragX = 0, dragY = 0;
  function drag_start(x, y) { dragOn = true; dragX = x; dragY = y; }
  function drag_move(x, y) {
    if (!dragOn) return false;
    var dx = x - dragX, dy = y - dragY;
    dragX = x; dragY = y;
    if (!dx && !dy) return true;
    var v = view();
    var r = (v.roll || 0) * Math.PI / 180;          // undo the swirl
    var px =  dx * Math.cos(r) + dy * Math.sin(r);
    var py = -dx * Math.sin(r) + dy * Math.cos(r);
    var per = v.pxPerM || 1;
    var mx =  px / (PAN_INV * per);
    var my = -py / (PAN_INV * per);
    off.x += mx; off.y += my;      // nudge_hold: the drag slides under the lattice,
    show.x += mx; show.y += my;    // and nudges carry on from wherever it left off
    return true;
  }
  function drag_end() { dragOn = false; }

  window.addEventListener('touchstart', function (e) {
    if (e.target.closest && e.target.closest('.rig, .corner_back')) return;
    if (e.touches.length === 1) drag_start(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (drag_move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', drag_end, { passive: true });
  window.addEventListener('touchcancel', drag_end, { passive: true });

  // mouse, so the same thing works on a laptop
  var mouseDown = false;
  window.addEventListener('mousedown', function (e) {
    if (e.target.closest && e.target.closest('.rig, .corner_back')) return;
    mouseDown = true; drag_start(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', function (e) { if (mouseDown) drag_move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; drag_end(); } });

  document.getElementById('back_btn').addEventListener('click', function () {
    window.location.href = 'admin.html';
  });

  // ---- world_view: the screen is a window onto a world that does not move ----
  //
  // His model, followed literally:
  //   · a zero pose is captured when he says so (phone flat, or comfortably
  //     angled at his face). Everything is measured in THAT frame.
  //   · turning the phone right/left, or tipping its top toward/away, must not
  //     move the world at all. Rotation is not a translation.
  //   · sliding the phone one screen width to the right slides the world one
  //     screen width to the left — 1:1 at the reference distance.
  //   · moving the phone toward the eye raises the multiple (one screen width
  //     of hand movement can sweep three screen widths of world) and draws the
  //     world larger; moving it away drops the multiple below one and draws the
  //     world smaller. multiple = D0 / D, the plain magnifier law.
  //
  // How rotation gets ignored properly: the accelerometer reports in the
  // PHONE's axes, so a tilted phone would smear a sideways slide across two
  // axes. Each sample is rotated out of the phone frame into the world by the
  // current orientation, then into the zero frame — after which only the three
  // translations remain, and any amount of turning leaves them untouched.
  //
  // The honest caveat, unchanged: position comes from integrating acceleration
  // twice, which drifts. Two things keep it usable — a zero-velocity update
  // (when the phone reads still for 0.35s, velocity is forced to zero, the
  // standard dead-reckoning trick) and a slow leak (~2.5s) that eases the world
  // home rather than letting it wander off. Inside one gesture it holds.
  var PHONE_W    = 0.071;    // metres across a phone: the 1:1 yardstick
  var D0         = 0.35;     // metres: the reference viewing distance
  var D_MIN      = 0.10, D_MAX = 1.20;
  // depth_wide: plain D0/D only spans about 3x within arm's reach, and he wants
  // the far end dense and the near end down to a couple of lines on the whole
  // screen. Raising the ratio to a power stretches that range without needing
  // the phone to travel any further: (D0/D)^2.2 gives ~0.25x at arm's length
  // and ~13x when it is brought right in.
  // scale_blow — the depth response is three times what it was: the exponent
  // went 2.2 -> 6.6, and the ceiling and floor opened up to match, so a hand's
  // width of toward-and-away covers the whole range instead of a slice of it.
  // zoom_wide — double the depth response: the exponent doubles, which doubles
  // the magnification the same hand movement buys. 4 cm toward the eye goes from
  // x1.75 to x3.06, 8 cm from x3.30 to x10.9, and the ceiling arrives by about
  // 11 cm instead of 17. It was halved in z_calm to stop the axis being twitchy;
  // what actually fixed the twitch was the larger deadband and the softer spring
  // on z, so the exponent can go back up and past where it was.
  // doubled again. The whole range is now inside about six centimetres of hand:
  // 2 cm toward the eye is x2.95, 4 cm is x9.3, and the ceiling arrives by 6.5.
  var Z_POWER    = 18.4;
  // paper_floor — the paper is a fixed 400% that SHRINKS with the zoom, so the
  // bottom of the range is set by coverage now: 0.45 still leaves 180% of the
  // window covered when it is leaning. It is also the cheapest end to paint —
  // a big element full of small squares is a lot of lines — so the floor buys
  // frames as well as coverage. The ceiling is unchanged: that is the end he
  // cares about.
  // and the floor drops with it, or a doubled exponent would hit bottom three
  // centimetres out. 400% of the viewport at x0.30 is still 120% covered, and
  // the haze takes the rim.
  var MULT_MIN   = 0.30, MULT_MAX = 39;
  // nudge_core — everything that used to live here is gone: DEAD and DEAD_Z, the
  // brake decay, the latch and stop velocities, the still window, the velocity
  // and coast time constants, the move threshold and its maximum duration, the
  // tremor window, ratio and hold, the one-axis dominance ratio, the dwell time,
  // the lead term, and the two rotation-veto angles. Twenty-two constants, every
  // one of them tuned against his takes, and every one of them feeding a model
  // that did not move a card.
  //
  // What replaced them is already above, in nudge_watch: two exponential averages
  // and a subtraction. The slow one is whatever the phone currently thinks zero
  // is, which is what the levelling window and the calibrated bias were for. The
  // fast one is the gesture. Nothing else is needed to see a wrist flick, and
  // everything else was in the way of seeing it.

  // reset_run — his shorthand: ONE press of reset means 'I am just re-zeroing',
  // several presses close together mean 'that went disastrously wrong'. So the
  // presses are counted, every reset mark carries how many it was, and two or
  // more is flagged severe.
  var RESET_GAP  = 900;      // ms: presses closer together than this are one burst
  var resetAt    = 0;        // when the last reset was
  var resetRun   = 0;        // how many in the current burst

  var motionOn = false;
  var R0 = null;             // zero-pose rotation matrix — the DIAGRAM's plate only
  var Rnow = null;
  var show  = { x: 0, y: 0, z: 0 }; // what is drawn: the lattice, plus the drag
  var showV = { x: 0, y: 0, z: 0 };
  // bump_step — the world does not follow the phone any more. It sits on a
  // LATTICE, and a gesture is worth exactly one step along one axis: bump right,
  // the world goes one right; bump back, one left; bump toward you, one closer.
  // How hard or how far you bumped changes nothing — one bump is one level. The
  // sensing underneath is unchanged (deadband, shake test, dominance, direction
  // latch, brake): all of that still decides whether a real push happened and
  // which way it went. What changed is what we DO with the answer — we no longer
  // integrate it into a distance, we read it as a single yes on a single axis.
  //
  // bump_centre — and after every bump the metre-scale model is wiped back to
  // zero. That is the whole point of stepping: nothing is carried forward, so
  // sensor drift, a bad brake, a trapped axis and a half-detected wobble all die
  // at the end of the gesture they happened in instead of accumulating. Where the
  // world stands is `cell`, three integers, and integers do not drift.
  // nudge_hold — the two halves, together. Your bump is only the TRIGGER:
  // everything measured about it — how hard, how far, how long — is thrown away,
  // and one STANDARD nudge is delivered instead, the same size and the same shape
  // every time. What is new here is that the nudge STAYS. It does not go out and
  // come back; it carries the world one notch the way you nudged and leaves it
  // there. Where the world stands is `cell`, three whole numbers, and a nudge is
  // +1 or -1 on exactly one of them. Whole numbers do not drift, and the gesture
  // that moved them is forgotten the instant it has been counted.
  var cell = { x: 0, y: 0, z: 0 };
  // cal_month: the lattice is the month, so its limits are the month's own edges —
  // three days either side of the middle column, two weeks either side of the
  // middle row. You cannot nudge off the calendar.
  var CELL_MAX = { x: 3, y: 2, z: 5 };
  var BUMP_ZOOM = 1.6;              // how much bigger one nudge toward you makes the world
  // derive the depth notch from the zoom law, so changing Z_POWER cannot silently
  // change what a nudge toward you is worth
  var NUDGE_Z   = D0 * (1 - Math.pow(BUMP_ZOOM, -1 / Z_POWER));
  // nudge_even — a sideways notch is a quarter of the SCREEN, at every zoom. Pan is
  // metres times the zoom, so a notch fixed in metres would be a quarter screen at
  // x1 and nine screens at x39 — one nudge would throw you clean off the picture
  // the moment you had leaned in. So the metres per notch are divided by the zoom
  // the LATTICE is at: a settled power of BUMP_ZOOM, so nothing chases itself.
  var NUDGE_FRAC = 0.25;
  var NUDGE_PAN  = NUDGE_FRAC * PHONE_W;
  // the shape of the delivery: fast off the mark and easing into its landing, so
  // it reads as a nudge arriving rather than as a slide. 160ms, down from 210 —
  // the whole point of this pass is the tight loop, and the landing is the second
  // half of the time between his wrist and his eye.
  var NUDGE_MS = 160;
  var anim = null;                  // { k, from, t0 } while a nudge is landing
  var off  = { x: 0, y: 0, z: 0 };  // what the finger has dragged, under the lattice
  function ease(u) { var v = 1 - u; return 1 - v * v * v; }   // cubic ease-out
  // cell_at — the value of axis k right now: the whole number it has reached, or
  // the eased journey there while a nudge is still landing
  function cell_at(k) {
    if (!anim || anim.k !== k) return cell[k];
    var t = Date.now() - anim.t0;
    if (t >= NUDGE_MS) { anim = null; return cell[k]; }
    return anim.from + (cell[k] - anim.from) * ease(t / NUDGE_MS);
  }
  // zoom_at — the magnification the lattice is at right now, straight off the same
  // law view() uses. It is a pure function of the clock, so reading it here to
  // scale the pan cannot start anything chasing itself.
  function zoom_at() {
    var d = Math.max(D_MIN, Math.min(D_MAX, D0 - DEPTH_INV * (cell_at('z') * NUDGE_Z)));
    return Math.max(MULT_MIN, Math.min(MULT_MAX, Math.pow(D0 / d, Z_POWER)));
  }
  function nudge_m(k) {
    // pan_settle: divide by the ACTUAL zoom, not by BUMP_ZOOM^z. The two are only
    // equal for one step — the zoom law is not a power of the depth — so using the
    // shorthand left a couple of pixels of pan snap on every nudge after the first.
    return k === 'z' ? cell_at('z') * NUDGE_Z
                     : cell_at(k) * NUDGE_PAN / zoom_at();
  }
  var lastBump = '';
  // nudge_fast — fire on the LEADING EDGE. Everything before this waited for the
  // gesture to FINISH: brake to a stop, go quiet, then classify what had been
  // integrated. That is a quarter to half a second of delay on every nudge, and
  // it is the wrong shape of answer anyway — a nudge is over before it has
  // finished, and it is recognisable from its first 50 milliseconds.
  //
  // So the loop is now: a fast average of the drive (NUDGE_TAU, 45ms — three times
  // quicker than the tremor filter it replaces for this job), a threshold on it,
  // and a dominance test. The instant one axis crosses NUDGE_A and is clearly the
  // one being driven, the nudge is delivered. Then the detector DISARMS and stays
  // disarmed until the phone has been quiet for NUDGE_REARM — which is what stops
  // the return stroke, the brake, and the settle from each firing a nudge of their
  // own. That refractory window is the whole trick: one gesture in, one nudge out.
  //
  // swoop_out: and it only arms after quiet, so a slow swoop cannot trigger it —
  // by the time a swoop is going fast enough it has been going too long. NUDGE_RISE
  // is the deadline: cross the threshold within that of leaving quiet, or the burst
  // is not a nudge and the detector simply waits for quiet again.
  var NUDGE_TAU   = 0.045;   // s: how fast the drive is averaged before it is judged
  // nudge_small — the bar comes down a long way. He is making micro nudges now,
  // and a big one is normalised to the same single card anyway, so there is
  // nothing to gain from demanding a hard one. What keeps this honest is not the
  // height of the bar but the three tests around it: the axis has to be clearly
  // the one being driven, it has to get there fast, and the detector has to have
  // been quiet first.
  var NUDGE_A     = 0.13;    // m/s^2 of averaged drive that says "that was a nudge"
  // nudge_floor — the nudge detector uses its OWN deadband, far smaller than the
  // one the old integrator needed. That deadband existed to stop drift creeping
  // into a running position; there is no running position here, and subtracting
  // 0.12 from every sample was quietly eating the small gestures this pass is
  // about. 0.05 is enough to keep sensor floor noise out of the average.
  var NUDGE_DEAD  = 0.05;
  // dead_z — near/far gets its own, larger floor, and the reason is old: the
  // phone's gravity-free reading is an ESTIMATE, and its error is largest along
  // gravity, which at any comfortable holding angle is mostly along the screen's
  // normal. There used to be a constant for exactly this and nudge_core deleted
  // it along with the integrator it sat next to — that was a mistake, because the
  // reason for it had nothing to do with the integrator.
  // The evidence: across all 268 gestures in his recorded takes, z led 69% of
  // them, on a page where he is mostly nudging up, down, left and right. It is
  // not the orbit doing that — the centripetal pull only ever points toward him,
  // and the split is 95 gestures leading +z against 89 leading -z, near enough
  // even. Half of it is simply leakage. At 0.13 the z share falls to 14%.
  var NUDGE_DEAD_Z = 0.13;

    // AWAY from the viewpoint, so the hoop read as the far side of a sphere with
    // him outside it looking in. It is the near side. He is at the centre and the
    // phone orbits HIM, so the arms of the axes have to come round TOWARD him at
    // both ends: concave, cupping the viewpoint, not bulging away from it. One
    // sign on the sagitta, and BOW more than doubled because at 8 the curve was
    // arguable at a glance and the whole point of drawing it is that it is not.
    var BOW = 19;
    function orb(v, d, L) {
      var u = Math.abs(d) / L;

    }
    function arc_path(v, to, step) {
      var L = Math.abs(to), out = '';
      for (var d = 0; ; d += step) {
        if ((step > 0 && d > to) || (step < 0 && d < to)) d = to;
        var p = iso(orb(v, d, L));

        if (d === to) break;

    function arrow(v, colour, letter, bend) {
      // the tip, the head and the letter all come off the arc itself
      var e   = iso(bend ? orb(v, AX_LEN, AX_LEN)
                         : { x: v.x * AX_LEN, y: v.y * AX_LEN, z: v.z * AX_LEN });
      var nb  = iso(bend ? orb(v, AX_LEN - 6, AX_LEN)
                         : { x: v.x * (AX_LEN - 6), y: v.y * (AX_LEN - 6), z: v.z * (AX_LEN - 6) });
      var dx  = e.x - nb.x, dy = e.y - nb.y;
      var n   = Math.hypot(dx, dy) || 1;
      var ux  = dx / n, uy = dy / n;
      var hx = e.x - ux * 7, hy = e.y - uy * 7;
      var lx = e.x + ux * 10, ly = e.y + uy * 10;
      var back = iso(bend ? orb(v, -AX_LEN * 0.8, AX_LEN * 0.8)
                          : { x: -v.x * AX_LEN * 0.8, y: -v.y * AX_LEN * 0.8, z: -v.z * AX_LEN * 0.8 });
      var out = (bend
                ? '<path d="' + arc_path(v, -AX_LEN * 0.8, -3) + '" fill="none" stroke="' + colour +
                  '" stroke-width="0.9" opacity="0.3"/>' +
                  '<path d="' + arc_path(v, AX_LEN - 7, 3) + '" fill="none" stroke="' + colour + '" stroke-width="1.4"/>'
                : '<line x1="0" y1="0" x2="' + back.x.toFixed(1) + '" y2="' + back.y.toFixed(1) +
                  '" stroke="' + colour + '" stroke-width="0.9" opacity="0.3"/>' +
                  '<line x1="0" y1="0" x2="' + hx.toFixed(1) + '" y2="' + hy.toFixed(1) + '" stroke="' + colour + '" stroke-width="1.4"/>') +
                '<polygon points="' + e.x.toFixed(1) + ',' + e.y.toFixed(1) + ' ' +
                  (hx - uy * 2.8).toFixed(1) + ',' + (hy + ux * 2.8).toFixed(1) + ' ' +
                  (hx + uy * 2.8).toFixed(1) + ',' + (hy - ux * 2.8).toFixed(1) + '" fill="' + colour + '" stroke="none"/>' +
                '<text x="' + lx.toFixed(1) + '" y="' + (ly + 3.8).toFixed(1) + '" fill="' + colour +
                  '" font-size="12" font-weight="800" text-anchor="middle" stroke="none"' +
                  ' font-family="-apple-system, sans-serif">' + letter + '</text>';
      for (var t = TICK; t <= AX_LEN - 4; t += TICK) {
        [t, -t].forEach(function (d) {
          var p = iso(bend ? orb(v, d, d > 0 ? AX_LEN : AX_LEN * 0.8)
                           : { x: v.x * d, y: v.y * d, z: v.z * d });
          out += '<line x1="' + (p.x - uy * 2.6).toFixed(1) + '" y1="' + (p.y + ux * 2.6).toFixed(1) +
                 '" x2="' + (p.x + uy * 2.6).toFixed(1) + '" y2="' + (p.y - ux * 2.6).toFixed(1) +
                 '" stroke="' + colour + '" stroke-width="0.9" opacity="0.55"/>';

    }
    axes.innerHTML = arrow(ax, '#dc2626', 'X', true) +
                     arrow(ay, '#16a34a', 'Y', true) +
                     arrow(az, '#2563eb', 'Z', false);
    // spin_arc — one arc per rotation, swept in the plane the rotation turns in:
    // tilt sweeps about X and is drawn in the Y-Z plane, turn about Y in Z-X,
    // swirl about Z in X-Y. Each is the axis's own colour, so the colour that
    // names a direction also names the turn around it. Nothing is drawn below a
    // few degrees, so a still phone stays clean.
    var SPIN_R = 36;   // outside the plate, so the arcs are not lost behind it
    function arc(u, v2, deg, colour) {
      if (Math.abs(deg) < 3) return '';
      var steps = Math.max(4, Math.min(28, Math.round(Math.abs(deg) / 6)));
      var pts = [], i2, t, p;
      for (i2 = 0; i2 <= steps; i2++) {
        t = (deg * Math.PI / 180) * (i2 / steps);
        p = iso({ x: (u.x * Math.cos(t) + v2.x * Math.sin(t)) * SPIN_R,
                  y: (u.y * Math.cos(t) + v2.y * Math.sin(t)) * SPIN_R,
                  z: (u.z * Math.cos(t) + v2.z * Math.sin(t)) * SPIN_R });
        pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
      }
      // a small head at the moving end, so which way it is turning is not a guess
      var a2 = pts[pts.length - 1].split(',').map(Number);
      var b2 = pts[pts.length - 2].split(',').map(Number);
      var dx = a2[0] - b2[0], dy = a2[1] - b2[1];
      var m2 = Math.hypot(dx, dy) || 1; dx /= m2; dy /= m2;
      return '<polyline points="' + pts.join(' ') + '" stroke="' + colour +
             '" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>' +
             '<polygon points="' + (a2[0] + dx * 4).toFixed(1) + ',' + (a2[1] + dy * 4).toFixed(1) + ' ' +
               (a2[0] - dy * 2.6).toFixed(1) + ',' + (a2[1] + dx * 2.6).toFixed(1) + ' ' +
               (a2[0] + dy * 2.6).toFixed(1) + ',' + (a2[1] - dx * 2.6).toFixed(1) +
             '" fill="' + colour + '" stroke="none"/>';
    }
    // arc_flip — the plate turns the right way but two of the arrows did not.
    // The arc is swept from 0 to the angle, so its arrowhead sits at the end of
    // the sweep; negating the angle sweeps the other way and turns the arrow
    // round. Tilt and swirl are negated here; the turn arrow was already right.
    // This is the ARROW only — the plate reads flipped.pitch untouched.
    document.getElementById('pose_spin').innerHTML =
      arc(ay, az, -flipped.pitch,             '#dc2626') +   // tilt,  about X
      arc(az, ax,  flipped.roll,              '#16a34a') +   // turn,  about Y
      arc(ax, ay, -SWIRL_INV * flip.dswirl * screen_roll(), '#2563eb');    // swirl, about Z

    // plate_move — the phone carries its travel now; the axes hold still. Each
    // axis is clamped on its own so a big move on one never drags the picture off.
    // model_pos hands back -1..1 per axis now, so the axis length IS the scale
    function clamp_ax(v) { var u = v * AX_MAX; return Math.max(-AX_MAX, Math.min(AX_MAX, u)); }
    var mp = model_pos(flipped.pitch, flipped.roll);
    var mv = { x: clamp_ax(mp.x), y: clamp_ax(mp.y), z: clamp_ax(mp.z) };
    // curve_flip — the arithmetic bends with the picture. X and Y are arcs, so a
    // phone that has travelled out along either of them is no longer at the flat
    // (x, y, z) it would be on a rail: it has come round toward the viewpoint by
    // the sagitta of each arc it has ridden. Adding both sagittas to Z is the
    // whole of it, and it is the same BOW the axes are drawn with, so the plate
    // can never sit off the hoop it is supposed to be travelling on.
    function sag_of(d) { var u = Math.min(1, Math.abs(d) / AX_LEN); return BOW * u * u; }
    var mvc = { x: mv.x, y: mv.y, z: mv.z + sag_of(mv.x) + sag_of(mv.y) };
    var mvp0 = iso(mvc);

    // that axis, a knob at the end of it, and a dashed line joining the knob to
    // the phone — read one axis at a time without doing the projection yourself.
    var guide = '', knob = '';
    [[ax, '#dc2626', mv.x, true], [ay, '#16a34a', mv.y, true], [az, '#2563eb', mv.z, false]].forEach(function (g) {
      var v = g[0], colour = g[1], d = g[2], bendy = g[3];
      // the knob sits ON the axis it reads, which is now an arc for X and Y
      var p = iso(bendy ? orb(v, d, AX_LEN) : { x: v.x * d, y: v.y * d, z: v.z * d });
      if (Math.abs(d) > 0.6) {
        guide += '<line x1="0" y1="0" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) +
                 '" stroke="' + colour + '" stroke-width="3" stroke-linecap="round" opacity="0.45"/>' +
                 '<line x1="' + p.x.toFixed(1) + '" y1="' + p.y.toFixed(1) + '" x2="' + mvp0.x.toFixed(1) +
                 '" y2="' + mvp0.y.toFixed(1) + '" stroke="' + colour + '" stroke-width="0.9" opacity="0.6" stroke-dasharray="2.5 2.5"/>';
        // the knob rides above the plate: the phone can never hide a reading
        knob += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
                '" r="2.6" fill="' + colour + '" stroke="#ffffff" stroke-width="0.9"/>';
      }
    });

    // is measured from, so it is drawn LAST, above the plate: the phone passes
    // in front of it and behind it, and it never disappears either way.
    knob += '<circle cx="0" cy="0" r="3.4" fill="none" stroke="rgba(0,0,0,0.75)" stroke-width="1.1"/>' +
            '<circle cx="0" cy="0" r="1.1" fill="rgba(0,0,0,0.75)"/>';
    document.getElementById('pose_guide').innerHTML = guide;
    document.getElementById('pose_knob').innerHTML = knob;
    // the phone plate: a rectangle in its own x/y plane, standing where it has
    // travelled to rather than at the origin
    function corner(sx2, sy2) {
      return { x: mvc.x + px_.x * sx2 + py_.x * sy2,
               y: mvc.y + px_.y * sx2 + py_.y * sy2,
               z: mvc.z + px_.z * sx2 + py_.z * sy2 };

      '<polygon points="' + cs.map(function (c) { return pt({ x: c.x, y: 0, z: c.z }, 1); }).join(' ') + '"/>';

    // rather than reduced to an initial. Distances first in the axis colours,
    // then the three angles, then the scale. Label left, value right, so the
    // column of numbers can be scanned without hunting.
    // plate_arc — the two lateral lines read how far round the arc the phone is,
    // in degrees, because that is what they now show. Near/far reads notches,
    // because that is what IT shows.
    function arc_txt(v) {
      var n = Math.round(v * ORB_SPAN);
      return (n < 0 ? '\u2212' : '+') + Math.abs(n) + '\u00b0';
    }
    function cell_txt(v, max) {
      var n = Math.round(v * max);
      return (n < 0 ? '\u2212' : '+') + Math.abs(n);
    }
    function deg_txt(v) {
      return (v < -0.5 ? '\u2212' : '+') + Math.abs(v).toFixed(0) + '\u00b0';
    }

      ['right / left', arc_txt(mp.x),         '#dc2626'],
      ['up / down',    arc_txt(mp.y),         '#16a34a'],
      ['near / far',   cell_txt(mp.z, Z_MAX), '#2563eb'],
      ['tilt top',     deg_txt(flipped.pitch),             'rgba(0,0,0,0.68)'],
      ['turn side',    deg_txt(flipped.roll),              'rgba(0,0,0,0.68)'],
      ['swirl flat',   deg_txt(SWIRL_INV * flip.dswirl * screen_roll()), 'rgba(0,0,0,0.68)'],
      ['scale',        '\u00d7' + mult.toFixed(2),         'rgba(0,0,0,0.68)']

    // no_number — the readout is gone from the face of the diagram: the lanes
    // below say the same thing in a form that can be read at a glance, and he
    // does not want a single figure on the page. The values still exist, in the
    // hidden line the state hook and the tests read.
    document.getElementById('pose_lbl').textContent = lines.map(function (L) {
      return L[0] + ' ' + L[1];
    }).join('  \u00b7  ');
  }

  // orientation -> rotation matrix (ZXY intrinsic, the W3C convention)
  function mat_from(alpha, beta, gamma) {
    var d = Math.PI / 180;
    var a = (alpha || 0) * d, b = (beta || 0) * d, g = (gamma || 0) * d;
    var cA = Math.cos(a), sA = Math.sin(a);
    var cB = Math.cos(b), sB = Math.sin(b);
    var cG = Math.cos(g), sG = Math.sin(g);
    return [
      cA * cG - sA * sB * sG, -cB * sA,  cA * sG + cG * sA * sB,
      cG * sA + cA * sB * sG,  cA * cB,  sA * sG - cA * cG * sB,
                   -cB * sG,       sB,               cB * cG

  }

    return { x: m[0]*v.x + m[1]*v.y + m[2]*v.z,

             z: m[6]*v.x + m[7]*v.y + m[8]*v.z };
  }
  function mul_t_vec(m, v) {   // transpose(m) * v
    return { x: m[0]*v.x + m[3]*v.y + m[6]*v.z,
             y: m[1]*v.x + m[4]*v.y + m[7]*v.z,
             z: m[2]*v.x + m[5]*v.y + m[8]*v.z };
  }

  function on_orientation(e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    Rnow = mat_from(e.alpha, e.beta, e.gamma);
    if (!R0) R0 = Rnow;
  }
  // nudge_core — THE path, and now the whole of it. Raw sample in, one notch of
  // deck out. Four steps and no state but the detector's own:
  //
  //   1. take e.acceleration exactly as the phone sends it
  //   2. work out whether the wrist is twisting (the one motion that is not a nudge)
  //   3. hand both to nudge_watch, which decides
  //   4. step the drawing
  //
  // What used to be here, and is now gone: the sample was rotated into a world
  // frame and then into a zero frame, offset by a calibrated bias measured during
  // a levelling window, dead-banded, veto'd by an all-axis rotation gate,
  // integrated into a velocity with three different decay constants depending on
  // whether the axis was driving, coasting or braking, tested for tremor against a
  // second pair of averages, tested for being a passenger of another axis, latched
  // to a direction, capped at a maximum duration, and integrated again into a
  // position. About seventy lines of it, running on every sample.
  //
  // None of it moved a card. nudge_fire wiped the position it produced on every
  // firing — the note there said so in as many words — so the entire apparatus was
  // feeding nothing but the diagram and the lanes, which now read the things that
  // are actually true (where the deck stands, and what the detector sees).
  //
  // And it was in the way in one concrete respect: the old guard returned early
  // until a deviceorientation event had arrived and a zero pose had been taken, so
  // no nudge could fire until the attitude was known. The detector never needed the
  // attitude — that is the whole point of reading the phone's own axes — and it
  // does not wait for it now.

    if (!a || (a.x == null && a.y == null && a.z == null)) return;   // needs the gravity-free stream
    if (!motionOn) return;

    var dt = iv < 1 ? iv : iv / 1000;

    // makes, so it is the one the detector refuses. Pitch and yaw are what an orbit
    // is MADE of and must get through untouched.
    var rr = e.rotationRate || {};
    var twist = Math.abs(rr.alpha || 0);
    spinVeto = twist <= ORBIT_SPIN ? 1 : Math.max(0, 1 - (twist - ORBIT_SPIN) / ORBIT_SPIN);
    nudge_watch(a, dt);

  // smooth_move: chase the model. Driven off the sensor clock, not the paint
  // clock, so a burst of samples with no frame between them still shapes the
  // move the same way — and so the levelling window keeps the picture alive.
  function smooth_step(dt) {
    // nudge_hold: what is drawn is the lattice, plus whatever the finger has
    // dragged. No spring — the nudge's own curve IS the animation, and a spring on
    // top would smear the one thing that has to be identical every time. pos, vel
    // and lead are evidence being gathered for the NEXT bump and are never drawn,
    // so the world holds perfectly still through a gesture and moves when it ends.
    ['x', 'y', 'z'].forEach(function (k) {

      show[k]  = off[k] + nudge_m(k);

    });
  }

  // lane_view — a rolling four seconds, one lane per axis, six lanes stacked.
  // Each sample is [x, y, z, tilt, turn, swirl]: where the world stands on that
  // axis, and how far the phone is turned about it. Each lane fills solid from
  // its own centre, up for positive and down for negative, and carries no line,
  // no label and no number — the shape and the colour are the whole message.
  // crisp_deep: how much bigger than its drawn size the picture is rendered
  var SHK_MAX = 6, shkNow = 1, shkPeak = 1, shkAt = 0;
  var TRACE_N = 240;

  var LANES = [

  // 0 nothing, 1 good, 2 a plain reset, 3 a reset that was part of a burst. The
  // press sets pendEv and the very next frame consumes it, so a rule lands on
  // the chart at the moment it happened and then scrolls away with the data.

    v[3] = pendEv; pendEv = 0;

  // changes; only the drawing is rationed. Six lanes of 240 points redrawn 60
  // times a second is 86,000 path segments a second on top of a 3D-transformed
  // paper, and that is what was taking the browser down. Drawing 8 times a
  // second from every third point is 1/22nd of the work and looks the same,
  // because these are solid blocks, not fine lines.
  var LANE_MS   = 125;      // ms between redraws
  var LANE_STEP = 3;        // draw every Nth point

    if (!traceCtx) return;
    if (now && now - laneLast < LANE_MS) return;
    laneLast = now || 0;
    var W = traceEl.width, H = traceEl.height;
    traceCtx.clearRect(0, 0, W, H);
    var n = LANES.length;
    var pad = 8, gap = 6;
    var lh = (H - pad * 2 - gap * (n - 1)) / n;

    // threshold: half a lane's height is exactly NUDGE_A, so a spike that touches
    // the edge of its lane is a spike that fired. Each lane used to rescale itself
    // to whatever it had seen in the last four seconds, which made a quiet axis's
    // noise look identical to a real nudge on a loud one, and meant no two lanes
    // could be compared — on a page whose detector decides by comparing them.
    var maxv = [1, 1, 1];
    LANES.forEach(function (L, k) {
      var top = pad + k * (lh + gap);
      var mid = top + lh / 2;
      var half = lh / 2 - 1;
      traceCtx.fillStyle = 'rgba(0,0,0,0.035)';
      traceCtx.fillRect(0, top, W, lh);
      traceCtx.beginPath();
      traceCtx.moveTo(0, mid);
      var last = 0;
      for (var i = 0; i < TRACE_N; i += LANE_STEP) {
        var s3 = trace[(traceAt + i) % TRACE_N];
        var x = (i / (TRACE_N - 1)) * W;
        var v = s3 ? s3[L.i] : 0;
        var y = mid - (v / maxv[k]) * half;
        traceCtx.lineTo(x, y);
        last = x;
      }
      traceCtx.lineTo(last, mid);
      traceCtx.closePath();
      traceCtx.fillStyle = L.c;
      traceCtx.globalAlpha = 0.8;
      traceCtx.fill();
      traceCtx.globalAlpha = 1;
    });
    // the rules, drawn last so they read across every lane at once. 1 is the Good
    // button, 2 a plain reset, 3 a burst of them (thick, because that is him
    // saying it went badly wrong) — and 4, new, is the detector firing.
    // nudge_core: that fourth one is the whole point of the chart now. The spike
    // is what he did; the rule is the moment the page believed it. A spike with no
    // rule beside it is a nudge that was missed, and a rule with no spike under it
    // is one that was imagined — which are the only two ways this can be wrong.
    for (var m = 0; m < TRACE_N; m++) {
      var sm = trace[(traceAt + m) % TRACE_N];
      if (!sm || !sm[3]) continue;
      var mx = (m / (TRACE_N - 1)) * W;

      traceCtx.lineWidth = sm[3] === 3 ? 3 : sm[3] === 4 ? 1 : 1.4;

      traceCtx.lineTo(mx, H - pad + 4);
