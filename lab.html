<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>vampsf — lab</title>
<style>
  /* lab_frame — a sketch of the feeling the session list gave us: a fixed
     white frame with a rounded window cut in it, and a stack of full-screen
     cells that slides behind the window. The frame never moves; the cells do,
     and the frame's edge casts a shadow down onto whichever cell is showing.
     Cells: 1 red (top) · 2 white (middle) · 3 blue (bottom). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #ffffff; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation; color-scheme: light;
  }

  /* the white frame is simply the page; the window is what is cut out of it */
  .frame_window {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    bottom: max(14px, env(safe-area-inset-bottom));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    border-radius: 22px;
    overflow: hidden;
    background: #ffffff;
  }
  /* frame_shadow — the white frame casting onto the cell below it: strongest
     from the top edge, present on all four. It rides ABOVE the cells. */
  .frame_shadow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
    box-shadow:
      inset 0 14px 18px -10px rgba(0,0,0,0.45),
      inset 0 -10px 16px -10px rgba(0,0,0,0.30),
      inset 12px 0 16px -12px rgba(0,0,0,0.30),
      inset -12px 0 16px -12px rgba(0,0,0,0.30);
  }

  .track {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    will-change: transform;
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .track.dragging { transition: none; }

  .cell {
    flex: 0 0 100%; height: 100%; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 74px; font-weight: 700; letter-spacing: 0.02em;
    user-select: none; -webkit-user-select: none;
  }
  .cell_no { opacity: 0.16; }
  /* dot_steady — the dot sits dead centre of every card. When the phone's
     motion sensors are running it is pushed the OTHER way from every wobble,
     so it holds still in the room while the screen jiggles around it. */
  .pin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .pin_dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: currentColor; box-shadow: 0 2px 6px rgba(0,0,0,0.30);
    transform: translate3d(var(--sx, 0px), var(--sy, 0px), 0);
  }
  .cell_2 .pin_dot { background: #1d1d1f; }
  .cell_1 { background: #d7263d; color: #ffffff; }
  .cell_2 { background: #ffffff; color: #1d1d1f; }
  .cell_3 { background: #1350c4; color: #ffffff; }

  /* which cell you are on, in the frame itself */
  .dots {
    position: fixed; right: max(20px, calc(env(safe-area-inset-right) + 6px));
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 7px; z-index: 6;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1d1d1f; opacity: 0.18; }
  .dot.on { opacity: 0.75; }

  .back_btn {
    position: fixed; z-index: 6;
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    left: max(26px, calc(env(safe-area-inset-left) + 14px));
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.86); color: #1d1d1f;
    border: none; border-radius: 999px; padding: 9px 15px 9px 12px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    touch-action: manipulation;
  }
  .back_btn:active { transform: scale(0.96); }
  .hint {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    font-size: 14px; font-weight: 600; color: #1d1d1f;
    background: rgba(255,255,255,0.86); border-radius: 999px; padding: 7px 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    pointer-events: none; transition: opacity 0.4s;
  }
  .motion_btn {
    position: fixed; z-index: 6;
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    right: max(26px, calc(env(safe-area-inset-right) + 14px));
    background: rgba(255,255,255,0.86); color: #1d1d1f;
    border: none; border-radius: 999px; padding: 9px 15px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    touch-action: manipulation;
  }
  .motion_btn:active { transform: scale(0.96); }
  .motion_btn.on { background: rgba(29,29,31,0.82); color: #ffffff; }
  .readout {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    top: max(72px, calc(env(safe-area-inset-top) + 60px));
    background: rgba(255,255,255,0.86); color: #1d1d1f;
    border-radius: 12px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    white-space: pre; line-height: 1.5; text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none;
  }

  /* gesture_lab — hold the button, do the move, let go. Everything the phone's
     sensors say during the hold is kept, tagged with the name you typed, so
     the two of us can look at real numbers instead of guessing. */
  .gest_bar {
    position: fixed; z-index: 7; left: 50%; transform: translateX(-50%);
    bottom: max(20px, calc(env(safe-area-inset-bottom) + 10px));
    width: min(340px, calc(100vw - 60px));
    background: rgba(255,255,255,0.92); border-radius: 18px; padding: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.28);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; gap: 8px;
    touch-action: manipulation;
  }
  #g_name {
    width: 100%; border: 1px solid rgba(0,0,0,0.14); border-radius: 10px;
    padding: 9px 11px; font: inherit; font-size: 15px; color: #1d1d1f;
    background: #ffffff; outline: none;
  }
  #g_name:focus { border-color: #1350c4; }
  .g_rec {
    width: 100%; border: none; border-radius: 12px; padding: 14px;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    background: #d7263d; color: #ffffff; touch-action: none;
    box-shadow: 0 3px 10px rgba(215,38,61,0.35);
  }
  .g_rec.recording { background: #1d1d1f; animation: g_pulse 1s ease-in-out infinite; }
  @keyframes g_pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
  /* take_clear: the bar says which of the four states it is in, in colour and
     in words — idle, recording, sending, sent-and-ready. */
  .g_status { font-size: 12px; color: rgba(0,0,0,0.55); text-align: center; min-height: 16px;
              display: flex; align-items: center; justify-content: center; gap: 6px; }
  .g_led { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,0.22); flex: 0 0 auto; }
  .gest_bar.is_rec  .g_led { background: #d7263d; animation: g_pulse 1s ease-in-out infinite; }
  .gest_bar.is_send .g_led { background: #e0a800; animation: g_pulse 0.7s ease-in-out infinite; }
  .gest_bar.is_sent .g_led { background: #16a34a; }
  .gest_bar.is_warn .g_led { background: #e0a800; }
  .gest_bar.is_rec  { box-shadow: 0 6px 20px rgba(215,38,61,0.45); }
  .gest_bar.is_sent { box-shadow: 0 6px 20px rgba(22,163,74,0.40); }
  .gest_bar.is_sent #g_msg { color: #16a34a; font-weight: 700; }
  .gest_bar.is_rec  #g_msg { color: #d7263d; font-weight: 700; }
  .g_recent { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 0; }
  .g_chip { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.55);
            background: rgba(0,0,0,0.06); border-radius: 999px; padding: 3px 8px; }
  .g_row { display: flex; align-items: center; gap: 8px; }
  .g_small {
    flex: 1 1 auto; border: none; border-radius: 9px; padding: 8px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: rgba(0,0,0,0.06); color: #1d1d1f; touch-action: manipulation;
  }
  .g_count { flex: 0 0 auto; font-size: 12px; color: rgba(0,0,0,0.45); min-width: 46px; text-align: right; }
</style>
</head>
<body>

<div class="frame_window" id="frame">
  <div class="track" id="track">
    <div class="cell cell_1"><span class="cell_no">1</span><span class="pin"><span class="pin_dot"></span></span></div>
    <div class="cell cell_2"><span class="cell_no">2</span><span class="pin"><span class="pin_dot"></span></span></div>
    <div class="cell cell_3"><span class="cell_no">3</span><span class="pin"><span class="pin_dot"></span></span></div>
  </div>
  <div class="frame_shadow"></div>
</div>

<div class="dots" id="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
<button class="back_btn" id="back_btn">&#8249; Admin</button>
<div class="hint" id="hint">swipe up / down</div>

<div class="gest_bar" id="gest_bar">
  <input id="g_name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
         placeholder="name the pair — raise / lower">
  <button id="g_rec" class="g_rec">Hold to record</button>
  <div class="g_status" id="g_status"><span class="g_led" id="g_led"></span><span id="g_msg">hold the button, do the gesture, let go</span></div>
  <div class="g_recent" id="g_recent"></div>
  <div class="g_row">
    <button id="g_copy" class="g_small">Copy last take</button>
    <button id="g_send" class="g_small">Send takes</button>
    <span class="g_count" id="g_count"></span>
  </div>
</div>
<button class="motion_btn" id="motion_btn">Steady the dot</button>
<div class="readout" id="readout" hidden></div>

<script>
  var N = 3;
  var idx = 0;                 // which cell is showing
  var track = document.getElementById('track');
  var frame = document.getElementById('frame');
  var dots  = document.getElementById('dots');
  var hint  = document.getElementById('hint');

  function cell_h() { return frame.clientHeight || window.innerHeight; }
  function paint(px) {
    track.style.transform = 'translate3d(0,' + px + 'px,0)';
  }
  function go(i, animate) {
    idx = Math.max(0, Math.min(N - 1, i));
    track.classList.toggle('dragging', !animate);
    paint(-idx * cell_h());
    Array.prototype.forEach.call(dots.children, function (d, k) {
      d.classList.toggle('on', k === idx);
    });
    if (idx > 0 && hint) { hint.style.opacity = '0'; }
  }
  go(0, false);
  requestAnimationFrame(function () { track.classList.remove('dragging'); });
  window.addEventListener('resize', function () { go(idx, false); requestAnimationFrame(function () { track.classList.remove('dragging'); }); });

  // ---- drag: the cells follow the finger, then snap to the nearest page ----
  // close_light's lesson: a short push is enough — 40px, or 8% of the cell.
  function snap_px() { return Math.min(40, cell_h() * 0.08); }
  var drag = null;
  function start(y) { drag = { y0: y, base: -idx * cell_h(), active: false }; }
  function move(y) {
    if (!drag) return false;
    var dy = y - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) < 5) return false;
      drag.active = true;
      track.classList.add('dragging');
    }
    var px = drag.base + dy;
    // rubber-band at the two ends
    var min = -(N - 1) * cell_h(), max = 0;
    if (px > max) px = max + (px - max) * 0.35;
    if (px < min) px = min + (px - min) * 0.35;
    paint(px);
    return true;
  }
  function end() {
    if (!drag) return;
    var wasActive = drag.active;
    var moved = (parseFloat(track.style.transform.replace(/.*,\s*(-?[\d.]+)px,.*/, '$1')) || 0) - drag.base;
    drag = null;
    track.classList.remove('dragging');
    if (!wasActive) { go(idx, true); return; }
    if (moved <= -snap_px()) go(idx + 1, true);        // pushed up -> next page
    else if (moved >= snap_px()) go(idx - 1, true);    // pulled down -> previous
    else go(idx, true);
  }

  window.addEventListener('touchstart', function (e) {
    if (e.target.closest && e.target.closest('.back_btn, .motion_btn, .gest_bar')) return;
    if (e.touches.length === 1) start(e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (move(e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', end, { passive: true });

  // mouse + keyboard, so the same thing works on a laptop
  var mouseDown = false;
  window.addEventListener('mousedown', function (e) {
    if (e.target.closest && e.target.closest('.back_btn, .motion_btn, .gest_bar')) return;
    mouseDown = true; start(e.clientY);
  });
  window.addEventListener('mousemove', function (e) { if (mouseDown) move(e.clientY); });
  window.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; end(); } });
  var wheelLock = 0;
  window.addEventListener('wheel', function (e) {
    var now = Date.now();
    if (now - wheelLock < 420) return;
    if (Math.abs(e.deltaY) < 8) return;
    wheelLock = now;
    go(idx + (e.deltaY > 0 ? 1 : -1), true);
  }, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(idx + 1, true); }
    if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); go(idx - 1, true); }
  });

  document.getElementById('back_btn').addEventListener('click', function () {
    window.location.href = 'admin.html';
  });

  // ---- dot_steady: hold the dot still while the phone moves ----
  // Two sensors, two jobs.
  //   tilt  — deviceorientation beta (nose up/down) and gamma (roll left/right),
  //           measured against the angles at the moment you press the button.
  //           This is what actually keeps a dot planted while you wave a phone
  //           around: most 'movement' of a hand-held phone is rotation.
  //   shift — devicemotion acceleration, high-passed and double-integrated,
  //           with a hard leak. It catches the quick jiggle of a hand trying to
  //           hold still. It CANNOT track real travel: two integrations of a
  //           noisy accelerometer drift within a second or two, so the leak
  //           pulls it back to zero on purpose. Tilt is the honest signal;
  //           shift is the jiggle-canceller on top of it.
  var PX_PER_DEG = 7;        // how hard tilt pushes the dot back
  var SHIFT_GAIN = 900;      // metres of integrated shift -> px
  var VEL_LEAK   = 0.86;     // per frame: kills accelerometer drift
  var POS_LEAK   = 0.90;     // per frame: walks the correction back to centre
  var HP         = 0.92;     // high-pass on acceleration (removes gravity + bias)

  var motionOn = false;
  var ref = null;            // { beta, gamma } captured when you start
  var tilt = { b: 0, g: 0 };
  var acc  = { x: 0, y: 0 }; // high-passed acceleration
  var accLP = { x: 0, y: 0 };
  var vel  = { x: 0, y: 0 };
  var pos  = { x: 0, y: 0 };
  var lastT = 0;
  var motionBtn = document.getElementById('motion_btn');
  var readout   = document.getElementById('readout');

  function on_orientation(e) {
    if (e.beta == null && e.gamma == null) return;
    if (!ref) ref = { beta: e.beta || 0, gamma: e.gamma || 0 };
    tilt.b = (e.beta || 0) - ref.beta;      // + = top of the phone tipped away
    tilt.g = (e.gamma || 0) - ref.gamma;    // + = right edge dipped
  }
  function on_motion(e) {
    var a = e.acceleration;
    if (!a || (a.x == null && a.y == null)) {
      a = e.accelerationIncludingGravity;
      if (!a) return;
      // no gravity-free stream: subtract a slow average, which IS gravity
      accLP.x = accLP.x * 0.95 + (a.x || 0) * 0.05;
      accLP.y = accLP.y * 0.95 + (a.y || 0) * 0.05;
      acc.x = (a.x || 0) - accLP.x;
      acc.y = (a.y || 0) - accLP.y;
    } else {
      acc.x = acc.x * (1 - HP) + (a.x || 0) * HP;
      acc.y = acc.y * (1 - HP) + (a.y || 0) * HP;
    }
  }
  function steady_frame(now) {
    if (!motionOn) return;
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
    lastT = now;
    // shift: integrate, then leak both velocity and position back to zero
    vel.x = (vel.x + acc.x * dt) * VEL_LEAK;
    vel.y = (vel.y + acc.y * dt) * VEL_LEAK;
    pos.x = (pos.x + vel.x * dt) * POS_LEAK;
    pos.y = (pos.y + vel.y * dt) * POS_LEAK;
    // screen x is the phone's x; screen y is the phone's -y
    var sx = -(tilt.g * PX_PER_DEG) - pos.x * SHIFT_GAIN;
    var sy =  (tilt.b * PX_PER_DEG) + pos.y * SHIFT_GAIN;
    var lim = Math.min(frame.clientWidth, frame.clientHeight) * 0.42;
    sx = Math.max(-lim, Math.min(lim, sx));
    sy = Math.max(-lim, Math.min(lim, sy));
    document.documentElement.style.setProperty('--sx', sx.toFixed(1) + 'px');
    document.documentElement.style.setProperty('--sy', sy.toFixed(1) + 'px');
    if (readout) {
      readout.textContent =
        'up/down  ' + (tilt.b >= 0 ? '+' : '') + tilt.b.toFixed(0) + '\u00b0' +
        '   side  ' + (tilt.g >= 0 ? '+' : '') + tilt.g.toFixed(0) + '\u00b0' +
        '\njiggle  ' + Math.round(Math.hypot(pos.x, pos.y) * 1000) + ' mm';
    }
    requestAnimationFrame(steady_frame);
  }
  function start_steady() {
    motionOn = true; ref = null; lastT = 0;
    vel = { x: 0, y: 0 }; pos = { x: 0, y: 0 };
    window.addEventListener('deviceorientation', on_orientation);
    window.addEventListener('devicemotion', on_motion);
    motionBtn.classList.add('on');
    motionBtn.textContent = 'Recentre';
    if (readout) readout.hidden = false;
    if (hint) hint.style.opacity = '0';
    requestAnimationFrame(steady_frame);
  }
  function recentre() { ref = null; vel = { x: 0, y: 0 }; pos = { x: 0, y: 0 }; }

  motionBtn.addEventListener('click', function () {
    if (motionOn) { recentre(); return; }
    var need = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
    var need2 = (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function');
    if (!need && !need2) {
      if (!window.DeviceOrientationEvent && !window.DeviceMotionEvent) {
        motionBtn.textContent = 'No sensors here';
        return;
      }
      start_steady(); return;
    }
    // iOS: permission must be asked for inside this tap
    var asks = [];
    if (need)  asks.push(DeviceOrientationEvent.requestPermission());
    if (need2) asks.push(DeviceMotionEvent.requestPermission());
    Promise.all(asks).then(function (res) {
      if (res.every(function (r) { return r === 'granted'; })) start_steady();
      else motionBtn.textContent = 'Motion blocked';
    }).catch(function () { motionBtn.textContent = 'Motion blocked'; });
  });

  // ---- gesture_lab: hold to record every sensor the phone will give ----
  // A take is { name, ts, ms, samples: [...] }. Each sample carries whatever
  // arrived at that instant: orientation (alpha/beta/gamma), acceleration with
  // and without gravity, and rotation rate. Angles are also stored relative to
  // the pose at the START of the hold, since that is the frame he cares about.
  var GEST_KEY = 'vampjam_gestures';
  var SYNC_URL = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var REPO_RAW = 'https://raw.githubusercontent.com/mPulseMedia/vampjam/main/';
  var API_URL  = 'https://api.github.com/repos/mPulseMedia/vampjam/contents/lab_gestures.json?ref=main';

  var gName = document.getElementById('g_name');
  var gRec  = document.getElementById('g_rec');
  var gBar  = document.getElementById('gest_bar');
  var gMsg  = document.getElementById('g_msg');
  var gRecent = document.getElementById('g_recent');
  // take_clear: one place decides what the bar looks like and says
  var gStat = {
    set textContent(v) { say('idle', v); },
    get textContent() { return gMsg.textContent; }
  };
  function say(state, text) {
    gBar.classList.remove('is_rec', 'is_send', 'is_sent', 'is_warn');
    if (state !== 'idle') gBar.classList.add('is_' + state);
    gMsg.textContent = text;
  }
  function paint_recent() {
    var list = gest_get().slice(-4);
    gRecent.innerHTML = list.map(function (t2) {
      return '<span class="g_chip">' + String(t2.name || 'unnamed').replace(/[<>&]/g, '') +
             ' · ' + (t2.ms / 1000).toFixed(1) + 's</span>';
    }).join('');
  }
  var gCopy = document.getElementById('g_copy');
  var gSend = document.getElementById('g_send');
  var gCount= document.getElementById('g_count');

  var recording = false, take = null, gRef = null;
  var live = { ori: null, acc: null, accG: null, rot: null };

  function gest_get() {
    try { var a = JSON.parse(localStorage.getItem(GEST_KEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function gest_put(list) {
    try { localStorage.setItem(GEST_KEY, JSON.stringify(list.slice(-40))); } catch (e) {}
    if (gCount) gCount.textContent = list.length + ' take' + (list.length === 1 ? '' : 's');
    if (typeof paint_recent === 'function') paint_recent();
  }
  gest_put(gest_get());

  function grab_orientation(e) {
    // browsers fire one empty event when you subscribe — it must not become
    // the reference pose, or every angle afterwards is measured from zero
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    live.ori = [r3(e.alpha), r3(e.beta), r3(e.gamma)];
    if (recording && !gRef) gRef = { a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0 };
  }
  function grab_motion(e) {
    var a = e.acceleration || {}, ag = e.accelerationIncludingGravity || {}, rr = e.rotationRate || {};
    if (a.x == null && ag.x == null && rr.alpha == null) return;   // empty priming event
    live.acc  = [r3(a.x), r3(a.y), r3(a.z)];
    live.accG = [r3(ag.x), r3(ag.y), r3(ag.z)];
    live.rot  = [r3(rr.alpha), r3(rr.beta), r3(rr.gamma)];
    if (recording) push_sample(e.interval || null);
  }
  function r3(v) { return (v == null) ? null : Math.round(v * 1000) / 1000; }
  function push_sample(interval) {
    if (!take) return;
    var t = Date.now() - take.ts;
    var o = live.ori || [null, null, null];
    var rel = gRef && live.ori
      ? [r3(ang(o[0] - gRef.a)), r3(o[1] - gRef.b), r3(o[2] - gRef.g)]
      : [null, null, null];
    take.samples.push({ t: t, ori: o, rel: rel, acc: live.acc, accG: live.accG, rot: live.rot, iv: interval });
  }
  function ang(d) { while (d > 180) d -= 360; while (d < -180) d += 360; return d; }

  var sensorsWired = false;
  function sensors_live(after) {
    // once wired, stay wired: asking again would make every later hold start
    // one tick late (and a very short tap could then start after it ended)
    if (sensorsWired) { after(true); return; }
    var needO = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
    var needM = (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function');
    function wire() {
      sensorsWired = true;
      window.addEventListener('deviceorientation', grab_orientation);
      window.addEventListener('devicemotion', grab_motion);
      after(true);
    }
    if (!needO && !needM) { wire(); return; }
    var asks = [];
    if (needO) asks.push(DeviceOrientationEvent.requestPermission());
    if (needM) asks.push(DeviceMotionEvent.requestPermission());
    Promise.all(asks).then(function (res) {
      if (res.every(function (r) { return r === 'granted'; })) wire();
      else after(false);
    }).catch(function () { after(false); });
  }

  var wantRec = false;
  function rec_start() {
    if (recording) return;
    wantRec = true;
    say('rec', 'starting…');
    sensors_live(function (ok) {
      if (!ok) { wantRec = false; say('warn', 'motion permission was refused'); return; }
      if (!wantRec) return;         // released before permission came back
      recording = true; gRef = null;
      take = { name: (gName.value || 'unnamed').trim(), ts: Date.now(), ms: 0, samples: [] };
      gRec.classList.add('recording');
      gRec.textContent = 'recording  0.0s';
      say('rec', 'recording "' + take.name + '" — do the move, then let go');
      clearInterval(recTimer);
      recTimer = setInterval(function () {
        if (!recording || !take) return;
        gRec.textContent = 'recording  ' + ((Date.now() - take.ts) / 1000).toFixed(1) + 's';
      }, 100);
    });
  }
  function rec_stop() {
    wantRec = false;
    if (!recording) return;
    recording = false;
    clearInterval(recTimer);
    gRec.classList.remove('recording');
    gRec.textContent = 'Hold to record';
    if (!take) return;
    take.ms = Date.now() - take.ts;
    var done = take;
    var list = gest_get();
    list.push(done);
    gest_put(list);
    take = null;
    if (!done.samples.length) {
      say('warn', 'nothing came from the sensors — check motion permission');
      return;
    }
    say('send', 'saving "' + done.name + '" · ' + done.samples.length + ' samples · ' +
                (done.ms / 1000).toFixed(1) + 's …');
    // take_clear: clear the field and raise the keyboard NOW, while we are
    // still inside the touch that released the button — iOS only opens the
    // keyboard from inside a gesture. The send finishes in the background.
    gName.value = '';
    try { gName.focus({ preventScroll: true }); } catch (e) { gName.focus(); }
    send_takes(true, done);
  }

  // hold semantics on touch AND mouse; pointer events would double-fire on iOS
  gRec.addEventListener('touchstart', function (e) { e.preventDefault(); rec_start(); }, { passive: false });
  gRec.addEventListener('touchend',   function (e) { e.preventDefault(); rec_stop(); },  { passive: false });
  gRec.addEventListener('touchcancel', rec_stop);
  gRec.addEventListener('mousedown', function (e) { e.preventDefault(); rec_start(); });
  window.addEventListener('mouseup', function () { if (recording) rec_stop(); });

  gCopy.addEventListener('click', function () {
    var list = gest_get();
    if (!list.length) { gStat.textContent = 'nothing recorded yet'; return; }
    var txt = JSON.stringify(list[list.length - 1]);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { gStat.textContent = 'last take copied'; },
                                              function () { gStat.textContent = 'copy failed'; });
    } else { gStat.textContent = 'copy not available here'; }
  });

  // send_takes — park them in the repo (lab_gestures.json) so they can be read
  // from the other side without any copy and paste
  var sending = false;
  var recTimer = 0;
  function send_takes(quiet, done) {
    var list = gest_get();
    if (!list.length || sending) return;
    sending = true;
    say('send', done ? ('sending "' + done.name + '" …') : 'sending…');
    fetch(API_URL + '&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (have) {
        if (!Array.isArray(have)) have = [];
        var seen = {};
        have.forEach(function (t) { if (t && t.ts) seen[t.ts] = true; });
        var add = list.filter(function (t) { return !seen[t.ts]; });
        if (!add.length) { sending = false; say('sent', 'already sent — name the next one'); return; }
        var out = have.concat(add).slice(-60);
        return fetch(SYNC_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: 'lab_gestures.json', content: JSON.stringify(out, null, 1),
                                 message: 'gesture ' + (add[add.length - 1].name || 'take') })
        }).then(function (r) {
          sending = false;
          if (r.ok) say('sent', '✓ sent ' + add.length + ' take' + (add.length === 1 ? '' : 's') +
                                ' — type the next name');
          else say('warn', 'send failed — kept on this phone, goes with the next one');
        });
      })
      .catch(function () { sending = false; say('warn', 'send failed — kept on this phone, goes with the next one'); });
  }
  gSend.addEventListener('click', function () { send_takes(false); });
  paint_recent();

  // test hook
  window.__lab = {
    go: go,
    at: function () { return idx; },
    steady: function () { start_steady(); },
    rec: function (on) { on ? rec_start() : rec_stop(); },
    takes: function () { return gest_get(); },
    feed: function (beta, gamma) {
      on_orientation({ beta: beta, gamma: gamma });
      return { sx: getComputedStyle(document.documentElement).getPropertyValue('--sx'),
               sy: getComputedStyle(document.documentElement).getPropertyValue('--sy') };
    }
  };
</script>
</body>
</html>
