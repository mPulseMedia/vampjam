<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vamp jam</title>
<script src="sessions.js"></script>
<script>
  // Index just opens the session you were last on, else the most recent one.
  (function () {
    var sessions = window.VAMPJAM_SESSIONS || [];
    var last = null;
    try { last = localStorage.getItem('vampjam_last_session'); } catch (e) {}
    var valid = last && sessions.some(function (s) { return s.page === last; });
    var target = valid ? last : (sessions.length ? sessions[sessions.length - 1].page : 'admin.html');
    location.replace(target);
  })();
</script>
</head>
<body style="background:#ffffff"></body>
</html>
