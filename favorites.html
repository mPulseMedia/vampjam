<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vampsf — Favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=3">
<script src="theme.js?v=2"></script>
<script src="sessions.js?v=129"></script>
<script src="drawer.js?v=141"></script>
<style>  /* tap_zoom: no double-tap zoom on a mis-hit; pinch still works */
  html, body { touch-action: manipulation; }
  h1 { text-align: center; font-size: 22px; margin: 6px 0 14px; }
  .now_name { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; margin: 8px 0 2px; }
  details.about_page { background: var(--panel); border-radius: 12px; padding: 10px 14px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  details.about_page summary { cursor: pointer; color: var(--fg); font-weight: 600; }
  details.about_page code { background: var(--panel_2); padding: 1px 6px; border-radius: 4px; color: var(--fg); }

  .sticky_player {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg); padding-top: 8px; padding-bottom: 4px;
    transition: box-shadow 0.2s;
  }
  /* the white control layer casts a shadow ONLY onto the darker highlight list
     below it, only while scrolling (gradient strip = no side or white bleed) */
  .sticky_player::after {
    content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.16), rgba(0,0,0,0));
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .sticky_player.scrolled::after { opacity: 1; }

  @media (max-width: 480px) {
    .ctrl_row { justify-content: space-between; gap: 4px; }
    .ctrl_btn { width: 48px; height: 48px; }
    .ctrl_btn.small { width: 48px; height: 48px; }
    .ctrl_btn.play_btn { width: 76px; height: 76px; font-size: 38px; }
  }

  /* ---- de-emphasis: make selected chrome less prominent ---- */
  .time_row #dur_time, .time_row span:not(#now_time) { color: var(--muted); opacity: 0.4; font-weight: 400; }
  .tag_time { color: var(--muted); opacity: 0.5; font-weight: 400; }
  .tag_time:hover { opacity: 0.9; }
  button.ghost.tag_fav { color: var(--muted); background: transparent; opacity: 0.3; }
  button.ghost.tag_fav:hover { opacity: 0.8; }
  button.ghost.tag_fav.on { color: var(--accent); opacity: 1; }
  button.ghost.tag_del { color: var(--muted); background: transparent; opacity: 0.3; }
  button.ghost.tag_del:hover { opacity: 0.95; color: var(--danger, #c75450); background: var(--panel_2); }
  #audio_edit_btn { color: var(--muted); background: transparent; opacity: 0.4; }
  #audio_edit_btn:hover { opacity: 0.9; }
  .sort_toggle { background: transparent; opacity: 0.5; }
  .sort_toggle:hover { opacity: 0.95; }
  .sort_toggle button.active { background: var(--panel_3); color: var(--muted); font-weight: 500; }


  /* simple player: big play + a plain seek bar (no fisheye here) */
  .fav_player { display: flex; align-items: center; justify-content: center; margin: 4px 0 10px; }
  .fav_play {
    width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: var(--on_accent, #fff);
    display: flex; align-items: center; justify-content: center; font-size: 38px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  }
  .fav_bar { width: 100%; height: 9px; background: var(--panel_3); border-radius: 4px; position: relative; cursor: pointer; margin: 6px 0 4px; }
  .fav_fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; width: 0; pointer-events: none; }
  .time_row { display: flex; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  .time_row #now_time { color: var(--accent); font-weight: 600; }

  .fav_list { background: var(--panel); border-radius: 14px; overflow: hidden; padding: 0 0 14px; margin: 6px 0 24px; box-shadow: inset 0 6px 7px -5px rgba(0,0,0,0.20); }
  .fav_row { display: flex; align-items: center; gap: 7px; padding: 8px 12px; min-height: 56px; }
  .fav_row.playing { background: var(--row_active); }
  .fav_play_sm { flex: 0 0 auto; background: none; border: none; color: var(--accent); font-size: 17px; padding: 8px; cursor: pointer; line-height: 0; }
  /* title_lap — the title may run into the FIRST QUARTER of the session name.
     A favourite is its title; the session it came from is context. So the title
     borrows the first 25% of that column (10.5% of the row, the column being 42%)
     and sits above it, and where it does overrun it fades out rather than
     colliding — an ellipsis on top of a date reads as a bug, a dissolve reads as
     "there is more of this". The session name keeps its own ellipsis and stays
     right-aligned, so its END — the part that tells you which session — is never
     the part that goes. */
  .fav_main {
    flex: 1 1 60px; min-width: 0;
    /* title_lap: -10% of the row against a column fixed at 40% of the same row is
       a quarter of the column — but the row's 7px flex gap sits between them and
       eats the first 7px of any negative margin, so it has to be paid back or the
       lap comes out at 20% instead of 25%. Measured, not assumed. */
    margin-right: calc(-10% - 7px); position: relative; z-index: 1;
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 34px), transparent 100%);
  }
  /* fav_jump — the session name on the right of a row is a LINK to that session,
     landing on this very highlight. It sits where a thumb already rests, so it
     gets a real tap target and something to press against rather than reading as
     a caption you happen to be able to hit. */
  a.fav_sess {
    /* title_lap: the overlap is built from these two numbers rather than guessed.
       The column is FIXED at 40% of the row (it used to size to its text, which
       is why a percentage lap could not be trusted), and the title's -10% is
       measured against that same row: 10/40 is a quarter, exactly, at any screen
       size. Its right edge does not move, so the END of the name — the part that
       tells you which session — stays put. */
    flex: 0 0 40%;
    color: var(--muted); font-size: 12px; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    /* lap_cross — the date gives way over exactly the band the title laps into.
       Fading only the title left the two interleaving at half strength, which
       reads as a rendering fault; fading BOTH across the same quarter makes it a
       crossfade — the title dissolving out as the date dissolves in — and either
       one is legible on its own ground. */
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 25%);
            mask-image: linear-gradient(to right, transparent 0, #000 25%);
    text-decoration: none; border-bottom: 1px dotted var(--panel_3);
    padding: 10px 2px; margin: -10px 0; cursor: pointer;
  }
  a.fav_sess:hover { color: var(--fg); border-bottom-color: var(--muted); }
  a.fav_sess:active { color: var(--accent); }
  .fav_name {
    /* title_lap: no ellipsis on the title any more — the fade is the ellipsis */
    width: 100%; background: transparent; border: none; outline: none;
    text-overflow: clip;
    color: var(--fg); font: inherit; font-size: 17px; padding: 2px 0;
    border-bottom: 1px dashed transparent;
  }
  .fav_name:focus { border-bottom-color: var(--panel_3); }
  .fav_time { display: none; }   /* fav_time_hide: timestamps off the favorite rows for now */
  .fav_heart { flex: 0 0 auto; background: none; border: none; color: var(--accent); padding: 8px; cursor: pointer; line-height: 0; }
  /* fav_share — muted like every other share on the site; the accent is reserved
     for the heart, which is the one thing on the row that carries state */
  .fav_share_btn { color: var(--muted); }
  .fav_share_btn:hover { color: var(--fg); }
  .empty { text-align: center; color: var(--muted); padding: 26px 12px; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 86vw; }
  #toast.show { opacity: 0.94; }

  button.ghost { font-size: 17px; }
  /* icon_big: favourites rows match the session rows — triangle 26 -> 35,
     heart / share / x 17 -> 23 */
  .fav_play_sm { font-size: 35px !important; }
  .fav_row button.ghost { font-size: 23px; }
  /* row_rule: hairline between favourite rows */
  .fav_row + .fav_row { border-top: 1px solid var(--panel_3); }
  .tag_numbers, .num_strip { height: 20px !important; }

  /* nav_room — the two header controls own the top band outright, so the
     wordmark starts below it instead of running under them. It goes on the
     header, not on the wordmark: several pages set the wordmark's own margin
     with a two-class rule that would win.
     ui_grammar: the old .nav_left pill's styles came out with it. Admin and
     r2_setup still carry their own copies for their own back links; nothing
     here referenced these any more. */
</style>
</head>
<body>

<div class="session_drawer" id="session_drawer"><div class="jam_menu"></div></div>

<header class="brand" style="position:relative;">
<button class="nav_cass" id="page_sessions" aria-label="Sessions" title="Sessions"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><circle cx="8" cy="12" r="2.2"/><circle cx="16" cy="12" r="2.2"/><path d="M10.2 12h3.6"/><path d="M7 18.5l1.6-2.5h6.8l1.6 2.5"/></svg></button>
<button class="nav_share" id="page_share" aria-label="Copy link to this page" title="Copy link to this page"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V4"/><path d="M8.5 7.3L12 3.8l3.5 3.5"/><path d="M6.6 11H6a1.6 1.6 0 0 0-1.6 1.6v5.8A1.6 1.6 0 0 0 6 20h12a1.6 1.6 0 0 0 1.6-1.6v-5.8A1.6 1.6 0 0 0 18 11h-.6"/></svg></button>
  <div class="wordmark">vamp<span class="wordmark_sf">SF</span></div>
</header>

<h1>Favorites</h1>

<div class="fav_player">
  <button class="fav_play" id="play_btn" aria-label="Play">&#9654;</button>
</div>
<div class="now_name" id="now_name"></div>
<div class="fav_bar" id="fav_bar"><div class="fav_fill" id="fav_fill"></div></div>
<div class="time_row"><span id="now_time">0:00</span><span>/</span><span id="dur_time">--:--</span></div>

<div class="fav_list" id="fav_list"><div class="empty">Gathering your favorites…</div></div>

<audio id="player" preload="metadata"></audio>
<div id="toast"></div>

<script>
(function () {
  var SYNC_URL = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var RAW_BASE = 'https://raw.githubusercontent.com/mPulseMedia/vampjam/main/';

  var player  = document.getElementById('player'),
      playBtn = document.getElementById('play_btn'),
      favBar  = document.getElementById('fav_bar'),
      favFill = document.getElementById('fav_fill'),
      nowTime = document.getElementById('now_time'),
      durTime = document.getElementById('dur_time'),
      nowName = document.getElementById('now_name'),
      listEl  = document.getElementById('fav_list'),
      toastEl = document.getElementById('toast');

  // row_size: 29, the one size every icon in a list row wears now — the session
  // list, the highlight list and this one. These two were 19 and 17, then 24, and
  // a favourite row is a list row like any other.
  var ICON_HEART = '<svg viewBox="0 0 24 24" width="29" height="29" fill="currentColor" aria-hidden="true"><path d="M12 20.3l-1.2-1.1C6.2 15.1 3.2 12.4 3.2 9.1c0-2.6 2-4.6 4.6-4.6 1.5 0 2.9.7 3.8 1.8.9-1.1 2.3-1.8 3.8-1.8 2.6 0 4.6 2 4.6 4.6 0 3.3-3 6-7.6 10.1L12 20.3z"/></svg>';
  var ICON_PLAY  = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4.2" height="16" rx="1"/><rect x="13.8" y="4" width="4.2" height="16" rx="1"/></svg>';

  // the same recent-heart-flip memory the session pages use (stale raw reads
  // can lag minutes behind; this device's own flips must show instantly)
  function fav_over_all() {
    try {
      var m = JSON.parse(localStorage.getItem('vampjam_favov') || '{}');
      var cut = Date.now() - 10 * 60 * 1000, out = {};
      for (var k in m) if (m[k] && m[k].ts > cut) out[k] = m[k];
      return out;
    } catch (e) { return {}; }
  }
  function fav_over_set(id, v) {
    try {
      var m = fav_over_all();
      m[id] = { v: !!v, ts: Date.now() };
      localStorage.setItem('vampjam_favov', JSON.stringify(m));
    } catch (e) {}
  }
  function apply_overrides(src) {
    var ovs = fav_over_all();
    (src.data.tags || []).forEach(function (t) {
      if (t && ovs[t.id]) { if (ovs[t.id].v) t.fav = true; else delete t.fav; }
    });
  }

  // fav_share — the same share icon and the same slot the session pages give every
  // highlight row: to the left of the heart. A favourite IS a highlight, so it gets
  // the button its own row would have back in its session, and what it copies is
  // the deep link fav_jump already builds — session, tag id and time — so what
  // someone else opens is this exact moment, not the top of the session.
  var ICON_SHARE = '<svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V4"/><path d="M8.5 7.3L12 3.8l3.5 3.5"/><path d="M6.6 11H6a1.6 1.6 0 0 0-1.6 1.6v5.8A1.6 1.6 0 0 0 6 20h12a1.6 1.6 0 0 0 1.6-1.6v-5.8A1.6 1.6 0 0 0 18 11h-.6"/></svg>';
  function fav_link(f) {
    return new URL(f.src.page + '?tag=' + encodeURIComponent(f.tag.id) +
                   '&t=' + Math.max(0, Math.round(f.tag.t)), window.location.href).href;
  }
  function copy_to_clipboard(text) {
    try { if (navigator.clipboard) { navigator.clipboard.writeText(text); return; } } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) {}
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  window.toast = toast;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss);
  }

  // ---- gather every favorite across every session ----
  // favorites are DERIVED: the source of truth stays each session's own file,
  // so edits here write back to the original and every view agrees
  var sources = [];   // { jsonPath, page, name, data }
  var favs = [];      // { src, tag }
  var current = null; // the fav currently loaded in the player

  function session_sources() {
    var out = (window.VAMPJAM_SESSIONS || []).map(function (s) {
      return { jsonPath: s.page.replace(/\.html$/, '.json'), page: s.page, name: s.date + ' ' + s.name, date: s.date };
    });
    return fetch(RAW_BASE + 'sessions_auto.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (arr) {
        (Array.isArray(arr) ? arr : []).forEach(function (a) {
          var id = (a.page.split('p=')[1] || '');
          if (id) out.push({ jsonPath: id + '.json', page: a.page, name: a.name, date: a.date || '' });
        });
        return out;
      });
  }

  function load_all() {
    return session_sources().then(function (srcs) {
      return Promise.all(srcs.map(function (src) {
        return fetch(RAW_BASE + src.jsonPath + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (data) {
            if (!data || data.deleted) return null;
            src.data = data;
            return src;
          });
      }));
    }).then(function (loaded) {
      sources = loaded.filter(Boolean);
      favs = [];
      sources.forEach(function (src) {
        apply_overrides(src);   // this device's recent flips beat stale reads
        (src.data.tags || []).forEach(function (t) {
          if (t && t.fav) favs.push({ src: src, tag: t });
        });
      });
      // newest sessions first; within a session, moments in time order
      favs.sort(function (a, b) {
        var da = a.src.date || '', db = b.src.date || '';
        if (da !== db) return da < db ? 1 : -1;
        return a.tag.t - b.tag.t;
      });
      render();
    });
  }

  function write_back(src, message) {
    return fetch(SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: src.jsonPath, content: JSON.stringify(src.data, null, 2) + '\n', message: message })
    }).then(function (r) { if (!r.ok) throw new Error('sync ' + r.status); return r.json(); });
  }

  function render() {
    listEl.innerHTML = '';
    if (!favs.length) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'No favorites yet — tap the heart on any moment.';
      listEl.appendChild(d);
      return;
    }
    favs.forEach(function (f) {
      var row = document.createElement('div');
      row.className = 'fav_row' + (current === f ? ' playing' : '');

      var pb = document.createElement('button');
      pb.className = 'fav_play_sm';
      pb.innerHTML = (current === f && !player.paused) ? ICON_PAUSE : ICON_PLAY;
      pb.addEventListener('click', function () {
        if (current === f && !player.paused) { player.pause(); render(); return; }
        play_fav(f);
      });
      row.appendChild(pb);

      var main = document.createElement('div');
      main.className = 'fav_main';
      var name = document.createElement('input');
      name.className = 'fav_name';
      name.type = 'text';
      name.value = f.tag.label || '';
      name.addEventListener('change', function () {
        f.tag.label = name.value.trim();
        write_back(f.src, 'rename fav ' + (f.tag.label || f.tag.id))
          .then(function () { toast('Saved'); })
          .catch(function () { toast('Save failed — try again'); });
      });
      main.appendChild(name);
      row.appendChild(main);

      // session name rides the same line as the title, tucked in by the heart —
      // fav_jump: and it takes you there, to this highlight. The tag's OWN id
      // goes on the link, not just its time, so it still lands on the right one
      // after the highlight has been nudged or a neighbour has moved next to it.
      var sess = document.createElement('a');
      sess.className = 'fav_sess';
      sess.textContent = f.src.name;
      sess.title = 'Open this moment in ' + f.src.name;
      sess.href = f.src.page + '?tag=' + encodeURIComponent(f.tag.id) +
                  '&t=' + Math.max(0, Math.round(f.tag.t));
      // the row itself plays; the link navigates. Say so, so a tap on the name
      // never also starts the audio here on its way out.
      sess.addEventListener('click', function (e) { e.stopPropagation(); });
      row.appendChild(sess);

      var tm = document.createElement('span');
      tm.className = 'fav_time';
      tm.textContent = fmt(f.tag.t);
      row.appendChild(tm);

      var sb = document.createElement('button');
      sb.className = 'fav_heart fav_share_btn';
      sb.title = 'Copy a link to this moment';
      sb.setAttribute('aria-label', 'Copy a link to this moment');
      sb.innerHTML = ICON_SHARE;
      sb.addEventListener('click', function () {
        var url = fav_link(f);
        copy_to_clipboard(url);
        toast('Link copied: ' + url);
      });
      row.appendChild(sb);

      var hb = document.createElement('button');
      hb.className = 'fav_heart';
      hb.title = 'Remove from favorites';
      hb.innerHTML = ICON_HEART;
      hb.addEventListener('click', function () {
        delete f.tag.fav;
        fav_over_set(f.tag.id, false);   // session pages see the un-heart instantly too
        apply_overrides(f.src);          // never write a stale fav state back
        favs = favs.filter(function (x) { return x !== f; });
        render();
        write_back(f.src, 'unfav ' + (f.tag.label || f.tag.id))
          .then(function () { toast('Removed from favorites'); })
          .catch(function () { toast('Save failed — try again'); });
      });
      row.appendChild(hb);

      listEl.appendChild(row);
    });
  }

  // ---- play a favorite: load its session's audio, jump to the moment ----
  function play_fav(f) {
    var url = f.src.data.audio && f.src.data.audio.url;
    if (!url) { toast('This session has no audio bound yet'); return; }
    var seek = function () {
      try { player.currentTime = f.tag.t; } catch (e) {}
      player.play().catch(function () {});
      render();
    };
    if (current && current.src === f.src) {
      current = f; seek();
    } else {
      current = f;
      nowName.textContent = f.src.name;
      player.src = url;
      player.addEventListener('loadedmetadata', function once() {
        player.removeEventListener('loadedmetadata', once);
        seek();
      });
      player.load();
    }
    render();
  }

  playBtn.addEventListener('click', function () {
    if (!current) { if (favs.length) play_fav(favs[0]); return; }
    if (player.paused) player.play().catch(function () {}); else player.pause();
  });
  player.addEventListener('play', function () { playBtn.innerHTML = ICON_PAUSE ? '\u23F8' : '||'; playBtn.textContent = ''; playBtn.innerHTML = ICON_PAUSE; render(); });
  player.addEventListener('pause', function () { playBtn.innerHTML = ICON_PLAY; render(); });
  player.addEventListener('timeupdate', function () {
    nowTime.textContent = fmt(player.currentTime);
    durTime.textContent = fmt(player.duration);
    if (isFinite(player.duration) && player.duration > 0) {
      favFill.style.width = (player.currentTime / player.duration * 100) + '%';
    }
  });
  favBar.addEventListener('click', function (e) {
    if (!isFinite(player.duration) || !player.duration) return;
    var r = favBar.getBoundingClientRect();
    player.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * player.duration;
  });

  load_all();
})();
</script>
