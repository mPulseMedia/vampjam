<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vampsf — Favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=16">
<script src="theme.js?v=2"></script>
<script src="sessions.js?v=129"></script>
<script src="drawer.js?v=159"></script>
<style>  /* tap_zoom: no double-tap zoom on a mis-hit; pinch still works */
  html, body { touch-action: manipulation; }
  /* fav_match — the session page's h1: same size, weight and margins, so the
     control row below it starts on the same line as it does over there. */
  h1 { text-align: center; font-size: 17px; margin: 14px 0 4px; font-weight: 600;
       min-height: 33px; line-height: 33px; }
  .now_name { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; margin: 7px 0 12px; }
  details.about_page { background: var(--panel); border-radius: 12px; padding: 10px 14px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  details.about_page summary { cursor: pointer; color: var(--fg); font-weight: 600; }
  details.about_page code { background: var(--panel_2); padding: 1px 6px; border-radius: 4px; color: var(--fg); }


  /* ctrl_edge, the session page's numbers exactly. NOTE the element selectors:
     this block sits ABOVE the base rules in this file, so at equal specificity
     the base rule would win and the circles would never shrink. */
  @media (max-width: 480px) {
    div.ctrl_row { justify-content: space-between; gap: 3px; margin-left: 0; margin-right: 0; }
    button.ctrl_btn { width: 44px; height: 44px; }
    button.ctrl_btn.small { width: 44px; height: 44px; }
    button.fav_play { width: 70px; height: 70px; font-size: 44px; }
  }

  /* ---- de-emphasis: make selected chrome less prominent ---- */
  .tag_time { color: var(--muted); opacity: 0.5; font-weight: 400; }
  .tag_time:hover { opacity: 0.9; }
  button.ghost.tag_fav { color: var(--muted); background: transparent; opacity: 0.3; }
  button.ghost.tag_fav:hover { opacity: 0.8; }
  button.ghost.tag_fav.on { color: var(--accent); opacity: 1; }
  button.ghost.tag_del { color: var(--muted); background: transparent; opacity: 0.3; }
  button.ghost.tag_del:hover { opacity: 0.95; color: var(--danger, #c75450); background: var(--panel_2); }
  #audio_edit_btn { color: var(--muted); background: transparent; opacity: 0.4; }
  #audio_edit_btn:hover { opacity: 0.9; }
  .sort_toggle { background: transparent; opacity: 0.5; }
  .sort_toggle:hover { opacity: 0.95; }
  .sort_toggle button.active { background: var(--panel_3); color: var(--muted); font-weight: 500; }


  /* fav_match — the session page's control row, and the same circles in it.
     Favourites has a real player, so these are not decoration: they seek. */
  /* 12px above: on the session page that space is .sticky_player's padding.
     There is no sticky player here (its CSS lived in this file for an element
     the page never had — removed), so the row carries it. */
  .ctrl_row { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 16px 0 14px; }
  .ctrl_btn {
    appearance: none; -webkit-appearance: none; border: 0;
    background: var(--panel_2); color: var(--accent); font: inherit; font-weight: 400;
    border-radius: 50%; width: 52px; height: 52px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; padding: 0; white-space: nowrap;
    transition: background-color 0.12s, transform 0.06s;
  }
  .ctrl_btn .cn { font-size: 17px; font-weight: 400; }
  .ctrl_btn .cu { font-size: 11px; font-weight: 400; }
  .ctrl_btn:hover  { background: var(--panel_3); }
  .ctrl_btn:active { background: var(--accent_2); color: var(--on_accent, #0b0d0f); transform: scale(0.95); }
  .ctrl_btn.small  { width: 52px; height: 52px; font-size: 12px; }
  .ctrl_btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* the play button keeps its own class — the page's JS and the one_size
     exclusion both know it by that name — and takes the play button's size. */
  .fav_play {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    flex: 0 0 auto;
    background: var(--accent); color: var(--on_accent, #fff);
    display: flex; align-items: center; justify-content: center; font-size: 56px;
    box-shadow: none;
  }
  .fav_play:hover  { background: var(--accent_hover, #f0c97a); }
  .fav_play:active { background: var(--accent_active, #c89943); transform: scale(0.95); }
  .fav_bar { width: 100%; height: 9px; background: var(--panel_3); border-radius: 4px; position: relative; cursor: pointer; margin: 6px 0 4px; }
  .fav_fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; width: 0; pointer-events: none; }

  /* list_tight — 14px of padding under the last row plus 24px of margin read as
     the last row being taller than the others. Same trim as the session list. */
  .fav_list { background: var(--panel); border-radius: 14px; overflow: hidden; padding: 0; margin: 6px 0 12px; box-shadow: inset 0 6px 7px -5px rgba(0,0,0,0.20); }
  /* cass_link — six things on a 390px row, and the title is the one that carries
     meaning, so the icons give up what they can: a tighter gap and less padding
     hand it about 20px back. If it is still short, the share is the one to lose. */
  .fav_row { display: flex; align-items: center; gap: 4px; padding: 8px 10px; min-height: 56px; }
  .fav_row.playing { background: var(--row_active); }
  .fav_play_sm { flex: 0 0 auto; background: none; border: none; color: var(--accent); font-size: 17px; padding: 8px; cursor: pointer; line-height: 0; }
  /* title_lap — the title may run into the FIRST QUARTER of the session name.
     A favourite is its title; the session it came from is context. So the title
     borrows the first 25% of that column (10.5% of the row, the column being 42%)
     and sits above it, and where it does overrun it fades out rather than
     colliding — an ellipsis on top of a date reads as a bug, a dissolve reads as
     "there is more of this". The session name keeps its own ellipsis and stays
     right-aligned, so its END — the part that tells you which session — is never
     the part that goes. */
  .fav_main {
    /* cass_link — min-width:0 is what actually lets the title shrink. A flex item
       defaults to min-width:auto, which means "never smaller than my content", so
       the field kept its full width and ran under the date. The crossfade mask
       had been hiding that collision; with the mask gone it was just overlap. */
    flex: 1 1 auto; min-width: 0; overflow: hidden;
  }
  /* fav_jump — the session name on the right of a row is a LINK to that session,
     landing on this very highlight. It sits where a thumb already rests, so it
     gets a real tap target and something to press against rather than reading as
     a caption you happen to be able to hit. */
  /* lap_hit — the cassette shares the line with the title's field, so it keeps
     the z-index the date used to share with it. The lap is a LOOK; the hit
     belongs to whatever is on top. */
  a.fav_sess { position: relative; z-index: 2; }
  /* cass_link — the session is a cassette, not its name. The name was a strip of
     text that mostly repeated ("Sound Union" eight times down the list) and was
     ellipsised into uselessness anyway; the icon says the same thing in a fixed
     29px and is a proper target. It still carries the tag id and the timestamp,
     so it opens the session ON this highlight. Its whole column of width, and
     the title_lap crossfade that column existed for, go with the text. */
  a.fav_sess {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    min-width: 34px; min-height: 41px;
    color: var(--muted); text-decoration: none; border-bottom: none;
    padding: 0; margin: 0;
  }
  a.fav_sess svg { width: 24px; height: 24px; }
  a.fav_sess:hover { color: var(--fg); }
  a.fav_sess:active { color: var(--accent); }
  .fav_name {
    /* cass_link: nothing laps over the title any more, so it ellipsises honestly
       again rather than dissolving into a column that is no longer there */
    width: 100%; background: transparent; border: none; outline: none;
    overflow: hidden; text-overflow: ellipsis;
    color: var(--fg); font: inherit; font-size: 17px; padding: 2px 0;
    border-bottom: 1px dashed transparent;
  }
  .fav_name:focus { border-bottom-color: var(--panel_3); }
  .fav_name[readonly] { cursor: pointer; }
  .fav_time { display: none; }   /* fav_time_hide: timestamps off the favorite rows for now */
  .fav_heart { flex: 0 0 auto; background: none; border: none; color: var(--accent); padding: 6px; cursor: pointer; line-height: 0; }
  /* fav_share — muted like every other share on the site; the accent is reserved
     for the heart, which is the one thing on the row that carries state */
  .fav_share_btn { color: var(--muted); }
  .fav_share_btn:hover { color: var(--fg); }
  .empty { text-align: center; color: var(--muted); padding: 26px 12px; }

  /* ---- fav_sort: manual order ---------------------------------------------
     In this mode every row loses the three things that ACT on it — play, share,
     heart — and gains one grip. That is the point: while you are arranging, a
     mis-tap should move a row, never play one or un-favourite one. */
  .sort_bar { display: flex; justify-content: center; padding: 14px 12px 30px; }
  .sort_btn {
    background: transparent; border: 1px solid var(--panel_3); color: var(--muted);
    border-radius: 999px; padding: 9px 18px; font-size: 14px; cursor: pointer;
  }
  .sort_btn.on { background: var(--accent); border-color: var(--accent); color: var(--on_accent, #fff); }
  .fav_grip {
    flex: 0 0 auto; background: none; border: none; color: var(--muted);
    padding: 8px 10px; cursor: grab; line-height: 0; font-size: 22px;
    /* grip_hit — a real target. line-height:0 on a glyph button gives a 16px-tall
       box, which is a thing you miss on a phone while trying to drag it. */
    min-height: 41px; min-width: 41px; display: flex; align-items: center; justify-content: center;
    /* the browser must not claim the gesture, or the page scrolls instead of the row moving */
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  /* grip_only — the grip is the handle and the ONLY handle. The row is inert:
     a finger anywhere else on it still scrolls the list, which is what you need
     when the row you are dragging towards is off screen. touch-action:none lives
     on the grip alone, so only the grip's own gesture is taken from the browser. */
  .fav_list.sorting .fav_row * { pointer-events: none; }
  .fav_list.sorting .fav_row .fav_grip { pointer-events: auto; }
  .fav_list.sorting .fav_row { background: var(--bg); }
  .fav_row.dragging {
    position: relative; z-index: 5; opacity: 0.96;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18); border-radius: 10px;
  }
  .fav_row.shifting { transition: transform 0.14s ease; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 86vw; }
  #toast.show { opacity: 0.94; }

  button.ghost { font-size: 17px; }
  /* icon_big: favourites rows match the session rows — triangle 26 -> 35,
     heart / share / x 17 -> 23 */
  .fav_play_sm { font-size: 35px !important; }
  .fav_row button.ghost { font-size: 23px; }
  /* icon_snug — measured drawing-edge to drawing-edge, which is what the eye
     sees: 15px cassette-to-share and 16px share-to-heart. -3px puts them at 12
     and 13, which is the 20%. (-4 was tried first, off a padding-based estimate;
     padding is the wrong proxy here — the cassette has none and centres its svg
     by flex — and it overshot to 27%.) A negative margin, not less padding: the
     glyphs move, the tap targets keep their full width. .fav_time between them
     is display:none, so the share really is the cassette's next neighbour. */
  .fav_row .fav_heart { margin-left: -3px; }
  /* row_rule: hairline between favourite rows */
  .fav_row + .fav_row { border-top: 1px solid var(--panel_3); }
  .tag_numbers, .num_strip { height: 20px !important; }

  /* nav_room — the two header controls own the top band outright, so the
     wordmark starts below it instead of running under them. It goes on the
     header, not on the wordmark: several pages set the wordmark's own margin
     with a two-class rule that would win.
     ui_grammar: the old .nav_left pill's styles came out with it. Admin and
     r2_setup still carry their own copies for their own back links; nothing
     here referenced these any more. */
</style>
</head>
<body>

<div class="session_drawer" id="session_drawer"><div class="jam_menu"></div></div>

<header class="brand" style="position:relative;">
<button class="nav_cass" id="page_sessions" aria-label="Sessions" title="Sessions"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><circle cx="8" cy="12" r="2.2"/><circle cx="16" cy="12" r="2.2"/><path d="M10.2 12h3.6"/><path d="M7 18.5l1.6-2.5h6.8l1.6 2.5"/></svg></button>
<button class="nav_share" id="page_share" aria-label="Copy link to this page" title="Copy link to this page"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V4"/><path d="M8.5 7.3L12 3.8l3.5 3.5"/><path d="M6.6 11H6a1.6 1.6 0 0 0-1.6 1.6v5.8A1.6 1.6 0 0 0 6 20h12a1.6 1.6 0 0 0 1.6-1.6v-5.8A1.6 1.6 0 0 0 18 11h-.6"/></svg></button>
  <div class="wordmark">vamp<span class="wordmark_sf">SF</span></div>
</header>

<h1>Favorites</h1>

<div class="ctrl_row" id="transport_row">
  <button class="ctrl_btn" id="back_120" title="Back 2 min"><span class="cu">&minus;</span><span class="cn">2</span><span class="cu">m</span></button>
  <button class="ctrl_btn" id="back_15"  title="Back 15 sec"><span class="cu">&minus;</span><span class="cn">15</span><span class="cu">s</span></button>
  <button class="ctrl_btn small" id="back_5" title="Back 5 sec"><span class="cu">&minus;</span><span class="cn">5</span><span class="cu">s</span></button>
  <!-- play_same — no glyph in the markup. The session page fills this button
       with the same SVG at boot; this one shipped a literal U+25B6 and only
       swapped it on the first play/pause event, so until you pressed it you
       were looking at a font’s triangle where every other play button on the
       site has a drawing. Same em size, much more ink — which is why it read
       as too big. -->
  <button class="fav_play" id="play_btn" aria-label="Play"></button>
  <button class="ctrl_btn small" id="fwd_5"  title="Forward 5 sec"><span class="cu">+</span><span class="cn">5</span><span class="cu">s</span></button>
  <button class="ctrl_btn" id="fwd_15"  title="Forward 15 sec"><span class="cu">+</span><span class="cn">15</span><span class="cu">s</span></button>
  <button class="ctrl_btn" id="fwd_120" title="Forward 2 min"><span class="cu">+</span><span class="cn">2</span><span class="cu">m</span></button>
</div>
<!-- name_under — the timeline first, the name beneath it. The name answers
     "what am I listening to", which is a question you ask about a thing that is
     already playing, so it reads better as a caption under the bar than as a
     heading over it. And the clock is gone: on a page of favourites every row is
     a moment someone chose, not a position to be measured. -->
<div class="fav_bar" id="fav_bar"><div class="fav_fill" id="fav_fill"></div></div>
<div class="now_name" id="now_name"></div>

<div class="fav_list" id="fav_list"><div class="empty">Gathering your favorites…</div></div>

<!-- fav_sort — the way into manual order. It sits under the list because that is
     what it acts on, and it is the only control on the page that changes what
     the rows ARE rather than what they play. -->
<div class="sort_bar"><button class="sort_btn" id="sort_btn" aria-pressed="false">Reorder</button></div>

<audio id="player" preload="metadata"></audio>
<div id="toast"></div>

<script>
(function () {
  var SYNC_URL = 'https://vampjam-sync.crimson-dust-a18d.workers.dev/';
  var RAW_BASE = 'https://raw.githubusercontent.com/mPulseMedia/vampjam/main/';

  var player  = document.getElementById('player'),
      playBtn = document.getElementById('play_btn'),
      favBar  = document.getElementById('fav_bar'),
      favFill = document.getElementById('fav_fill'),
      nowName = document.getElementById('now_name'),
      listEl  = document.getElementById('fav_list'),
      toastEl = document.getElementById('toast');

  // row_size: 29, the one size every icon in a list row wears now — the session
  // list, the highlight list and this one. These two were 19 and 17, then 24, and
  // a favourite row is a list row like any other.
  var ICON_HEART = '<svg viewBox="0 0 24 24" width="29" height="29" fill="currentColor" aria-hidden="true"><path d="M12 20.3l-1.2-1.1C6.2 15.1 3.2 12.4 3.2 9.1c0-2.6 2-4.6 4.6-4.6 1.5 0 2.9.7 3.8 1.8.9-1.1 2.3-1.8 3.8-1.8 2.6 0 4.6 2 4.6 4.6 0 3.3-3 6-7.6 10.1L12 20.3z"/></svg>';
  var ICON_PLAY  = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4.2" height="16" rx="1"/><rect x="13.8" y="4" width="4.2" height="16" rx="1"/></svg>';

  // the same recent-heart-flip memory the session pages use (stale raw reads
  // can lag minutes behind; this device's own flips must show instantly)
  function fav_over_all() {
    try {
      var m = JSON.parse(localStorage.getItem('vampjam_favov') || '{}');
      var cut = Date.now() - 10 * 60 * 1000, out = {};
      for (var k in m) if (m[k] && m[k].ts > cut) out[k] = m[k];
      return out;
    } catch (e) { return {}; }
  }
  function fav_over_set(id, v) {
    try {
      var m = fav_over_all();
      m[id] = { v: !!v, ts: Date.now() };
      localStorage.setItem('vampjam_favov', JSON.stringify(m));
    } catch (e) {}
  }
  function apply_overrides(src) {
    var ovs = fav_over_all();
    (src.data.tags || []).forEach(function (t) {
      if (t && ovs[t.id]) { if (ovs[t.id].v) t.fav = true; else delete t.fav; }
    });
  }

  // fav_share — the same share icon and the same slot the session pages give every
  // highlight row: to the left of the heart. A favourite IS a highlight, so it gets
  // the button its own row would have back in its session, and what it copies is
  // the deep link fav_jump already builds — session, tag id and time — so what
  // someone else opens is this exact moment, not the top of the session.
  var ICON_SHARE = '<svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V4"/><path d="M8.5 7.3L12 3.8l3.5 3.5"/><path d="M6.6 11H6a1.6 1.6 0 0 0-1.6 1.6v5.8A1.6 1.6 0 0 0 6 20h12a1.6 1.6 0 0 0 1.6-1.6v-5.8A1.6 1.6 0 0 0 18 11h-.6"/></svg>';
  // fav_here — the share on a favourite hands out a link back to THIS page, at
  // this highlight. It used to point at the session page, which is a different
  // promise: the cassette on the row already goes there, and goes to this moment
  // inside it. Sharing a favourite should land you among the favourites, on the
  // one you were shown — otherwise the two controls on the row say the same thing
  // and the list you were sent to look at is nowhere in sight.
  function fav_link(f) {
    return new URL('favorites.html?tag=' + encodeURIComponent(f.tag.id),
                   window.location.href).href;
  }
  function copy_to_clipboard(text) {
    try { if (navigator.clipboard) { navigator.clipboard.writeText(text); return; } } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) {}
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  window.toast = toast;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss);
  }

  // ---- gather every favorite across every session ----
  // favorites are DERIVED: the source of truth stays each session's own file,
  // so edits here write back to the original and every view agrees
  var sources = [];   // { jsonPath, page, name, data }
  var favs = [];      // { src, tag }
  var current = null; // the fav currently loaded in the player

  function session_sources() {
    var out = (window.VAMPJAM_SESSIONS || []).map(function (s) {
      return { jsonPath: s.page.replace(/\.html$/, '.json'), page: s.page, name: s.date + ' ' + s.name, date: s.date };
    });
    return fetch(RAW_BASE + 'sessions_auto.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (arr) {
        (Array.isArray(arr) ? arr : []).forEach(function (a) {
          var id = (a.page.split('p=')[1] || '');
          if (id) out.push({ jsonPath: id + '.json', page: a.page, name: a.name, date: a.date || '' });
        });
        return out;
      });
  }

  function load_all() {
    return session_sources().then(function (srcs) {
      return Promise.all(srcs.map(function (src) {
        return fetch(RAW_BASE + src.jsonPath + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (data) {
            if (!data || data.deleted) return null;
            src.data = data;
            return src;
          });
      }));
    }).then(function (loaded) {
      sources = loaded.filter(Boolean);
      favs = [];
      sources.forEach(function (src) {
        apply_overrides(src);   // this device's recent flips beat stale reads
        (src.data.tags || []).forEach(function (t) {
          if (t && t.fav) favs.push({ src: src, tag: t });
        });
      });
      // newest sessions first; within a session, moments in time order
      favs.sort(function (a, b) {
        var da = a.src.date || '', db = b.src.date || '';
        if (da !== db) return da < db ? 1 : -1;
        return a.tag.t - b.tag.t;
      });
      order_apply();          // fav_sort: his arrangement wins over the date sort
      render();
      land_on_tag();          // fav_here: a shared link names a highlight on THIS page
    });
  }

  function write_back(src, message) {
    return fetch(SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: src.jsonPath, content: JSON.stringify(src.data, null, 2) + '\n', message: message })
    }).then(function (r) { if (!r.ok) throw new Error('sync ' + r.status); return r.json(); });
  }

  // date_gone — the date and its four formats are OUT, two builds after going in.
  // He asked for a narrow cycling date and then asked for it gone; both are fair
  // and the second is the better row. The cassette says which session, the title
  // says which moment, and a favourite IS a moment — the day it fell on was the
  // least of the three. Removed rather than hidden, because a display nothing
  // displays is a thing the next reader has to work out the deadness of. The key
  // it used, vampjam_fav_datefmt, is simply abandoned in his browser.

  // ---- fav_sort: the order he arranged, and where it lives -----------------
  // Favourites come from several sessions, so the order cannot live in any one
  // session's json — a tag's own `order` means its place within ITS session and
  // the session pages use it. This is a separate list of tag ids, held in
  // localStorage for instant effect and mirrored to fav_order.json through the
  // same worker everything else writes through, so it follows him to a phone.
  var ORDER_KEY = 'vampjam_fav_order';
  var ORDER_FILE = 'fav_order.json';
  var favOrder = [];          // tag ids, the order he put them in
  var orderDirty = false;
  try { favOrder = JSON.parse(localStorage.getItem(ORDER_KEY) || '[]') || []; } catch (e) { favOrder = []; }
  function order_local() {
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(favOrder)); } catch (e) {}
  }
  // order_flush — the remote write. keepalive so it survives the page going away,
  // which is the whole of "changes should register even if I don't exit the mode".
  function order_flush(beacon) {
    if (!orderDirty) return;
    orderDirty = false;
    var body = JSON.stringify({ path: ORDER_FILE,
      content: JSON.stringify({ order: favOrder }, null, 2) + '\n',
      message: 'reorder favorites' });
    try {
      if (beacon && navigator.sendBeacon) {
        navigator.sendBeacon(SYNC_URL, new Blob([body], { type: 'application/json' }));
        return;
      }
      fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: body, keepalive: true }).catch(function () {});
    } catch (e) {}
  }
  var orderTimer = 0;
  function order_save() {
    order_local();
    orderDirty = true;
    clearTimeout(orderTimer);
    orderTimer = setTimeout(function () { order_flush(false); }, 900);
  }
  // leave_safe — navigating away, backgrounding the tab, or closing it all count
  // as done. pagehide is the one iOS actually fires.
  window.addEventListener('pagehide', function () { clearTimeout(orderTimer); order_flush(true); });
  window.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { clearTimeout(orderTimer); order_flush(true); }
  });
  // order_apply — his arrangement first, in his order; anything he has never
  // arranged (a favourite hearted since) goes on TOP, newest first, so a new
  // favourite is never buried at the bottom of a long manual list.
  function order_apply() {
    if (!favOrder.length) return;
    var at = {};
    favOrder.forEach(function (id, i) { at[id] = i; });
    var known = [], fresh = [];
    favs.forEach(function (f) { (at[f.tag.id] === undefined ? fresh : known).push(f); });
    known.sort(function (a, b) { return at[a.tag.id] - at[b.tag.id]; });
    favs = fresh.concat(known);
  }
  function order_take() {          // read the list back out of the DOM after a drop
    favOrder = Array.prototype.map.call(listEl.querySelectorAll('.fav_row'),
      function (r) { return r.dataset.favId; }).filter(Boolean);
    var by = {};
    favs.forEach(function (f) { by[f.tag.id] = f; });
    favs = favOrder.map(function (id) { return by[id]; }).filter(Boolean);
    order_save();
  }

  // grip_wire — the drag. Pointer events, not HTML5 drag-and-drop, because iOS
  // Safari does not fire dragstart at all: on a phone the native API simply does
  // not exist, so the only thing that works is doing it by hand.
  //
  // The dragged row is lifted with a transform and the rows it passes are moved
  // in the DOM as it crosses their midpoints, so what you see IS the new order
  // and the drop has nothing left to compute — it just reads the list back.
  // grip_only — the surface is the GRIP, not the row. Taken back: a whole-row
  // drag means a finger put down to scroll the list picks a row up instead, and
  // there is no way to scroll to a destination that is off screen. The grip is
  // small on purpose — it is the one place that means "move me".
  function grip_wire(grip, row) {
    grip.addEventListener('pointerdown', function (e) {
      if (!sorting) return;
      e.preventDefault();
      try { grip.setPointerCapture(e.pointerId); } catch (eC) {}
      var startY = e.clientY, dy = 0;
      var h = row.getBoundingClientRect().height;
      row.classList.add('dragging');

      function move(ev) {
        dy = ev.clientY - startY;
        row.style.transform = 'translateY(' + dy + 'px)';
        var mid = row.getBoundingClientRect().top + h / 2;
        var prev = row.previousElementSibling, next = row.nextElementSibling;
        // crossed the row above: put ourselves before it
        if (prev && mid < prev.getBoundingClientRect().top + prev.getBoundingClientRect().height / 2) {
          startY -= prev.getBoundingClientRect().height;
          row.style.transform = 'translateY(' + (ev.clientY - startY) + 'px)';
          listEl.insertBefore(row, prev);
        // crossed the row below: put ourselves after it
        } else if (next && mid > next.getBoundingClientRect().top + next.getBoundingClientRect().height / 2) {
          startY += next.getBoundingClientRect().height;
          row.style.transform = 'translateY(' + (ev.clientY - startY) + 'px)';
          listEl.insertBefore(next, row);
        }
      }
      function up(ev) {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        try { grip.releasePointerCapture(ev.pointerId); } catch (eR) {}
        row.classList.remove('dragging');
        row.style.transform = '';
        // a tap on the grip that goes nowhere is not a reorder — no write, no toast.
        if (Math.abs(dy) > 2) { order_take(); toast('Order saved'); }
      }
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });
  }

  var sorting = false;
  var sortBtn = document.getElementById('sort_btn');
  function sort_set(on) {
    sorting = on;
    sortBtn.classList.toggle('on', on);
    sortBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    sortBtn.textContent = on ? 'Done' : 'Reorder';
    listEl.classList.toggle('sorting', on);
    if (!on) { clearTimeout(orderTimer); order_flush(false); }
    render();
  }
  sortBtn.addEventListener('click', function () { sort_set(!sorting); });

  var suppressNameFocusUntil = 0;   // tap_select: the ghost click after a touch
  // cass_link — lifted verbatim from the session rows and the nav button, because
  // it must read as the same object in all three places
  var ICON_CASS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><circle cx="8" cy="12" r="2.2"/>' +
    '<circle cx="16" cy="12" r="2.2"/><path d="M10.2 12h3.6"/>' +
    '<path d="M7 18.5l1.6-2.5h6.8l1.6 2.5"/></svg>';

  // fav_here — arriving on ?tag=<id>. Select it, put it on screen, and try to
  // play. The try is likely to be refused: a browser will not start audio without
  // a gesture, and following a link is not one. That is fine and it is why the
  // row is SELECTED first — the refusal leaves you looking straight at the right
  // row with the play button one tap away, rather than at the top of a list of
  // fifty wondering which one you were sent.
  function land_on_tag() {
    var want;
    try { want = new URLSearchParams(location.search).get('tag'); } catch (e) { return; }
    if (!want) return;
    var f = null;
    for (var i = 0; i < favs.length; i++) if (favs[i].tag.id === want) { f = favs[i]; break; }
    if (!f) {
      // un-hearted since the link was made. Say so rather than silently doing
      // nothing, because from the outside those look identical.
      toast('That moment is no longer a favorite');
      return;
    }
    current = f;
    render();
    var row = listEl.querySelector('[data-fav-id="' + (window.CSS && CSS.escape ? CSS.escape(want) : want) + '"]');
    if (row) { try { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e2) { row.scrollIntoView(); } }
    play_fav(f);
  }

  function render() {
    listEl.innerHTML = '';
    if (!favs.length) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'No favorites yet — tap the heart on any moment.';
      listEl.appendChild(d);
      return;
    }
    favs.forEach(function (f) {
      var row = document.createElement('div');
      row.className = 'fav_row' + (current === f ? ' playing' : '');
      row.dataset.favId = f.tag.id;          // fav_sort: how the DOM says who it is

      if (sorting) {
        // fav_sort — one grip, and none of the three buttons that act on the row.
        // While you are arranging, a mis-tap should move a row, never play one or
        // un-favourite one.
        var gr = document.createElement('button');
        gr.className = 'fav_grip';
        gr.setAttribute('aria-label', 'Drag to reorder');
        gr.innerHTML = '&#9776;';            // ☰
        grip_wire(gr, row);
        row.appendChild(gr);

        var gm = document.createElement('div');
        gm.className = 'fav_main';
        var gn = document.createElement('input');
        gn.className = 'fav_name';
        gn.type = 'text'; gn.readOnly = true; gn.value = f.tag.label || '';
        gm.appendChild(gn);
        row.appendChild(gm);

        listEl.appendChild(row);
        return;
      }

      var pb = document.createElement('button');
      pb.className = 'fav_play_sm';
      pb.innerHTML = (current === f && !player.paused) ? ICON_PAUSE : ICON_PLAY;
      pb.addEventListener('click', function () {
        if (current === f && !player.paused) { player.pause(); render(); return; }
        play_fav(f);
      });
      row.appendChild(pb);

      var main = document.createElement('div');
      main.className = 'fav_main';
      var name = document.createElement('input');
      name.className = 'fav_name';
      name.type = 'text';
      name.value = f.tag.label || '';
      // tap_select — copied from the session pages, because it is the same
      // gesture on the same kind of row. A tap on a row that is NOT the current
      // one plays it and does not open the keyboard; the row is then current, so
      // the NEXT tap lands on an editable field and iOS opens the keyboard by
      // itself. iOS decides by the state at the START of the tap, which is why
      // readOnly is set at render rather than inside the handler.
      name.readOnly = (current !== f);
      var nameTouched = false;
      function nameTap() {
        if (!name.readOnly) return;          // current: the native tap is the edit
        suppressNameFocusUntil = Date.now() + 450;
        play_fav(f);                         // otherwise select + play; render unlocks it
      }
      name.addEventListener('pointerdown', function (e) {
        if (Date.now() < suppressNameFocusUntil) e.preventDefault();   // no focus from the ghost click
      });
      name.addEventListener('focus', function () {
        if (Date.now() < suppressNameFocusUntil) { try { name.blur(); } catch (e) {} }
      });
      name.addEventListener('touchend', function () { nameTouched = true; nameTap(); });
      name.addEventListener('click', function () {
        if (nameTouched) { nameTouched = false; return; }   // touch already handled it
        nameTap();
      });
      name.addEventListener('blur', function () { name.readOnly = (current !== f); });
      name.addEventListener('change', function () {
        f.tag.label = name.value.trim();
        write_back(f.src, 'rename fav ' + (f.tag.label || f.tag.id))
          .then(function () { toast('Saved'); })
          .catch(function () { toast('Save failed — try again'); });
      });
      main.appendChild(name);
      row.appendChild(main);

      // session name rides the same line as the title, tucked in by the heart —
      // fav_jump: and it takes you there, to this highlight. The tag's OWN id
      // goes on the link, not just its time, so it still lands on the right one
      // after the highlight has been nudged or a neighbour has moved next to it.
      var sess = document.createElement('a');
      sess.className = 'fav_sess';
      // cass_link — the same cassette the session rows and the nav wear, so the
      // eye reads it as "a session" without being told. No text: the name
      // repeated down the whole list and told you nothing the date did not.
      sess.innerHTML = ICON_CASS;
      sess.setAttribute('aria-label', 'Open this moment in ' + f.src.name);
      sess.title = 'Open this moment in ' + f.src.name;
      sess.href = f.src.page + '?tag=' + encodeURIComponent(f.tag.id) +
                  '&t=' + Math.max(0, Math.round(f.tag.t));
      // the row itself plays; the link navigates. Say so, so a tap on the name
      // never also starts the audio here on its way out.
      sess.addEventListener('click', function (e) { e.stopPropagation(); });
      row.appendChild(sess);

      var tm = document.createElement('span');
      tm.className = 'fav_time';
      tm.textContent = fmt(f.tag.t);
      row.appendChild(tm);

      var sb = document.createElement('button');
      sb.className = 'fav_heart fav_share_btn';
      sb.title = 'Copy a link to this moment';
      sb.setAttribute('aria-label', 'Copy a link to this moment');
      sb.innerHTML = ICON_SHARE;
      sb.addEventListener('click', function () {
        var url = fav_link(f);
        copy_to_clipboard(url);
        toast('Link copied: ' + url);
      });
      row.appendChild(sb);

      var hb = document.createElement('button');
      hb.className = 'fav_heart';
      hb.title = 'Remove from favorites';
      hb.innerHTML = ICON_HEART;
      hb.addEventListener('click', function () {
        delete f.tag.fav;
        fav_over_set(f.tag.id, false);   // session pages see the un-heart instantly too
        apply_overrides(f.src);          // never write a stale fav state back
        favs = favs.filter(function (x) { return x !== f; });
        render();
        write_back(f.src, 'unfav ' + (f.tag.label || f.tag.id))
          .then(function () { toast('Removed from favorites'); })
          .catch(function () { toast('Save failed — try again'); });
      });
      row.appendChild(hb);

      listEl.appendChild(row);
    });
  }

  // ---- play a favorite: load its session's audio, jump to the moment ----
  function play_fav(f) {
    var url = f.src.data.audio && f.src.data.audio.url;
    if (!url) {
      // tap_select — select it anyway. Without this the row can never become the
      // current one, so its title stays readOnly and a session with no audio
      // bound is a favourite you can never rename.
      current = f; render(); toast('This session has no audio bound yet'); return;
    }
    var seek = function () {
      try { player.currentTime = f.tag.t; } catch (e) {}
      player.play().catch(function () {});
      render();
    };
    if (current && current.src === f.src) {
      current = f; seek();
    } else {
      current = f;
      nowName.textContent = f.src.name;
      player.src = url;
      player.addEventListener('loadedmetadata', function once() {
        player.removeEventListener('loadedmetadata', once);
        seek();
      });
      player.load();
    }
    render();
  }

  // fav_nudge — the six circles seek the favourite that is playing. With nothing
  // loaded they do nothing rather than starting something: the play button is
  // what starts, and a seek button that also started would be two controls in
  // one. Clamped, so +2m at the end lands on the end and not past it.
  function nudge(sec) {
    if (!current || !isFinite(player.duration) || !player.duration) return;
    player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + sec));
  }
  [['back_120', -120], ['back_15', -15], ['back_5', -5],
   ['fwd_5', 5], ['fwd_15', 15], ['fwd_120', 120]].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    if (el) el.addEventListener('click', function () { nudge(pair[1]); });
  });

  // play_same — the drawing goes in at boot, not on the first event
  playBtn.innerHTML = ICON_PLAY;
  playBtn.addEventListener('click', function () {
    if (!current) { if (favs.length) play_fav(favs[0]); return; }
    if (player.paused) player.play().catch(function () {}); else player.pause();
  });
  player.addEventListener('play', function () { playBtn.innerHTML = ICON_PAUSE; render(); });
  player.addEventListener('pause', function () { playBtn.innerHTML = ICON_PLAY; render(); });
  player.addEventListener('timeupdate', function () {
    // name_under: the clock is gone from the page, so there is nothing to write
    // the time into. fmt() stays — the rows still use it.
    if (isFinite(player.duration) && player.duration > 0) {
      favFill.style.width = (player.currentTime / player.duration * 100) + '%';
    }
  });
  favBar.addEventListener('click', function (e) {
    if (!isFinite(player.duration) || !player.duration) return;
    var r = favBar.getBoundingClientRect();
    player.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * player.duration;
  });

  load_all();
})();
</script>

</body>
</html>
